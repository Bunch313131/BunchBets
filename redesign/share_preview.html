<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Image Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: system-ui; color: #ccc; }
  h2 { font-size: 14px; color: #888; margin: 20px 0 10px; text-transform: uppercase; letter-spacing: 2px; }
  .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
  canvas { border: 1px solid #333; max-width: 100%; height: auto; }
  .controls { display: flex; gap: 8px; margin: 8px 0 14px; flex-wrap: wrap; justify-content: center; }
  .controls button { padding: 6px 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #ccc; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .controls button:hover { background: #333; }
  .controls button.active { background: #16a34a; color: #fff; border-color: #16a34a; }
  #canvasContainer { margin: 12px 0; }
  .grid-toggle { display: flex; gap: 8px; margin: 8px 0 14px; }
  .grid-toggle button { padding: 5px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #ccc; cursor: pointer; font-size: 12px; }
  .grid-toggle button.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
</style>
</head>
<body>

<h2>Share Image Preview</h2>

<div class="label">Players</div>
<div class="controls">
  <button onclick="setPlayers(2)" id="btn2">2</button>
  <button onclick="setPlayers(3)" id="btn3">3</button>
  <button onclick="setPlayers(4)" class="active" id="btn4">4</button>
  <button onclick="setPlayers(5)" id="btn5">5</button>
</div>

<div class="label">Grid Style</div>
<div class="grid-toggle">
  <button onclick="setGrid('wobbly')" id="gridWobbly" class="active">Hand-drawn</button>
  <button onclick="setGrid('straight')" id="gridStraight">Straight</button>
</div>

<div id="canvasContainer"></div>

<div class="controls">
  <button onclick="downloadImage()">Download PNG</button>
</div>

<script>
const FONT_S = '"Inter",system-ui,sans-serif';
const FONT_K = '"Kalam",Georgia,serif';

// App logo SVG
const LOGO_SVG = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" rx="38" fill="#0d3a1a"/>
  <rect x="0" y="0" width="200" height="200" rx="38" fill="url(#iBg)"/>
  <rect x="4" y="4" width="192" height="192" rx="36" fill="none" stroke="rgba(22,163,74,0.3)" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="200" rx="38" fill="url(#iGlow)" opacity="0.4"/>
  <ellipse cx="100" cy="150" rx="58" ry="14" fill="#16a34a" opacity="0.4"/>
  <ellipse cx="100" cy="150" rx="40" ry="9" fill="#16a34a" opacity="0.3"/>
  <ellipse cx="100" cy="150" rx="7" ry="3" fill="#000" opacity="0.7"/>
  <line x1="100" y1="150" x2="100" y2="36" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M100,36 L100,74 Q122,60 150,53 Q122,44 100,36Z" fill="#ffdd00"/>
  <path d="M100,36 L100,74 Q122,60 150,53 Q122,44 100,36Z" fill="url(#iFlagShine)" opacity="0.5"/>
  <circle cx="124" cy="140" r="18" fill="#f5f5f5"/>
  <circle cx="124" cy="140" r="18" fill="url(#iBallGrad)"/>
  <circle cx="116" cy="134" r="1.5" fill="rgba(0,0,0,0.1)"/>
  <circle cx="121" cy="131" r="1.5" fill="rgba(0,0,0,0.1)"/>
  <circle cx="126" cy="133" r="1.5" fill="rgba(0,0,0,0.1)"/>
  <circle cx="131" cy="135" r="1.5" fill="rgba(0,0,0,0.1)"/>
  <circle cx="118" cy="139" r="1.5" fill="rgba(0,0,0,0.1)"/>
  <circle cx="123" cy="137" r="1.5" fill="rgba(0,0,0,0.1)"/>
  <circle cx="128" cy="139" r="1.5" fill="rgba(0,0,0,0.1)"/>
  <text x="124" y="145" text-anchor="middle" font-size="16" font-weight="800" font-family="Inter,system-ui,sans-serif" fill="#16a34a" opacity="0.8">$</text>
  <circle cx="118" cy="132" r="5" fill="rgba(255,255,255,0.25)"/>
  <defs>
    <linearGradient id="iBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a2e14"/><stop offset="50%" stop-color="#061a0b"/><stop offset="100%" stop-color="#030d06"/></linearGradient>
    <linearGradient id="iFlagShine" x1="100" y1="36" x2="150" y2="74" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="iBallGrad" cx="118" cy="132" r="18" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="rgba(255,255,255,0.5)"/><stop offset="50%" stop-color="rgba(255,255,255,0)"/><stop offset="100%" stop-color="rgba(0,0,0,0.2)"/></radialGradient>
    <radialGradient id="iGlow" cx="100" cy="80" r="100" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#16a34a"/><stop offset="100%" stop-color="#16a34a" stop-opacity="0"/></radialGradient>
  </defs>
</svg>`;

let currentPlayers = 4;
let currentGrid = 'wobbly';
let currentCanvas = null;
let dummyData = null;
let logoImg = null;

// Pre-load logo
(function loadLogo() {
  const blob = new Blob([LOGO_SVG], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  logoImg = new Image();
  logoImg.onload = () => URL.revokeObjectURL(url);
  logoImg.src = url;
})();

function setPlayers(n) {
  document.querySelectorAll('.controls button[id^="btn"]').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + n).classList.add('active');
  currentPlayers = n;
  dummyData = null;
  render();
}

function setGrid(type) {
  document.getElementById('gridWobbly').classList.toggle('active', type === 'wobbly');
  document.getElementById('gridStraight').classList.toggle('active', type === 'straight');
  currentGrid = type;
  render();
}

function makeDummyData(numPlayers) {
  const names = ['Brian', 'Mike', 'Dave', 'Joe', 'Chris'];
  const players = [];
  for (let i = 0; i < numPlayers; i++) players.push({ name: names[i], id: 'p' + i });
  const par = [4,5,3,4,4,5,3,4,4, 4,3,5,4,4,3,5,4,4];
  const course = { name: 'El Macero CC', par };
  const gross = {};
  players.forEach(p => {
    const scores = [];
    for (let h = 0; h < 18; h++) {
      const base = par[h];
      const r = Math.random();
      if (r < 0.05) scores.push(base - 2);
      else if (r < 0.25) scores.push(base - 1);
      else if (r < 0.55) scores.push(base);
      else if (r < 0.80) scores.push(base + 1);
      else if (r < 0.93) scores.push(base + 2);
      else scores.push(base + 3);
    }
    gross[p.id] = scores;
  });
  return { players, course, par, gross };
}

function sumRange(arr, s, e) {
  let sum = null;
  for (let i = s; i <= e; i++) { if (arr[i] != null) sum = (sum||0) + arr[i]; }
  return sum;
}

function fmt(v) {
  if (v == null) return '$0';
  const abs = Math.abs(v);
  const str = abs % 1 === 0 ? '$' + abs : '$' + abs.toFixed(2);
  return v < -0.005 ? '-' + str : v > 0.005 ? '+' + str : '$0';
}

async function render() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('400 16px "Inter"'),
        document.fonts.load('700 16px "Inter"'),
        document.fonts.load('800 16px "Inter"'),
        document.fonts.load('400 16px "Kalam"'),
        document.fonts.load('700 16px "Kalam"')
      ]),
      new Promise((_, r) => setTimeout(r, 2000))
    ]);
  } catch(e) {}

  const fS = FONT_S;
  const fK = FONT_K;

  if (!dummyData) dummyData = makeDummyData(currentPlayers);
  const { players, course, par, gross } = dummyData;
  const numP = players.length;

  const playerData = players.map(p => {
    const arr = gross[p.id] || [];
    const scores = [];
    for (let i = 0; i < 18; i++) scores.push(arr[i] ?? null);
    const f = sumRange(arr, 0, 8);
    const b = sumRange(arr, 9, 17);
    const t = (f == null && b == null) ? null : ((f||0) + (b||0));
    return { name: p.name, id: p.id, scores, front: f, back: b, total: t };
  });

  const gameLines = [
    { label: 'Nassau', type: 'team',
      teamLabel: 'Brian / Dave vs Mike / Joe',
      segmentLines: [
        ['Front: +$5/ea', 'Back: -$10/ea', 'Overall: +$5/ea'],
        ['Junk: +$3/ea'],
        ['Total: +$3/ea'],
      ]
    },
    { label: 'Vegas', type: 'team',
      teamLabel: 'Brian / Dave vs Mike / Joe',
      segmentLines: [
        ['Front: +$12/ea', 'Back: -$8/ea', 'Overall: +$4/ea'],
        ['Junk: +$2/ea'],
        ['Total: +$6/ea'],
      ]
    },
    { label: 'Nassau', type: 'team',
      teamLabel: 'Brian / Dave vs Mike / Joe',
      segmentLines: [
        ['Front: +$10/ea', 'Back: +$10/ea', 'Overall: -$10/ea'],
        ['Total: +$10/ea'],
      ]
    },
    { label: 'Vegas', type: 'team',
      teamLabel: 'Brian / Dave vs Mike / Joe',
      segmentLines: [
        ['Front: -$6/ea', 'Back: +$14/ea', 'Overall: +$8/ea'],
        ['Junk: +$1/ea'],
        ['Total: +$17/ea'],
      ]
    },
    { label: 'Skins $2', type: 'individual', rows: [
      { name: 'Brian', detail: '3 skins', net: 8 },
      { name: 'Mike', detail: '1 skin', net: -2 },
      { name: 'Dave', detail: '1 skin', net: -2 },
      { name: 'Joe', detail: '0 skins', net: -4 },
    ]},
    { label: 'Wolf $2', type: 'individual', rows: [
      { name: 'Brian', detail: '6 pts', net: 8 },
      { name: 'Mike', detail: '3 pts', net: -4 },
      { name: 'Dave', detail: '4 pts', net: 2 },
      { name: 'Joe', detail: '2 pts', net: -6 },
    ]},
    { label: '9-Point $1', type: 'individual', rows: [
      { name: 'Brian', detail: '14 pts', net: 6 },
      { name: 'Mike', detail: '8 pts', net: -3 },
      { name: 'Dave', detail: '10 pts', net: 1 },
      { name: 'Joe', detail: '4 pts', net: -4 },
    ]},
  ];

  const net = {};
  players.forEach((p, i) => { net[p.id] = [12, -8, 3, -7, 0][i] || 0; });
  const xfers = [];
  if (numP >= 2) xfers.push({ from: players[1].name, to: players[0].name, amount: 8 });
  if (numP >= 3) xfers.push({ from: players[3]?.name || 'Joe', to: players[2].name, amount: 3 });
  if (numP >= 4) xfers.push({ from: players[3].name, to: players[0].name, amount: 4 });

  // Seeded random
  let seed = 1;
  if (course.name) for (let i = 0; i < course.name.length; i++) seed = (seed * 31 + course.name.charCodeAt(i)) & 0x7fffffff;
  seed = seed || 12345;
  const srand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  const P = {
    paper: '#f5f0e1', paperDark: '#ebe5d3', ink: '#2c2c2c', inkLight: '#8a7e6b',
    green: '#1a5632', greenInk: '#1a6b35', redInk: '#c0392b',
    gold: '#b8960c', grid: '#c4b99a', white: '#faf8f0'
  };

  // Dynamic sizing
  const scale = 2;
  const padLR = 20;
  const mc = document.createElement('canvas').getContext('2d');
  mc.font = `bold 14px ${fS}`;
  const holeW = Math.max(42, mc.measureText('Hole').width + 16);
  const parW = Math.max(42, mc.measureText('Par').width + 16);
  mc.font = `bold 13px ${fS}`;
  let maxNameW = 0;
  playerData.forEach(p => {
    const nm = p.name.length > 8 ? p.name.substring(0, 8) : p.name;
    maxNameW = Math.max(maxNameW, mc.measureText(nm).width);
  });
  mc.font = `16px ${fK}`;
  const scoreW = mc.measureText('88').width;
  const playerW = Math.max(scoreW + 28, maxNameW + 14);

  const tableW = holeW + parW + numP * playerW;
  const W = tableW + 2 * padLR;
  const rowH = 28;
  const headerH = 58, courseH = 44;
  const numTableRows = 22;
  const tableH = numTableRows * rowH;

  // Pre-measure game & settle sections height (they go ABOVE scorecard now)
  let gameSectionH = 0;
  if (gameLines.length > 0) {
    gameSectionH = 32; // section header
    gameLines.forEach(game => {
      gameSectionH += 22; // game label line
      if (game.type === 'team') {
        gameSectionH += 16; // team subtitle line
        gameSectionH += (game.segmentLines?.length || 0) * 15; // segment lines
      } else {
        gameSectionH += game.rows.length * 18; // per-player lines
      }
      gameSectionH += 8; // gap after game
    });
  }

  const settleSectionH = 32 + numP * 20 + (xfers.length ? 2 + xfers.length * 20 : 0);
  const footerH = 40;
  const H = headerH + courseH + gameSectionH + 16 + settleSectionH + 20 + tableH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  const useWobbly = currentGrid === 'wobbly';

  const drawLine = (x1, y1, x2, y2, amp) => {
    if (!useWobbly) {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      return;
    }
    amp = amp || 0.7;
    const steps = Math.max(3, Math.ceil(Math.hypot(x2-x1, y2-y1) / 25));
    ctx.beginPath(); ctx.moveTo(x1, y1);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      ctx.lineTo(
        x1 + (x2-x1)*t + (i < steps ? (srand()-0.5)*amp : 0),
        y1 + (y2-y1)*t + (i < steps ? (srand()-0.5)*amp : 0)
      );
    }
    ctx.stroke();
  };

  const drawCircle = (cx, cy, r) => {
    if (!useWobbly) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke(); return; }
    ctx.beginPath();
    const pts = Math.ceil(Math.PI * 2 / 0.12);
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const rr = r + (srand()-0.5) * 1.0;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  };

  const drawRect = (cx, cy, s) => {
    if (!useWobbly) { const h=s/2; ctx.strokeRect(cx-h,cy-h,s,s); return; }
    const h = s/2;
    drawLine(cx-h,cy-h,cx+h,cy-h,0.5); drawLine(cx+h,cy-h,cx+h,cy+h,0.5);
    drawLine(cx+h,cy+h,cx-h,cy+h,0.5); drawLine(cx-h,cy+h,cx-h,cy-h,0.5);
  };

  // Helper: section divider with centered title
  const drawDivider = (title, atY) => {
    ctx.font = `bold 11px ${fS}`;
    const tw = ctx.measureText(title).width;
    const dp = 10;
    ctx.strokeStyle = P.grid; ctx.lineWidth = 0.8;
    drawLine(padLR, atY + 9, W/2 - tw/2 - dp, atY + 9);
    drawLine(W/2 + tw/2 + dp, atY + 9, W - padLR, atY + 9);
    ctx.fillStyle = P.inkLight;
    ctx.textAlign = 'center';
    ctx.fillText(title, W/2, atY + 13);
  };

  // =====================
  // === START DRAWING ===
  // =====================

  // Background: parchment
  ctx.fillStyle = P.paper;
  ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.05)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(180,170,150,0.07)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 15; i++) {
    const fy = srand() * H;
    ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy + (srand()-0.5)*2); ctx.stroke();
  }

  // ========================================
  // === 1. GREEN HEADER BAR (logo + text) ===
  // ========================================
  let y = 0;
  const hdrGrad = ctx.createLinearGradient(0, 0, 0, headerH);
  hdrGrad.addColorStop(0, '#1e6b3a');
  hdrGrad.addColorStop(1, '#0f3d1e');
  ctx.fillStyle = hdrGrad;
  ctx.fillRect(0, 0, W, headerH);
  ctx.fillStyle = P.gold;
  ctx.fillRect(0, headerH - 2.5, W, 2.5);
  ctx.fillStyle = 'rgba(184,150,12,0.3)';
  ctx.fillRect(0, 0, W, 1.5);

  // Logo — left side
  const logoSize = 38;
  const logoPad = 12;
  if (logoImg && logoImg.complete) {
    ctx.save();
    const lx = logoPad, ly = (headerH - logoSize) / 2;
    // Rounded clip for logo
    const lr = 8;
    ctx.beginPath();
    ctx.moveTo(lx + lr, ly);
    ctx.lineTo(lx + logoSize - lr, ly);
    ctx.quadraticCurveTo(lx + logoSize, ly, lx + logoSize, ly + lr);
    ctx.lineTo(lx + logoSize, ly + logoSize - lr);
    ctx.quadraticCurveTo(lx + logoSize, ly + logoSize, lx + logoSize - lr, ly + logoSize);
    ctx.lineTo(lx + lr, ly + logoSize);
    ctx.quadraticCurveTo(lx, ly + logoSize, lx, ly + logoSize - lr);
    ctx.lineTo(lx, ly + lr);
    ctx.quadraticCurveTo(lx, ly, lx + lr, ly);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(logoImg, lx, ly, logoSize, logoSize);
    ctx.restore();
  }

  // "BUNCH BETS" — right side
  ctx.fillStyle = P.white;
  ctx.font = `800 22px ${fS}`;
  ctx.textAlign = 'right';
  ctx.fillText('BUNCH BETS', W - logoPad, headerH/2 + 8);
  y = headerH;

  // ============================
  // === 2. COURSE & DATE ===
  // ============================
  ctx.fillStyle = P.ink;
  ctx.font = `600 15px ${fS}`;
  ctx.textAlign = 'center';
  const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  ctx.fillText(`${course.name}  \u00b7  ${dateStr}`, W/2, y + 28);
  ctx.strokeStyle = P.grid; ctx.lineWidth = 0.8;
  drawLine(padLR + 30, y + 36, W - padLR - 30, y + 36);
  y += courseH;

  // =====================================
  // === 3. GAME RESULTS (all Kalam) ===
  // =====================================
  if (gameLines.length > 0) {
    drawDivider('GAME RESULTS', y);
    y += 32;

    gameLines.forEach(game => {
      // Game label — Kalam bold
      ctx.fillStyle = P.ink;
      ctx.font = `bold 16px ${fK}`;
      ctx.textAlign = 'left';
      ctx.fillText(game.label, padLR + 8, y + 16);
      y += 22;
      if (game.type === 'team') {
        // Team subtitle — "Brian / Dave vs Mike / Joe"
        ctx.fillStyle = P.inkLight;
        ctx.font = `13px ${fK}`;
        ctx.textAlign = 'left';
        ctx.fillText(game.teamLabel, padLR + 14, y + 12);
        y += 16;
        // Segment lines (Front/Back/Overall on one, Junk, Total)
        if (game.segmentLines) {
          game.segmentLines.forEach((lineSegs, li) => {
            const isTotal = li === game.segmentLines.length - 1;
            ctx.font = isTotal ? `bold 13px ${fK}` : `13px ${fK}`;
            ctx.fillStyle = P.ink;
            ctx.textAlign = 'left';
            ctx.fillText(lineSegs.join(' \u00b7 '), padLR + 14, y + 12);
            y += 15;
          });
        }
      } else {
        // Individual games — per-player with detail, no colors
        game.rows.forEach(row => {
          ctx.textAlign = 'left';
          const netStr = (row.net > 0 ? '+$' + row.net : row.net < 0 ? '-$' + Math.abs(row.net) : '$0');
          ctx.fillStyle = P.inkLight;
          ctx.font = `14px ${fK}`;
          const nameStr = `${row.name}: ${row.detail}`;
          ctx.fillText(nameStr, padLR + 14, y + 13);
          const nameW2 = ctx.measureText(nameStr + '  ').width;
          ctx.fillStyle = P.ink;
          ctx.font = `bold 14px ${fK}`;
          ctx.fillText(netStr, padLR + 14 + nameW2, y + 13);
          y += 18;
        });
      }
      y += 8;
    });
  }

  y += 16;

  // ================================
  // === 4. SETTLE UP (all Kalam) ===
  // ================================
  drawDivider('SETTLE UP', y);
  y += 32;

  // Per-player net — all Kalam
  players.forEach(p => {
    const val = net[p.id];
    const color = val > 0.005 ? P.greenInk : val < -0.005 ? P.redInk : P.ink;
    ctx.fillStyle = color;
    ctx.font = `bold 16px ${fK}`;
    ctx.textAlign = 'left';
    ctx.fillText(`${p.name}:  ${fmt(val)}`, padLR + 12, y + 15);
    y += 20;
  });

  // Transfers — all Kalam
  if (xfers.length) {
    y += 2;
    xfers.forEach(x => {
      if (!x.from) return;
      ctx.fillStyle = P.ink;
      ctx.font = `15px ${fK}`;
      ctx.textAlign = 'left';
      ctx.fillText(`${x.from}  \u2192  ${x.to}:  $${x.amount}`, padLR + 14, y + 15);
      y += 20;
    });
  }

  y += 20;

  // ============================
  // === 5. SCORECARD TABLE ===
  // ============================
  const tx = padLR;
  let cy = y;

  const rowDefs = [];
  for (let h = 0; h < 9; h++) rowDefs.push({ type: 'hole', idx: h });
  rowDefs.push({ type: 'sum', label: 'OUT', key: 'front' });
  for (let h = 9; h < 18; h++) rowDefs.push({ type: 'hole', idx: h });
  rowDefs.push({ type: 'sum', label: 'IN', key: 'back' });
  rowDefs.push({ type: 'sum', label: 'TOT', key: 'total' });

  let fPar = 0, bPar = 0;
  for (let i = 0; i < 9; i++) fPar += (par[i] || 0);
  for (let i = 9; i < 18; i++) bPar += (par[i] || 0);
  const tPar = fPar + bPar;

  // Column header — INTER
  ctx.fillStyle = P.green;
  ctx.fillRect(tx, cy, tableW, rowH);
  ctx.fillStyle = P.white;
  ctx.font = `bold 13px ${fS}`;
  ctx.textAlign = 'center';
  ctx.fillText('HOLE', tx + holeW/2, cy + 18);
  ctx.fillText('PAR', tx + holeW + parW/2, cy + 18);
  for (let pi = 0; pi < numP; pi++) {
    const nm = playerData[pi].name.length > 8 ? playerData[pi].name.substring(0, 8) : playerData[pi].name;
    ctx.fillText(nm.toUpperCase(), tx + holeW + parW + pi * playerW + playerW/2, cy + 18);
  }
  cy += rowH;

  // Data rows
  rowDefs.forEach((row, ri) => {
    const isSum = row.type === 'sum';
    ctx.fillStyle = isSum ? P.paperDark : (ri % 2 === 0 ? P.paper : 'rgba(196,185,154,0.13)');
    ctx.fillRect(tx, cy, tableW, rowH);

    // Hole number / label — INTER
    ctx.fillStyle = P.ink;
    ctx.font = isSum ? `bold 13px ${fS}` : `13px ${fS}`;
    ctx.textAlign = 'center';
    ctx.fillText(isSum ? row.label : String(row.idx + 1), tx + holeW/2, cy + 18);

    // Par — INTER
    ctx.fillStyle = isSum ? P.ink : P.inkLight;
    ctx.font = isSum ? `bold 13px ${fS}` : `13px ${fS}`;
    const parVal = isSum ? (row.key === 'front' ? fPar : row.key === 'back' ? bPar : tPar) : (par[row.idx] || '');
    ctx.fillText(String(parVal), tx + holeW + parW/2, cy + 18);

    // Scores — KALAM
    for (let pi = 0; pi < numP; pi++) {
      const colCx = tx + holeW + parW + pi * playerW + playerW/2;
      const colCy = cy + rowH/2;

      if (isSum) {
        const val = playerData[pi][row.key];
        ctx.fillStyle = P.ink;
        ctx.font = `bold 16px ${fK}`;
        ctx.textAlign = 'center';
        ctx.fillText(val != null ? String(val) : '\u2013', colCx, cy + 19);
      } else {
        const score = playerData[pi].scores[row.idx];
        const hp = par[row.idx] || 4;

        if (score != null) {
          const diff = score - hp;
          if (diff <= -2) {
            ctx.strokeStyle = P.greenInk; ctx.lineWidth = 1.2;
            drawCircle(colCx, colCy, 9); drawCircle(colCx, colCy, 13);
          } else if (diff === -1) {
            ctx.strokeStyle = P.greenInk; ctx.lineWidth = 1.2;
            drawCircle(colCx, colCy, 11);
          } else if (diff === 1) {
            ctx.strokeStyle = P.redInk; ctx.lineWidth = 1.2;
            drawRect(colCx, colCy, 22);
          } else if (diff >= 2) {
            ctx.strokeStyle = P.redInk; ctx.lineWidth = 1.2;
            drawRect(colCx, colCy, 18); drawRect(colCx, colCy, 24);
          }

          ctx.fillStyle = diff < 0 ? P.greenInk : diff > 0 ? P.redInk : P.ink;
          ctx.font = `16px ${fK}`;
          ctx.textAlign = 'center';
          ctx.fillText(String(score), colCx, cy + 19);
        } else {
          ctx.fillStyle = P.inkLight;
          ctx.font = `15px ${fK}`;
          ctx.textAlign = 'center';
          ctx.fillText('\u2013', colCx, cy + 19);
        }
      }
    }
    cy += rowH;
  });

  // Grid lines
  const tableTop = y, tableBot = cy;
  let gy = tableTop;
  for (let r = 0; r <= numTableRows; r++) {
    const thick = r === 0 || r === numTableRows || r === 1 || r === 10 || r === 11 || r === 20 || r === 21;
    ctx.strokeStyle = thick ? 'rgba(140,128,100,0.6)' : P.grid;
    ctx.lineWidth = thick ? 1.3 : 0.6;
    drawLine(tx, gy, tx + tableW, gy);
    gy += rowH;
  }
  ctx.strokeStyle = P.grid;
  ctx.lineWidth = 1.2;
  drawLine(tx, tableTop, tx, tableBot);
  drawLine(tx + tableW, tableTop, tx + tableW, tableBot);
  ctx.lineWidth = 0.9;
  drawLine(tx + holeW, tableTop, tx + holeW, tableBot);
  drawLine(tx + holeW + parW, tableTop, tx + holeW + parW, tableBot);
  ctx.lineWidth = 0.5;
  for (let pi = 1; pi < numP; pi++) {
    drawLine(tx + holeW + parW + pi * playerW, tableTop, tx + holeW + parW + pi * playerW, tableBot);
  }

  // ================
  // === 6. FOOTER ===
  // ================
  ctx.fillStyle = P.inkLight;
  ctx.font = `500 11px ${fS}`;
  ctx.textAlign = 'center';
  ctx.fillText('\u26f3  bunchbets.com', W/2, H - 14);

  // Display
  const container = document.getElementById('canvasContainer');
  container.innerHTML = '';
  canvas.style.maxWidth = '100%';
  canvas.style.height = 'auto';
  container.appendChild(canvas);
  currentCanvas = canvas;
}

function downloadImage() {
  if (!currentCanvas) return;
  const link = document.createElement('a');
  link.download = 'bunch-bets-scorecard.png';
  link.href = currentCanvas.toDataURL('image/png');
  link.click();
}

setTimeout(() => render(), 600);
</script>

</body>
