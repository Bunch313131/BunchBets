  share() {
    try {
      const lines = ['Round Summary from Bunch Bets:',''];
      lines.push('Player Scores:');
      State.data.players.forEach(p => {
        const g = State.data.games[0];
        const arr = g.gross[p.id] || [];
        const f = Utils.sumRange(arr,0,8);
        const b = Utils.sumRange(arr,9,17);
        const t = (f==null && b==null)?null:((f||0)+(b||0));
        lines.push(`  ${p.name}: ${f??'-'} / ${b??'-'} / ${t??'-'}`);
      });
      lines.push('');

      State.data.games.forEach(g => {
        lines.push(this.gameLabel(g));
        if (g.gameType === 'vegas') {
          const res = Game.computeVegasResult(g);
          const sz = (g.teamA||[]).length || 1;
          lines.push(`  Front:   ${Utils.fmt(res.frontPoints * (g.pointValue.front||0))}/ea`);
          lines.push(`  Back:    ${Utils.fmt(res.backPoints * (g.pointValue.back||0))}/ea`);
          lines.push(`  Junk:    ${Utils.fmt(res.junkValue / sz)}/ea`);
          if (res.kpValue !== 0) lines.push(`  KP:      ${Utils.fmt(res.kpValue / sz)}/ea${res.kp.hasSweeps ? ' (Sweeps!)' : ''}${res.kp.hasQuads ? ' (Quads!)' : ''}`);
          lines.push(`  Total:   ${Utils.fmt(res.totalValue / sz)}/ea`);
        } else if (g.gameType === 'skins') {
          const res = Game.computeSkinsResult(g);
          const players = g.skinsPlayers || [];
          players.forEach(pid => {
            const pr = res.playerResults[pid];
            if (pr) lines.push(`  ${UI.playerName(pid)}: ${pr.totalSkins} skins = ${Utils.fmt(pr.profit)}`);
          });
        } else if (g.gameType === 'wolf') {
          const res = Game.computeWolfResult(g);
          (g.wolfPlayers||[]).forEach(pid => {
            lines.push(`  ${UI.playerName(pid)}: ${Utils.fmt(res.playerNet[pid]||0)}`);
          });
        } else if (g.gameType === 'ninepoint') {
          const res = Game.computeNinePointResult(g);
          (g.ninePointPlayers||[]).forEach(pid => {
            lines.push(`  ${UI.playerName(pid)}: ${Utils.fmt(res.playerNet[pid]||0)}`);
          });
        } else {
          const res = Game.computeResult(g);
          const sz = (g.teamA||[]).length || 1;
          lines.push(`  Front:   ${Utils.fmt(res.segments.front.payA)}/ea`);
          lines.push(`  Back:    ${Utils.fmt(res.segments.back.payA)}/ea`);
          lines.push(`  Overall: ${Utils.fmt(res.segments.overall.payA)}/ea`);
          lines.push(`  Junk:    ${Utils.fmt(res.teamTotals.junk / sz)}/ea`);
          if (res.teamTotals.kp !== 0) lines.push(`  KP:      ${Utils.fmt(res.teamTotals.kp / sz)}/ea${res.kp.hasSweeps ? ' (Sweeps!)' : ''}${res.kp.hasQuads ? ' (Quads!)' : ''}`);
          lines.push(`  Total:   ${Utils.fmt(res.teamTotals.total / sz)}/ea`);
        }
        lines.push('');
      });

      const net = {};
      State.data.players.forEach(p => net[p.id] = 0);
      State.data.games.forEach(g => {
        const gameNet = Game.computeGamePlayerNet(g);
        Object.keys(gameNet).forEach(pid => { net[pid] = (net[pid]||0) + gameNet[pid]; });
      });

      lines.push('Per-Player Net:');
      State.data.players.forEach(p => lines.push(`  ${p.name}: ${Utils.fmt(net[p.id])}`));

      const xfers = this.calcTransfers(net);
      if (xfers.length) {
        lines.push('');
        lines.push('Transfers:');
        xfers.forEach(x => lines.push(`  ${UI.playerName(x.from)} → ${UI.playerName(x.to)} : ${Utils.fmt(x.amount)}`));
      }

      const txt = lines.join('\n');

      if (navigator.share) {
        navigator.share({text:txt}).catch(() => alert(txt));
      } else if (/Mobi|Android/i.test(navigator.userAgent)) {
        window.location.href = `sms:?&body=${encodeURIComponent(txt)}`;
      } else {
        alert(txt);
      }
    } catch(e) {
      Err.show('Share failed: ' + e.message);
    }
  },

  async shareImage() {
    try {
      const players = State.data.players;
      const games = State.data.games;
      const course = State.data.course;
      const par = course.par;
      const g0 = games[0];
      if (!g0) { Err.toast('No game data to share'); return; }

      // Gather player scores
      const playerData = players.map(p => {
        const arr = (g0.gross[p.id]) || [];
        const scores = [];
        for (let i = 0; i < 18; i++) scores.push(arr[i] ?? null);
        const f = Utils.sumRange(arr, 0, 8);
        const b = Utils.sumRange(arr, 9, 17);
        const t = (f == null && b == null) ? null : ((f||0) + (b||0));
        return { name: p.name, id: p.id, scores, front: f, back: b, total: t };
      });

      // Gather game results
      const gameThemes = ['#16a34a','#dc2626','#d97706','#6366f1','#14b8a6','#db2777'];
      const gameLines = [];
      games.forEach((g, gi) => {
        if (!Game.hasAnyScores(g)) return;
        const color = gameThemes[gi % 6];
        if (g.gameType === 'vegas') {
          const res = Game.computeVegasResult(g);
          const sz = (g.teamA||[]).length || 1;
          const vegasVals = [`Front: ${Utils.fmt(res.frontPoints*(g.pointValue.front||0))}/ea`, `Back: ${Utils.fmt(res.backPoints*(g.pointValue.back||0))}/ea`, `Junk: ${Utils.fmt(res.junkValue/sz)}/ea`];
          if (res.kpValue !== 0) vegasVals.push(`KP: ${Utils.fmt(res.kpValue/sz)}/ea`);
          vegasVals.push(`Total: ${Utils.fmt(res.totalValue/sz)}/ea`);
          gameLines.push({ label: this.gameLabel(g), color, values: vegasVals});
        } else if (g.gameType === 'skins') {
          const res = Game.computeSkinsResult(g);
          const top = (g.skinsPlayers||[]).reduce((best, pid) => {
            const pr = res.playerResults[pid];
            return pr && pr.profit > (best?.profit ?? -Infinity) ? {name:this.playerName(pid), profit:pr.profit} : best;
          }, null);
          gameLines.push({ label: this.gameLabel(g), color, values: [
            `Skins Won: ${res.totalGrossSkins + res.totalNetSkins}`, top ? `Leader: ${top.name} ${Utils.fmt(top.profit)}` : ''
          ].filter(Boolean)});
        } else if (g.gameType === 'wolf') {
          const res = Game.computeWolfResult(g);
          gameLines.push({ label: this.gameLabel(g), color, values: [`Total Pot: ${Utils.fmt(res.totalMoney)}`]});
        } else {
          const res = Game.computeResult(g);
          const sz = (g.teamA||[]).length || 1;
          const nassauVals = [`Front: ${Utils.fmt(res.segments.front.payA)}/ea`, `Back: ${Utils.fmt(res.segments.back.payA)}/ea`, `Overall: ${Utils.fmt(res.segments.overall.payA)}/ea`, `Junk: ${Utils.fmt(res.teamTotals.junk/sz)}/ea`];
          if (res.teamTotals.kp !== 0) nassauVals.push(`KP: ${Utils.fmt(res.teamTotals.kp/sz)}/ea`);
          nassauVals.push(`Total: ${Utils.fmt(res.teamTotals.total/sz)}/ea`);
          gameLines.push({ label: this.gameLabel(g), color, values: nassauVals});
        }
      });

      // Compute per-player net using unified helper
      const net = {};
      players.forEach(p => net[p.id] = 0);
      games.forEach(g => {
        if (!Game.hasAnyScores(g)) return;
        const gameNet = Game.computeGamePlayerNet(g);
        Object.keys(gameNet).forEach(pid => { net[pid] = (net[pid]||0) + gameNet[pid]; });
      });
      const xfers = this.calcTransfers(net);

      // --- Canvas Setup ---
      const scale = 2;
      const pad = 24;
      const colW = 44;
      const nameW = 96;
      const rowH = 34;
      const font = '-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';

      const C = {
        bg:'#0b0e13', card:'#141a26', text:'#ecf0f6', muted:'#8890a0',
        border:'#1e2633', headerBg:'#0f1420', parBg:'#111827',
        birdie:'#16a34a', bogey:'#dc2626', accent:'#3b82f6'
      };

      const back9Cols = 11; // 9 holes + IN + TOT
      const tableW = nameW + back9Cols * colW;
      const W = tableW + pad * 2;
      const numPlayers = players.length;
      const tableRows = 2 + numPlayers;

      // Pre-calculate height
      const titleH = 70;
      const gap = 16;
      const front9H = tableRows * rowH;
      const back9H = tableRows * rowH;
      const gameH = gameLines.length > 0 ? 28 + gameLines.length * 54 : 0;
      const settlH = 28 + numPlayers * 24 + (xfers.length ? 28 + xfers.length * 24 : 0);
      const footerH = 36;
      const H = titleH + gap + front9H + gap + back9H + gap + gameH + gap + settlH + footerH;

      const canvas = document.createElement('canvas');
      canvas.width = W * scale;
      canvas.height = H * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      // Background
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);

      // --- Title ---
      ctx.fillStyle = C.card;
      ctx.fillRect(0, 0, W, titleH);
      ctx.fillStyle = C.border;
      ctx.fillRect(0, titleH - 1, W, 1);
      ctx.fillStyle = C.text;
      ctx.font = `bold 22px ${font}`;
      ctx.textAlign = 'center';
      ctx.fillText('Bunch Bets', W/2, 32);
      ctx.fillStyle = C.muted;
      ctx.font = `13px ${font}`;
      const dateStr = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      ctx.fillText(`${course.name}  \u00b7  ${dateStr}`, W/2, 52);

      let y = titleH + gap;

      // --- Helper: draw scorecard table ---
      const drawTable = (startHole, endHole, summaryLabels, yStart) => {
        const numHoles = endHole - startHole + 1;
        const numSumm = summaryLabels.length;
        const numCols = numHoles + numSumm;
        const tW = nameW + numCols * colW;
        const tx = pad;
        let cy = yStart;

        // Par sums
        let segParSum = 0;
        for (let i = startHole; i <= endHole; i++) segParSum += (par[i]||0);
        let totalPar = 0;
        for (let i = 0; i < 18; i++) totalPar += (par[i]||0);

        // Hole header row
        ctx.fillStyle = C.headerBg;
        ctx.fillRect(tx, cy, tW, rowH);
        ctx.fillStyle = C.muted;
        ctx.font = `bold 11px ${font}`;
        ctx.textAlign = 'center';
        ctx.fillText('Hole', tx + nameW/2, cy + 21);
        for (let i = 0; i < numHoles; i++) {
          ctx.fillText(String(startHole+i+1), tx + nameW + i*colW + colW/2, cy + 21);
        }
        ctx.fillStyle = C.text;
        ctx.font = `bold 12px ${font}`;
        for (let s = 0; s < numSumm; s++) {
          ctx.fillText(summaryLabels[s], tx + nameW + (numHoles+s)*colW + colW/2, cy + 21);
        }
        ctx.strokeStyle = C.border;
        ctx.lineWidth = 1;
        ctx.strokeRect(tx, cy, tW, rowH);
        cy += rowH;

        // Par row
        ctx.fillStyle = C.parBg;
        ctx.fillRect(tx, cy, tW, rowH);
        ctx.fillStyle = C.muted;
        ctx.font = `12px ${font}`;
        ctx.textAlign = 'center';
        ctx.fillText('Par', tx + nameW/2, cy + 21);
        for (let i = 0; i < numHoles; i++) {
          ctx.fillText(String(par[startHole+i]||''), tx + nameW + i*colW + colW/2, cy + 21);
        }
        ctx.fillStyle = C.text;
        ctx.font = `bold 12px ${font}`;
        ctx.fillText(String(segParSum), tx + nameW + numHoles*colW + colW/2, cy + 21);
        if (numSumm > 1) ctx.fillText(String(totalPar), tx + nameW + (numHoles+1)*colW + colW/2, cy + 21);
        ctx.strokeStyle = C.border;
        ctx.strokeRect(tx, cy, tW, rowH);
        cy += rowH;

        // Player rows
        playerData.forEach((p, pi) => {
          ctx.fillStyle = pi % 2 === 0 ? C.card : C.bg;
          ctx.fillRect(tx, cy, tW, rowH);

          // Name
          ctx.fillStyle = C.text;
          ctx.font = `13px ${font}`;
          ctx.textAlign = 'left';
          const displayName = p.name.length > 10 ? p.name.substring(0,10) : p.name;
          ctx.fillText(displayName, tx + 8, cy + 21);

          // Hole scores
          ctx.textAlign = 'center';
          for (let i = 0; i < numHoles; i++) {
            const hIdx = startHole + i;
            const score = p.scores[hIdx];
            const hp = par[hIdx] || 4;
            const cx = tx + nameW + i*colW + colW/2;
            const cyC = cy + rowH/2;

            if (score != null) {
              const diff = score - hp;
              // Draw indicators
              if (diff <= -2) {
                ctx.strokeStyle = C.birdie; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(cx, cyC, 11, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cyC, 15, 0, Math.PI*2); ctx.stroke();
              } else if (diff === -1) {
                ctx.strokeStyle = C.birdie; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(cx, cyC, 13, 0, Math.PI*2); ctx.stroke();
              } else if (diff === 1) {
                ctx.strokeStyle = C.bogey; ctx.lineWidth = 1.5;
                ctx.strokeRect(cx-12, cyC-12, 24, 24);
              } else if (diff >= 2) {
                ctx.strokeStyle = C.bogey; ctx.lineWidth = 1.5;
                ctx.strokeRect(cx-10, cyC-10, 20, 20);
                ctx.strokeRect(cx-14, cyC-14, 28, 28);
              }
              ctx.fillStyle = C.text;
              ctx.font = `13px ${font}`;
              ctx.fillText(String(score), cx, cy + 22);
            } else {
              ctx.fillStyle = C.muted;
              ctx.font = `13px ${font}`;
              ctx.fillText('\u2013', cx, cy + 22);
            }
          }

          // Summary columns
          ctx.fillStyle = C.text;
          ctx.font = `bold 13px ${font}`;
          if (summaryLabels[0] === 'OUT') {
            ctx.fillText(p.front != null ? String(p.front) : '\u2013', tx + nameW + numHoles*colW + colW/2, cy + 22);
          } else {
            ctx.fillText(p.back != null ? String(p.back) : '\u2013', tx + nameW + numHoles*colW + colW/2, cy + 22);
            if (numSumm > 1) {
              ctx.fillText(p.total != null ? String(p.total) : '\u2013', tx + nameW + (numHoles+1)*colW + colW/2, cy + 22);
            }
          }

          // Row border
          ctx.strokeStyle = C.border;
          ctx.lineWidth = 0.5;
          ctx.strokeRect(tx, cy, tW, rowH);
          cy += rowH;
        });

        // Summary column separator line
        ctx.strokeStyle = C.border;
        ctx.lineWidth = 1.5;
        const sepX = tx + nameW + numHoles * colW;
        ctx.beginPath(); ctx.moveTo(sepX, yStart); ctx.lineTo(sepX, cy); ctx.stroke();

        // Name column separator
        ctx.beginPath(); ctx.moveTo(tx + nameW, yStart); ctx.lineTo(tx + nameW, cy); ctx.stroke();

        return cy;
      };

      // Draw Front 9
      y = drawTable(0, 8, ['OUT'], y);
      y += gap;

      // Draw Back 9
      y = drawTable(9, 17, ['IN','TOT'], y);
      y += gap;

      // --- Game Results ---
      if (gameLines.length > 0) {
        ctx.fillStyle = C.muted;
        ctx.font = `bold 11px ${font}`;
        ctx.textAlign = 'left';
        ctx.fillText('GAME RESULTS', pad, y + 16);
        y += 28;

        gameLines.forEach(game => {
          const boxH = 44;
          ctx.fillStyle = C.card;
          ctx.fillRect(pad, y, tableW, boxH);
          // Colored left accent
          ctx.fillStyle = game.color;
          ctx.fillRect(pad, y, 4, boxH);
          // Border
          ctx.strokeStyle = C.border;
          ctx.lineWidth = 0.5;
          ctx.strokeRect(pad, y, tableW, boxH);
          // Label
          ctx.fillStyle = C.text;
          ctx.font = `bold 12px ${font}`;
          ctx.textAlign = 'left';
          ctx.fillText(game.label, pad + 14, y + 17);
          // Values
          ctx.fillStyle = C.muted;
          ctx.font = `11px ${font}`;
          ctx.fillText(game.values.join('  \u00b7  '), pad + 14, y + 34);
          y += boxH + 6;
        });
      }

      y += gap;

      // --- Settlements ---
      ctx.fillStyle = C.muted;
      ctx.font = `bold 11px ${font}`;
      ctx.textAlign = 'left';
      ctx.fillText('SETTLEMENTS', pad, y + 16);
      y += 28;

      // Per-player net in a row
      players.forEach(p => {
        const val = net[p.id];
        ctx.fillStyle = val > 0.005 ? C.birdie : val < -0.005 ? C.bogey : C.text;
        ctx.font = `13px ${font}`;
        ctx.textAlign = 'left';
        ctx.fillText(`${p.name}: ${Utils.fmt(val)}`, pad + 12, y + 14);
        y += 24;
      });

      if (xfers.length) {
        y += 4;
        ctx.fillStyle = C.muted;
        ctx.font = `bold 11px ${font}`;
        ctx.fillText('TRANSFERS', pad + 12, y + 14);
        y += 24;
        xfers.forEach(x => {
          ctx.fillStyle = C.text;
          ctx.font = `13px ${font}`;
          ctx.fillText(`${this.playerName(x.from)}  \u2192  ${this.playerName(x.to)}: ${Utils.fmt(x.amount)}`, pad + 12, y + 14);
          y += 24;
        });
      }

      // --- Footer ---
      ctx.fillStyle = C.muted;
      ctx.font = `10px ${font}`;
      ctx.textAlign = 'center';
      ctx.fillText('Generated by Bunch Bets', W/2, H - 12);

      // --- Share or download the image ---
      canvas.toBlob(async (blob) => {
        if (!blob) { Err.show('Failed to generate image'); return; }
        const file = new File([blob], 'bunch-bets-scorecard.png', { type: 'image/png' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: 'Bunch Bets Scorecard' }); }
          catch (e) { if (e.name !== 'AbortError') this._downloadCanvas(canvas); }
        } else {
          this._downloadCanvas(canvas);
        }
      }, 'image/png');
    } catch(e) {
      Err.show('Share image failed: ' + e.message);
    }
  },

  _downloadCanvas(canvas) {
    const link = document.createElement('a');
    link.download = 'bunch-bets-scorecard.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  },

  highlights() {
    const minInp = h('input',{
      type:'number',value:State.data.settings.thMin,style:'width:80px;padding:4px 6px;',
      oninput:(e)=>{State.data.settings.thMin=parseFloat(e.target.value)||0;State.scheduleRender();}
    });
    const topInp = h('input',{
      type:'number',value:State.data.settings.thTop,style:'width:64px;padding:4px 6px;',
      oninput:(e)=>{State.data.settings.thTop=Math.max(1,parseInt(e.target.value)||1);State.scheduleRender();}
    });

    const toolbar = h('div',{class:'row',style:'justify-content:space-between;align-items:center;'},[
      h('div',{class:'pill'},'Highlights (hole vs zero)'),
      h('div',{},[
        h('label',{},['Min $ ',minInp]),
        h('label',{style:'margin-left:8px;'},['Top ',topInp])
      ])
    ]);

    const all = this.buildHighlights()
      .filter(x => x.value >= State.data.settings.thMin)
      .slice(0, State.data.settings.thTop);

    const content = all.length 
      ? h('ul',{}, all.map(x => h('li',{}, x.text)))
      : h('div',{class:'muted',style:'padding:8px 0;'},'No highlights yet.');

    return h('div',{},[h('div',{class:'card'},[toolbar, content])]);
  },

  buildHighlights() {
    const equalizeHole = (g, hole) => {
      const g2 = Utils.clone(g);
      const ids = [...(g2.teamA||[]),...(g2.teamB||[])];
      ids.forEach(pid => {
        const s = Game.strokes(g2, pid, hole) || 0;
        if (!g2.gross[pid]) g2.gross[pid] = Utils.make18(null);
        g2.gross[pid][hole] = s + 100;
        if (!g2.junkCounts[pid]) g2.junkCounts[pid] = Utils.make18(0);
        g2.junkCounts[pid][hole] = 0;
      });
      return g2;
    };

    const aggTotal = (games) => {
      let tot = 0;
      games.forEach(g => {
        if (g.gameType === 'vegas') {
          tot += Game.computeVegasResult(g).totalValue;
        } else {
          tot += Game.computeResult(g).teamTotals.total;
        }
      });
      return tot;
    };

    const actual = aggTotal(State.data.games);
    const lines = [];

    for (let hole = 0; hole < 18; hole++) {
      const hasAny = State.data.games.some(g => {
        const ids = [...(g.teamA||[]),...(g.teamB||[])];
        return ids.some(pid => {
          const v = g.gross[pid] && g.gross[pid][hole];
          return v != null;
        });
      });
      if (!hasAny) continue;

      const neutral = State.data.games.map(g => equalizeHole(g, hole));
      const cf = aggTotal(neutral);
      const swing = actual - cf;
      if (swing === 0) continue;

      const contrib = State.data.games.map((g, idx) => {
        const a = Game.computeResult(g).teamTotals.total;
        const c = Game.computeResult(neutral[idx]).teamTotals.total;
        return {gi:idx, delta:a-c, game:g};
      });
      contrib.sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));
      const top = contrib[0];

      const getGameTotal = (game) => {
        if (game.gameType === 'vegas') {
          return Game.computeVegasResult(game).totalValue;
        } else {
          return Game.computeResult(game).teamTotals.total;
        }
      };

      const perPlayer = [...(top.game.teamA||[]),...(top.game.teamB||[])].map(pid => {
        const g2 = Utils.clone(top.game);
        const s = Game.strokes(g2, pid, hole) || 0;
        g2.gross[pid][hole] = s + 100;
        g2.junkCounts[pid][hole] = 0;
        const cfRes = getGameTotal(g2);
        const actRes = getGameTotal(top.game);
        return {pid, delta:actRes - cfRes};
      }).filter(pc => Math.abs(pc.delta) > 0.001);

      perPlayer.sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));

      const swingSign = swing > 0 ? 1 : -1;
      const sameDir = perPlayer.filter(pc => Math.sign(pc.delta) === swingSign);
      const rel = sameDir.length ? sameDir : perPlayer;
      if (!rel.length) continue;

      const maxD = Math.max(...rel.map(pc => Math.abs(pc.delta)));
      const tied = rel.filter(pc => Math.abs(Math.abs(pc.delta) - maxD) < 0.001);

      const labelFor = (pid) => {
        const parVal = State.data.course.par[hole];
        const gross = top.game.gross[pid] && top.game.gross[pid][hole];
        if (parVal == null || gross == null) return '';
        const d = gross - parVal;
        if (d <= -3) return 'albatross';
        if (d === -2) return 'eagle';
        if (d === -1) return 'birdie';
        if (d === 1) return 'bogey';
        if (d >= 2) return 'double bogey';
        return gross === parVal ? 'par' : '';
      };

      const pluralize = (s) => {
        if (s === 'par') return 'pars';
        if (s === 'birdie') return 'birdies';
        if (s === 'eagle') return 'eagles';
        if (s === 'bogey') return 'bogeys';
        if (s === 'double bogey') return 'double bogeys';
        if (s === 'albatross') return 'albatrosses';
        return s ? (s + 's') : s;
      };

      const names = tied.map(t => UI.playerName(t.pid));
      const labels = tied.map(t => labelFor(t.pid));

      let whoText;
      const allSame = labels.length && labels.every(l => l && l === labels[0]);
      if (labels.length === 1) {
        whoText = names[0] + (labels[0] ? (' ' + labels[0]) : '');
      } else if (allSame) {
        whoText = names.join(' & ') + (labels[0] ? ("'s " + pluralize(labels[0])) : '');
      } else {
        const parts = names.map((nm, i) => nm + (labels[i] ? (' ' + labels[i]) : ''));
        whoText = parts.join(' & ');
      }

      const toward = swing > 0 ? 'Team A' : 'Team B';
      const swingSz = (top.game.teamA||[]).length || 1;
      const swingPP = Math.abs(swing) / swingSz;
      lines.push({
        hole,
        value:Math.abs(swing),
        swing,
        text:`Hole ${hole+1}: ${whoText} swung ${Utils.fmt(swingPP)}/ea toward ${toward}`
      });
    }

    lines.sort((a,b) => (b.value - a.value) || (b.hole - a.hole));
    return lines;
  }
};

// === INIT ===
if (!State.load() || !State.data.games.length) {
  State.data.games = [Game.create()];
  State.scheduleSave();
}

State.data.games = State.data.games.map(Game.sanitize);

document.getElementById('resetBtn').onclick = () => {
  UI.closeMenu();
  if (!confirm('Start a new round? Scores & junk cleared, teams/stakes reset. Custom courses kept.')) return;
  const keepCourse = Utils.clone(State.data.course);
  const keepPresets = Utils.clone(State.presets);
  State.data.games = [Game.create()];
  State.data.course = keepCourse;
  State.presets = keepPresets;
  State.data.roundCompleteShown = false;
  State.scheduleSave();
  State.scheduleRender();
  Err.toast('Round reset');
};

document.getElementById('clearBtn').onclick = () => {
  UI.closeMenu();
  if (!confirm('Clear all scores & junk? Teams/stakes/course stay the same.')) return;
  State.data.games.forEach(g => {
    State.data.players.forEach(p => {
      g.gross[p.id] = Utils.make18(null);
      g.junkCounts[p.id] = Utils.make18(0);
    });
    g.kpData = Utils.make18(null);
    g.quadsConfirmed = {};
  });
  State.data._clearedHoles = {};
  State.scheduleSave();
  State.scheduleRender();
  Err.toast('Scores cleared');
};

document.getElementById('factoryBtn').onclick = () => {
  UI.closeMenu();
  if (!confirm('Factory reset? EVERYTHING erased: scores, teams, strokes, players, ALL presets!')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
};

// Live sharing buttons
document.getElementById('hostBtn').onclick = () => { UI.closeMenu(); LiveSync.showHostModal(); };
document.getElementById('joinBtn').onclick = () => { UI.closeMenu(); LiveSync.showJoinModal(); };

// Wizard button
document.getElementById('startWizardBtn').onclick = () => {
  if (!confirm('Start a new game?\n\nThis will erase all scores and settings from the current game.')) return;
  UI.closeMenu();
  Wizard.start();
};

// Check URL for join code on load
let joiningViaUrl = false;
(function() {
  const params = new URLSearchParams(window.location.search);
  const joinCode = params.get('join');
  if (joinCode) {
    joiningViaUrl = true;
    // Remove code from URL to prevent re-joining on refresh
    window.history.replaceState({}, '', window.location.pathname);
    // Delay join to allow app to initialize
    setTimeout(() => LiveSync.joinGame(joinCode), 500);
  }
})();

// iOS detection
(function() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Mac') && 'ontouchend' in document);
  if (isIOS) document.documentElement.classList.add('ios');
})();

UI.render();
UI.initMenu();

// Header: date + weather
(function() {
  const dateEl = document.getElementById('headerDate');
  const weatherEl = document.getElementById('headerWeather');
  if (dateEl) {
    const now = new Date();
    const opts = { weekday: 'long', month: 'long', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', opts);
  }
  if (weatherEl) {
    weatherEl.textContent = 'Loading weather...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude: lat, longitude: lon } = pos.coords;
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
          .then(r => r.json())
          .then(data => {
            const c = data.current;
            const temp = Math.round(c.temperature_2m);
            const wind = Math.round(c.wind_speed_10m);
            const codes = {0:['☀️','Clear'],1:['🌤','Mostly Clear'],2:['⛅','Partly Cloudy'],3:['☁️','Overcast'],45:['🌫','Foggy'],48:['🌫','Foggy'],51:['🌦','Light Drizzle'],53:['🌦','Drizzle'],55:['🌧','Heavy Drizzle'],61:['🌧','Light Rain'],63:['🌧','Rain'],65:['🌧️','Heavy Rain'],71:['🌨','Light Snow'],73:['❄️','Snow'],75:['❄️','Heavy Snow'],80:['🌦','Showers'],81:['🌧','Showers'],82:['⛈','Heavy Showers'],95:['⛈','Thunderstorm'],96:['⛈','Thunderstorm'],99:['⛈','Thunderstorm']};
            const [emoji, desc] = codes[c.weather_code] || ['☀️','Clear'];
            const windEmoji = wind >= 15 ? '💨' : '🍃';
            weatherEl.textContent = `${emoji} ${temp}°F ${desc}  ${windEmoji} ${wind}mph`;
          })
          .catch(() => { weatherEl.textContent = ''; });
      },
      () => { weatherEl.textContent = ''; },
      { timeout: 5000 }
    );
  }
})();


// Intelligent launch detection
(function() {
  const today = new Date().toDateString();
  const lastActive = State.data.lastActiveDate;

  // Check if there's an active game with scores
  const hasActiveGame = () => {
    // Check if any game has at least one score entered
    for (const g of State.data.games) {
      for (const pid of Object.keys(g.gross || {})) {
        const scores = g.gross[pid];
        if (scores && scores.some(s => s !== null)) return true;
      }
    }
    return false;
  };

  // If joining via URL, don't auto-launch wizard (joinGame will handle navigation)
  if (joiningViaUrl) return;

  // If it's a new day, show wizard for fresh start
  // If same day with active game, go to scores
  if (lastActive !== today) {
    // New day - show wizard
    Wizard.start();
  } else if (hasActiveGame()) {
    // Same day with active game - go to scores tab
    State.data.tab = 'live';
    State.scheduleRender();
    Err.toast('Welcome back');
  } else {
    // Same day but no active game - show wizard
    Wizard.start();
  }
})();

})();
