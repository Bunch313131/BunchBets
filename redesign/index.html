              <radialGradient id="splashInnerGlow" cx="100" cy="90" r="90" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#16a34a"/><stop offset="100%" stop-color="#16a34a" stop-opacity="0"/></radialGradient>
            </defs>
          </svg>
        </div>
        <div class="splash-line"></div>
        <div class="splash-title">BUNCH BET<span class="splash-s" id="splashS">S<span class="s-line"></span></span></div>
        <div class="splash-subtitle">Settle it on the course</div>
      </div>
    `;

    // S → $ morph timer (after shimmer completes at ~5.0s)
    setTimeout(() => {
      const s = document.getElementById('splashS');
      if (s) s.classList.add('morph');
    }, 5200);

    // Bokeh particle system
    requestAnimationFrame(() => {
      const canvas = div.querySelector('canvas.splash-particles');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.scale(dpr, dpr);

      const particles = [];
      const pickColor = () => { const r = Math.random(); return r < 0.45 ? 'green' : r < 0.75 ? 'white' : 'yellow'; };
      for (let i = 0; i < 100; i++) {
        particles.push({ x:Math.random()*canvas.offsetWidth, y:Math.random()*canvas.offsetHeight, r:Math.random()*3+0.8, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.4-0.2, alpha:Math.random()*0.5+0.15, pulse:Math.random()*Math.PI*2, pulseSpeed:0.015+Math.random()*0.02, isOrb:false, color:pickColor() });
      }
      for (let i = 0; i < 20; i++) {
        particles.push({ x:Math.random()*canvas.offsetWidth, y:Math.random()*canvas.offsetHeight, r:Math.random()*5+3, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.2-0.12, alpha:Math.random()*0.2+0.08, pulse:Math.random()*Math.PI*2, pulseSpeed:0.01+Math.random()*0.015, isOrb:true, color:pickColor() });
      }
      for (let i = 0; i < 12; i++) {
        particles.push({ x:Math.random()*canvas.offsetWidth, y:Math.random()*canvas.offsetHeight, r:Math.random()*12+8, vx:(Math.random()-0.5)*0.12, vy:(Math.random()-0.5)*0.08-0.06, alpha:Math.random()*0.1+0.04, pulse:Math.random()*Math.PI*2, pulseSpeed:0.006+Math.random()*0.008, isOrb:true, color:pickColor() });
      }

      const colorMap = { green:'#16a34a', yellow:'#ffdd00', white:null };
      let animId;
      const draw = () => {
        const w = canvas.offsetWidth, h = canvas.offsetHeight;
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.pulse += p.pulseSpeed;
          if (p.x < -20) p.x = w + 20; if (p.x > w + 20) p.x = -20;
          if (p.y < -20) p.y = h + 20; if (p.y > h + 20) p.y = -20;
          const a = p.alpha * (0.5 + 0.5 * Math.sin(p.pulse));
          let fillColor;
          if (p.color === 'white') fillColor = `rgba(255,255,255,${p.isOrb ? a*0.5 : a*0.8})`;
          else fillColor = colorMap[p.color];
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = fillColor;
          ctx.globalAlpha = p.color === 'white' ? 1 : a;
          ctx.shadowBlur = p.isOrb ? p.r * 4 : p.r * 6;
          ctx.shadowColor = fillColor;
          ctx.fill(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        });
        animId = requestAnimationFrame(draw);
      };
      draw();

      // Cleanup when splash is removed
      const observer = new MutationObserver(() => {
        if (!document.contains(canvas)) {
          cancelAnimationFrame(animId);
          observer.disconnect();
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});
    });

    return div;
  },

  renderCourse() {
    const div = document.createElement('div');
    div.className = 'wizard-screen';

    div.innerHTML = `
      <div class="wizard-header">
        <h2>Select Course</h2>
      </div>
      <div class="wizard-content" id="wizardCourseList">
        <div class="wizard-course-locating">Loading courses...</div>
      </div>
      <div class="wizard-footer">
        <button class="btn primary" id="wizardCourseNext">Next</button>
        <div class="wizard-skip">
          <a id="wizardSkip">Skip to Advanced Setup</a>
        </div>
      </div>
    `;

    const buildList = (userLat, userLng) => {
      const container = div.querySelector('#wizardCourseList');
      if (!container) return;
      container.innerHTML = '';
      const hasLocation = userLat != null;

      // Build separate lists: user presets first, then DB courses
      const presetCourses = [];
      const dbCourses = [];
      const dbNames = new Set(COURSE_DB.map(c => c.name));

      // User presets (shown at top)
      Object.keys(State.presets || {}).forEach(name => {
        const dbMatch = COURSE_DB.find(c => c.name === name);
        presetCourses.push({
          name, par: State.presets[name].par, hcp: State.presets[name].hcp,
          distance: (hasLocation && dbMatch) ? haversineMi(userLat, userLng, dbMatch.lat, dbMatch.lng) : null,
          source: 'preset'
        });
      });

      // DB courses not already in presets
      const presetNames = new Set(Object.keys(State.presets || {}));
      COURSE_DB.forEach(c => {
        if (!presetNames.has(c.name)) {
          dbCourses.push({
            name: c.name, par: c.par, hcp: c.hcp,
            distance: hasLocation ? haversineMi(userLat, userLng, c.lat, c.lng) : null,
            source: 'db'
          });
        }
      });

      // Sort DB courses by distance or alphabetically
      if (hasLocation) {
        dbCourses.sort((a, b) => (a.distance ?? 999) - (b.distance ?? 999));
      } else {
        dbCourses.sort((a, b) => a.name.localeCompare(b.name));
      }

      // Render helper
      let firstCard = null;
      const addCard = (c) => {
        const card = document.createElement('div');
        card.className = 'wizard-course-card';
        card.dataset.course = c.name;
        card.dataset.source = c.source;
        const distHtml = c.distance != null ? `<span class="wizard-course-distance">${c.distance.toFixed(1)} mi</span>` : '';
        card.innerHTML = `<div class="course-head"><h3>${c.name}</h3>${distHtml}</div><p>${c.source === 'preset' ? 'Saved preset' : 'Par ' + c.par.reduce((a,b)=>a+b,0)}</p>`;
        container.appendChild(card);
        if (!firstCard) firstCard = card;
      };

      // Saved presets first
      if (presetCourses.length) {
        const label = document.createElement('div');
        label.className = 'wizard-course-section-label';
        label.textContent = 'Your Courses';
        container.appendChild(label);
        presetCourses.forEach(addCard);
      }

      // "Find Nearby Courses" button (only if no location yet)
      if (!hasLocation && navigator.geolocation) {
        const nearbyBtn = document.createElement('button');
        nearbyBtn.className = 'btn primary';
        nearbyBtn.style.cssText = 'width:100%;margin:8px 0;font-size:13px;';
        nearbyBtn.textContent = '📍 Find Nearby Courses';
        nearbyBtn.onclick = () => {
          nearbyBtn.textContent = 'Locating...';
          nearbyBtn.disabled = true;
          navigator.geolocation.getCurrentPosition(
            pos => buildList(pos.coords.latitude, pos.coords.longitude),
            () => { nearbyBtn.textContent = 'Location unavailable'; setTimeout(() => nearbyBtn.remove(), 2000); },
            { timeout: 8000 }
          );
        };
        container.appendChild(nearbyBtn);
      }

      // Then DB courses
      if (dbCourses.length) {
        const label = document.createElement('div');
        label.className = 'wizard-course-section-label';
        label.textContent = hasLocation ? 'Nearby Courses' : 'Course Database';
        container.appendChild(label);
        dbCourses.forEach(addCard);
      }

      // "Set Up New Course" card at bottom
      const newCard = document.createElement('div');
      newCard.className = 'wizard-course-card';
      newCard.dataset.course = '__new__';
      newCard.innerHTML = `<h3>+ Set Up New Course</h3><p>Configure par and handicap for each hole</p>`;
      container.appendChild(newCard);

      // Feedback link
      const feedbackLink = document.createElement('a');
      feedbackLink.href = 'https://docs.google.com/forms/d/e/1FAIpQLSd42m1QbKIdydDACKVW5JHOlTDWbRMbloKPMlkW36_8Pzy_6g/viewform';
      feedbackLink.target = '_blank';
      feedbackLink.rel = 'noopener';
      feedbackLink.style.cssText = 'display:block;text-align:center;margin:12px 0;font-size:12px;color:var(--muted);text-decoration:none;';
      feedbackLink.textContent = "Don\u2019t see your course? Request it here";
      container.appendChild(feedbackLink);

      // Pre-select first course
      if (firstCard) {
        firstCard.classList.add('selected');
        this.data.selectedCourse = firstCard.dataset.course;
        this.data.selectedSource = firstCard.dataset.source || null;
      }

      // Click handlers
      container.querySelectorAll('.wizard-course-card').forEach(card => {
        card.onclick = () => {
          container.querySelectorAll('.wizard-course-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          this.data.selectedCourse = card.dataset.course;
          this.data.selectedSource = card.dataset.source || null;
        };
      });
    };

    // Event handlers
    setTimeout(() => {
      // Build list immediately with presets + alphabetical DB — no geolocation
      buildList(null, null);

      document.getElementById('wizardCourseNext').onclick = () => {
        if (this.data.selectedCourse === '__new__') {
          this.step = 'courseSetup';
          this.render();
          return;
        }
        if (this.data.selectedCourse) {
          // Check DB first, then presets
          const dbCourse = COURSE_DB.find(c => c.name === this.data.selectedCourse);
          if (dbCourse) {
            State.data.course.par = [...dbCourse.par];
            State.data.course.hcp = [...dbCourse.hcp];
            State.data.course.name = dbCourse.name;
          } else {
            const preset = State.presets[this.data.selectedCourse];
            if (preset) {
              State.data.course.par = [...preset.par];
              State.data.course.hcp = [...preset.hcp];
              State.data.course.name = this.data.selectedCourse;
            }
          }
        }
        this.step = 'players';
        this.render();
      };

      document.getElementById('wizardSkip').onclick = () => this.skip();
    }, 0);

    return div;
  },

          modal.onclick = (ev) => { if (ev.target === modal) modal.remove(); };
        };
      });

      // Handicap mode
      div.querySelectorAll('[data-hcp]').forEach(opt => {
        opt.onclick = () => {
          g.handicapMode = opt.dataset.hcp;
          this.render();
        };
      });

      // Team assignment (max 2 per team)
      div.querySelectorAll('.wizard-player-chip').forEach(chip => {
        chip.onclick = () => {
          const pid = chip.dataset.pid;
          // Cycle: unassigned -> A -> B -> unassigned (max 2 per team)
          if (g.teamA.includes(pid)) {
            g.teamA = g.teamA.filter(x => x !== pid);
            if (g.teamB.length < 2) g.teamB.push(pid);
          } else if (g.teamB.includes(pid)) {
            g.teamB = g.teamB.filter(x => x !== pid);
          } else {
            // Unassigned - try to add to Team A first, then B
            if (g.teamA.length < 2) g.teamA.push(pid);
            else if (g.teamB.length < 2) g.teamB.push(pid);
          }
          this.render();
        };
      });

      // Junk toggle (only exists for non-skins games)
      const junkToggle = document.getElementById('wizardJunkToggle');
      if (junkToggle) {
        junkToggle.onchange = (e) => {
          g.withJunk = e.target.checked;
          document.getElementById('wizardJunkStakes').style.display = g.withJunk ? '' : 'none';
        };
      }

      // Skins player toggle
      div.querySelectorAll('[data-skins-pid]').forEach(chip => {
        chip.onclick = () => {
          const pid = chip.dataset.skinsPid;
          g.skinsPlayers = g.skinsPlayers || [];
          const wasSelected = g.skinsPlayers.includes(pid);
          if (wasSelected) {
            g.skinsPlayers = g.skinsPlayers.filter(x => x !== pid);
            chip.classList.remove('skins-selected');
            chip.classList.add('skins-unselected');
          } else if (g.skinsPlayers.length < 5) {
            g.skinsPlayers.push(pid);
            chip.classList.remove('skins-unselected');
            chip.classList.add('skins-selected');
          }
          State.scheduleSave();
        };
      });

      // Skins mode selection
      div.querySelectorAll('[data-skins-mode]').forEach(opt => {
        opt.onclick = () => {
          g.skinsMode = opt.dataset.skinsMode;
          this.render();
        };
      });

      // Skins buy-in
      const skinsBuyIn = document.getElementById('wizardSkinsBuyIn');
      if (skinsBuyIn) {
        skinsBuyIn.onchange = (e) => {
          g.stakes.front = parseFloat(e.target.value) || 20;
          this.render();
        };
      }

      // Wolf player toggle
      div.querySelectorAll('[data-wolf-pid]').forEach(chip => {
        chip.onclick = () => {
          const pid = chip.dataset.wolfPid;
          g.wolfPlayers = g.wolfPlayers || [];
          g.wolfTeeOrder = g.wolfTeeOrder || [];
          const wasSelected = g.wolfPlayers.includes(pid);
          if (wasSelected) {
            g.wolfPlayers = g.wolfPlayers.filter(x => x !== pid);
            g.wolfTeeOrder = g.wolfTeeOrder.filter(x => x !== pid);
          } else if (g.wolfPlayers.length < 5) {
            g.wolfPlayers.push(pid);
            if (!g.wolfTeeOrder.includes(pid)) {
              g.wolfTeeOrder.push(pid);
            }
          }
          // Sync tee order with players
          g.wolfTeeOrder = g.wolfTeeOrder.filter(x => g.wolfPlayers.includes(x));
          State.scheduleSave();
          this.updateWolfUI();
        };
      });

      // Wolf tee order up/down buttons
      div.querySelectorAll('.wolf-order-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const pid = btn.dataset.wolfPid;
          const dir = btn.dataset.wolfMove;
          const order = g.wolfTeeOrder.length ? [...g.wolfTeeOrder] : [...g.wolfPlayers];
          const idx = order.indexOf(pid);
          if (idx === -1) return;
          if (dir === 'up' && idx > 0) {
            [order[idx-1], order[idx]] = [order[idx], order[idx-1]];
          } else if (dir === 'down' && idx < order.length - 1) {
            [order[idx], order[idx+1]] = [order[idx+1], order[idx]];
          }
          g.wolfTeeOrder = order;
          State.scheduleSave();
          this.updateWolfUI();
        };
      });

      // Wolf point value input
      const wolfPointInput = document.getElementById('wizardWolfPointValue');
      if (wolfPointInput) {
        wolfPointInput.onchange = (e) => {
          g.wolfPointValue = parseFloat(e.target.value) || 1;
        };
      }

      // 9-Point player toggle
      div.querySelectorAll('[data-ninepoint-pid]').forEach(chip => {
        chip.onclick = () => {
          const pid = chip.dataset.ninepointPid;
          g.ninePointPlayers = g.ninePointPlayers || [];
          const wasSelected = g.ninePointPlayers.includes(pid);
          if (wasSelected) {
            g.ninePointPlayers = g.ninePointPlayers.filter(x => x !== pid);
            chip.classList.remove('skins-selected');
            chip.classList.add('skins-unselected');
          } else if (g.ninePointPlayers.length < 3) {
            g.ninePointPlayers.push(pid);
            chip.classList.remove('skins-unselected');
            chip.classList.add('skins-selected');
          }
          // Update player count display
          const countEl = document.getElementById('ninePointPlayerCount');
          if (countEl) countEl.textContent = `${g.ninePointPlayers.length}/3 players`;
          State.scheduleSave();
        };
      });

      // 9-Point mode selection
      div.querySelectorAll('[data-ninepoint-mode]').forEach(opt => {
        opt.onclick = () => {
          g.ninePointMode = opt.dataset.ninepointMode;
          this.render();
        };
      });

      // 9-Point optional rules
      const ninePointWinBy2 = document.getElementById('wizardNinePointWinBy2');
      if (ninePointWinBy2) {
        ninePointWinBy2.onchange = (e) => {
          g.ninePointWinBy2 = e.target.checked;
          State.scheduleSave();
        };
      }
      const ninePointBirdieDouble = document.getElementById('wizardNinePointBirdieDouble');
      if (ninePointBirdieDouble) {
        ninePointBirdieDouble.onchange = (e) => {
          g.ninePointBirdieDouble = e.target.checked;
          State.scheduleSave();
        };
      }

      // 9-Point value input
      const ninePointValueInput = document.getElementById('wizardNinePointValue');
      if (ninePointValueInput) {
        ninePointValueInput.onchange = (e) => {
          g.ninePointValue = parseFloat(e.target.value) || 1;
        };
      }

      // Stakes inputs (only for non-skins games)
      const stakesFront = document.getElementById('wizardStakesFront');
      if (stakesFront) {
        stakesFront.onchange = (e) => {
          const v = parseFloat(e.target.value) || 0;
          if (g.gameType === 'vegas') g.pointValue.front = v;
          else g.stakes.front = v;
        };
      }
      const stakesBack = document.getElementById('wizardStakesBack');
      if (stakesBack) {
        stakesBack.onchange = (e) => {
          const v = parseFloat(e.target.value) || 0;
          if (g.gameType === 'vegas') g.pointValue.back = v;
          else g.stakes.back = v;
        };
      }
      const overallInput = document.getElementById('wizardStakesOverall');
      if (overallInput) {
        overallInput.onchange = (e) => {
          g.stakes.overall = parseFloat(e.target.value) || 0;
        };
      }
      // Auto-press checkboxes
      const apFront = document.getElementById('wizardAutoPressFront');
      if (apFront) apFront.onchange = (e) => { g.autoPress.front = e.target.checked; };
      const apBack = document.getElementById('wizardAutoPressBack');
      if (apBack) apBack.onchange = (e) => { g.autoPress.back = e.target.checked; };
      const apOverall = document.getElementById('wizardAutoPressOverall');
      if (apOverall) apOverall.onchange = (e) => { g.autoPress.overall = e.target.checked; };

      const junkFront = document.getElementById('wizardJunkFront');
      if (junkFront) {
        junkFront.onchange = (e) => {
          g.junkValue.front = parseFloat(e.target.value) || 0;
        };
      }
      const junkBack = document.getElementById('wizardJunkBack');
      if (junkBack) {
        junkBack.onchange = (e) => {
          g.junkValue.back = parseFloat(e.target.value) || 0;
        };
      }

      // Navigation
      document.getElementById('wizardGameNext').onclick = () => {
        if (g.gameType === 'skins') {
          if ((g.skinsPlayers || []).length < 2) {
            Err.toast('Select at least 2 players for Skins');
            return;
          }
        } else if (g.gameType === 'wolf') {
          if ((g.wolfPlayers || []).length < 4) {
            Err.toast('Select at least 4 players for Wolf');
            return;
          }
        } else if (g.gameType === 'ninepoint') {
          if ((g.ninePointPlayers || []).length !== 3) {
            Err.toast('Select exactly 3 players for 9-Point');
            return;
          }
        } else if (g.teamA.length === 0 || g.teamB.length === 0) {
          Err.toast('Assign players to both teams');
          return;
        }
        this.addNewGame();
      };

      document.getElementById('wizardStartScoring').onclick = () => {
        // Validate all games have proper assignments
        for (let i = 0; i < this.data.games.length; i++) {
          const game = this.data.games[i];
          if (game.gameType === 'skins') {
            if ((game.skinsPlayers || []).length < 2) {
              Err.toast(`Game ${i+1} needs at least 2 players`);
              this.switchToGame(i);
              return;
            }
          } else if (game.gameType === 'wolf') {
            if ((game.wolfPlayers || []).length < 4) {
              Err.toast(`Game ${i+1} needs at least 4 players`);
              this.switchToGame(i);
              return;
            }
          } else if (game.gameType === 'ninepoint') {
            if ((game.ninePointPlayers || []).length !== 3) {
              Err.toast(`Game ${i+1} needs exactly 3 players`);
              this.switchToGame(i);
              return;
            }
          } else if (game.teamA.length === 0 || game.teamB.length === 0) {
            Err.toast(`Game ${i+1} needs teams assigned`);
            this.switchToGame(i);
            return;
          }
        }
        this.finish();
      };

      document.getElementById('wizardGameBack').onclick = () => {
        this.step = 'players';
        this.render();
      };
    }, 0);

    return div;
  }
};

// === UI ===
const UI = {
  playerName(id) {
    const p = State.data.players.find(x => x.id === id);
    return p ? p.name : id;
  },

  gameLabel(g) {
    const abbr = (pid, used) => {
      const nm = this.playerName(pid);
      if (/[0-9]/.test(nm)) {
        const s = nm.toUpperCase();
        if (!used[s]) { used[s] = true; return s; }
      }
      const base = nm.replace(/[^A-Za-z]/g, '').toUpperCase() || String(pid).toUpperCase();
      for (let len = 1; len <= Math.min(3, base.length); len++) {
        const c = base.slice(0, len);
        if (!used[c]) { used[c] = true; return c; }
      }
      const stem = base.slice(0, 2) || base;
      let n = 2;
      while (used[stem + n]) n++;
      used[stem + n] = true;
      return stem + n;
    };
    const used = {};
    const a1 = g.teamA && g.teamA[0] ? abbr(g.teamA[0], used) : '';
    const a2 = g.teamA && g.teamA[1] ? abbr(g.teamA[1], used) : '';
    const b1 = g.teamB && g.teamB[0] ? abbr(g.teamB[0], used) : '';
    const b2 = g.teamB && g.teamB[1] ? abbr(g.teamB[1], used) : '';
    const left = (a1 && a2) ? `${a1}/${a2}` : (a1 || a2 || 'Team A');
    const right = (b1 && b2) ? `${b1}/${b2}` : (b1 || b2 || 'Team B');
    
    if (g.gameType === 'skins') {
      const count = (g.skinsPlayers || []).length;
      const modeLabel = g.skinsMode === 'both' ? 'Net+Gross' : (g.skinsMode === 'gross' ? 'Gross' : 'Net');
      return `Skins ${modeLabel} (${count}p)`;
    } else if (g.gameType === 'wolf') {
      const count = (g.wolfPlayers || []).length;
      return `Wolf (${count}p)`;
    } else if (g.gameType === 'ninepoint') {
      const modeLabel = g.ninePointMode === 'gross' ? 'Gross' : 'Net';
      return `9-Point ${modeLabel}`;
    } else if (g.gameType === 'vegas') {
      return `Vegas: ${left} vs ${right}`;
    } else {
      const mode = g.scoringMode === 'low_net' ? 'Best Ball' : 'Hi/Low';
      return `${mode}: ${left} vs ${right}`;
    }
  },

  render() {
    if (State.locks > 0) return;
    this.renderTabs();
    const root = document.getElementById('app');
    root.innerHTML = '';
    let view;
    switch (State.data.tab) {
      case 'setup': view = this.setup(); break;
      case 'scores': view = (State.data.scoringView === 'table') ? this.scores() : (State.data.scoringView === 'junk') ? this.junk() : this.holeScoring(); break;
      case 'match': view = this.match(); break;
      case 'settle': view = this.transactions(); break;
      case 'rules': view = this.rules(); break;
      default: view = this.holeScoring(); // Default to hole view
    }
    // Header always visible now (contains hamburger menu)
    root.appendChild(view);
    // Wire up drum picker swipe handlers — real-time finger tracking
    requestAnimationFrame(() => {
      if (UI._drumHandlers) {
        const CELL = 52; // px per number cell
        const DRUM_W = 160; // drum visible width
        // Haptic + audio feedback on score change
        let _audioCtx = null;
        const haptic = () => {
          // Android vibration
          try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
          // Audio click for iOS (no vibrate support) — short tick sound
          try {
            if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = _audioCtx.createOscillator();
            const gain = _audioCtx.createGain();
            osc.connect(gain);
            gain.connect(_audioCtx.destination);
            osc.frequency.value = 1800;
            gain.gain.value = 0.08;
            gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.03);
            osc.start(_audioCtx.currentTime);
            osc.stop(_audioCtx.currentTime + 0.03);
          } catch(e){}
        };

        UI._drumHandlers.forEach(({ drumId, currentScore, setScore, centerIdx }) => {
          const el = document.getElementById(drumId);
          if (!el) return;
          const touchEl = el.querySelector('.score-drum-touch');
          const track = el.querySelector('.score-drum-track');
          if (!touchEl || !track) return;
          let startX = 0, dragging = false, dx = 0;
          // Base offset: centers the currentScore cell in the drum window
          const baseOffset = (DRUM_W / 2) - (centerIdx * CELL) - (CELL / 2);

          const updateTrack = (offset) => {
            track.style.transition = 'none';
            track.style.transform = `translateX(${offset}px)`;
          };
          const snapTrack = (offset) => {
            track.style.transition = 'transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94)';
            track.style.transform = `translateX(${offset}px)`;
          };
          const commit = (newScore) => {
            haptic();
            setScore(newScore);
          };

          // Touch events — first touch unlocks AudioContext for iOS
          touchEl.ontouchstart = (e) => {
            startX = e.touches[0].clientX;
            dragging = true; dx = 0;
            track.style.transition = 'none';
            // Unlock AudioContext on first user gesture (iOS requirement)
            if (!_audioCtx) { try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
            else if (_audioCtx.state === 'suspended') { try { _audioCtx.resume(); } catch(e){} }
          };
          touchEl.ontouchmove = (e) => {
            if (!dragging) return;
            dx = e.touches[0].clientX - startX;
            // Clamp to one cell in each valid direction
            const maxDrag = currentScore > MIN_SCORE ? CELL : 0;
            const minDrag = currentScore < MAX_SCORE ? -CELL : 0;
            const clamped = Math.max(minDrag, Math.min(maxDrag, dx));
            updateTrack(baseOffset + clamped);
            if (Math.abs(dx) > 5) e.preventDefault();
          };
          touchEl.ontouchend = () => {
            if (!dragging) return;
            dragging = false;
            const threshold = CELL * 0.3;
            if (dx < -threshold && currentScore < MAX_SCORE) {
              snapTrack(baseOffset - CELL);
              setTimeout(() => commit(currentScore + 1), 180);
            } else if (dx > threshold && currentScore > MIN_SCORE) {
              snapTrack(baseOffset + CELL);
              setTimeout(() => commit(currentScore - 1), 180);
            } else {
              snapTrack(baseOffset);
            }
          };
          touchEl.ontouchcancel = () => { dragging = false; snapTrack(baseOffset); };

          // Mouse events for desktop
          touchEl.onmousedown = (e) => {
            startX = e.clientX; dragging = true; dx = 0;
            track.style.transition = 'none';
            e.preventDefault();
          };
          touchEl.onmousemove = (e) => {
            if (!dragging) return;
            dx = e.clientX - startX;
            const maxDrag = currentScore > MIN_SCORE ? CELL : 0;
            const minDrag = currentScore < MAX_SCORE ? -CELL : 0;
            const clamped = Math.max(minDrag, Math.min(maxDrag, dx));
            updateTrack(baseOffset + clamped);
          };
          touchEl.onmouseup = () => {
            if (!dragging) return;
            dragging = false;
            const threshold = CELL * 0.3;
            if (dx < -threshold && currentScore < MAX_SCORE) {
              snapTrack(baseOffset - CELL);
              setTimeout(() => commit(currentScore + 1), 180);
            } else if (dx > threshold && currentScore > MIN_SCORE) {
              snapTrack(baseOffset + CELL);
              setTimeout(() => commit(currentScore - 1), 180);
            } else {
              snapTrack(baseOffset);
            }
          };
          touchEl.onmouseleave = () => { if (dragging) { dragging = false; snapTrack(baseOffset); } };
        });
        UI._drumHandlers = [];
      }
    });
    // Bottom nav bar
    let bottomNav = document.getElementById('bottomNav');
    if (!bottomNav) {
      bottomNav = document.createElement('nav');
      bottomNav.id = 'bottomNav';
      bottomNav.className = 'bottom-nav';
      const mainEl = document.querySelector('main');
      mainEl.after(bottomNav);
    }
    const navItems = [
      { id: 'scores', label: 'Scores', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>' },
      { id: 'match', label: 'Match', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>' },
      { id: 'settle', label: 'Settle', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>' },
      { id: 'setup', label: 'Setup', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>' }
    ];
    const isLight = document.documentElement.classList.contains('light-mode');
    bottomNav.innerHTML = navItems.map(item =>
      `<button class="bottom-nav-btn ${State.data.tab === item.id ? 'active' : ''}" data-tab="${item.id}">${item.icon}<span>${item.label}</span></button>`
    ).join('') + `<button class="bottom-nav-dark-toggle" id="bottomDarkToggle" title="Toggle dark/light"><span class="toggle-icon">${isLight ? '🌙' : '☀️'}</span><span>${isLight ? 'Dark' : 'Light'}</span></button>`;
    bottomNav.querySelectorAll('.bottom-nav-btn').forEach(btn => {
      btn.onclick = () => {
        State.data.tab = btn.dataset.tab;
        State.scheduleRender();
      };
    });
    document.getElementById('bottomDarkToggle').onclick = () => {
      const goLight = !document.documentElement.classList.contains('light-mode');
      document.documentElement.classList.toggle('light-mode', goLight);
      localStorage.setItem('bunchbets-theme', goLight ? 'light' : 'dark');
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) themeToggle.checked = goLight;
      State.scheduleRender();
    };
  },

  renderTabs() {
    const tabs = [
      ['scores','Scores'],
      ['match','Match'],
      ['settle','Settle'],
      ['setup','Setup']
    ];

    // Populate menu navigation
    const menuNav = document.getElementById('menuNav');
    if (menuNav) {
      menuNav.innerHTML = '';
      tabs.forEach(([id, label]) => {
        const btn = document.createElement('button');
        btn.className = `menu-item ${State.data.tab === id ? 'active' : ''}`;
        btn.textContent = label;
        btn.onclick = () => {
          State.data.tab = id;
          this.closeMenu();
          State.scheduleRender();
        };
        menuNav.appendChild(btn);
      });
      // Rules & Help (menu-only item, not a main tab)
      const rulesDivider = document.createElement('div');
      rulesDivider.style.cssText = 'border-top:1px solid var(--border);margin:4px 0;';
      menuNav.appendChild(rulesDivider);
      const rulesBtn = document.createElement('button');
      rulesBtn.className = `menu-item ${State.data.tab === 'rules' ? 'active' : ''}`;
      rulesBtn.textContent = 'Rules & Help';
      rulesBtn.onclick = () => { State.data.tab = 'rules'; this.closeMenu(); State.scheduleRender(); };
      menuNav.appendChild(rulesBtn);
    }

    // Hide old tabs bar (keeping element for compatibility)
    const tabsEl = document.getElementById('tabs');
    if (tabsEl) tabsEl.style.display = 'none';
  },

  openMenu() {
    document.getElementById('menuOverlay').classList.add('open');
    document.getElementById('slideMenu').classList.add('open');
    document.body.style.overflow = 'hidden';
  },

  closeMenu() {
    document.getElementById('menuOverlay').classList.remove('open');
    document.getElementById('slideMenu').classList.remove('open');
    document.body.style.overflow = '';
  },

  initMenu() {
    document.getElementById('menuToggle').onclick = () => this.openMenu();
    document.getElementById('menuClose').onclick = () => this.closeMenu();
    document.getElementById('menuOverlay').onclick = () => this.closeMenu();

    // Theme color scheme (4 themes)
    const savedColorTheme = localStorage.getItem('bunchbets_theme') || 'augusta';
    document.documentElement.dataset.theme = savedColorTheme;

    // Highlight active swatch
    const swatches = document.querySelectorAll('.theme-swatch');
    function updateSwatchHighlight(activeTheme) {
      swatches.forEach(s => {
        if (s.dataset.theme === activeTheme) {
          s.classList.add('active');
        } else {
          s.classList.remove('active');
        }
      });
    }
    updateSwatchHighlight(savedColorTheme);

    // Swatch click handler
    swatches.forEach(swatch => {
      swatch.onclick = () => {
        const theme = swatch.dataset.theme;
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('bunchbets_theme', theme);
        gtag('event', 'theme_selected', { theme });
        updateSwatchHighlight(theme);
      };
    });

    // Dark/light toggle (checkbox)

                  ' Team Delta'

          strokesEditor(),

    // Saved roster management
    const roster = JSON.parse(localStorage.getItem('bunchbets_roster') || '[]');

          onclick:() => {
            roster.splice(i, 1);
            localStorage.setItem('bunchbets_roster', JSON.stringify(roster));
            State.scheduleRender();
          }},'\u00D7')
      ])

    const rosterCard = h('div',{class:'card',style:'margin-top:12px;'},[
      h('div',{class:'pill'},'My Players'),
      h('div',{class:'muted',style:'font-size:11px;margin:4px 0 8px;'},'Saved on this device. Pick from this list in the wizard.'),

        h('button',{class:'btn primary',style:'padding:6px 12px;font-size:12px;',onclick:() => {
          const nameEl = document.getElementById('rosterNewName');
          const hcpEl = document.getElementById('rosterNewHcp');

          if (!name) return;
          const handicap = Math.min(54, Math.max(0, parseInt(hcpEl.value) || 0));
          roster.push({ name, handicap });
          localStorage.setItem('bunchbets_roster', JSON.stringify(roster));
          State.scheduleRender();

      ])

    return h('div',{},[
      h('div',{class:'card'},[

          h('span',{},''),

  // ═══════════════════════════════════════════════════════
  // NEW HOLE-BY-HOLE SCORING VIEW
  // ═══════════════════════════════════════════════════════
  holeScoring() {
    const g = State.data.games[0];
    if (!g) return h('div',{class:'card'},'No game. Add one in Setup.');

    const hole = State.data.scoringHole || 0;
    const par = State.data.course.par[hole] || 4;
    const hcp = State.data.course.hcp[hole] || 0;
    const isPar3 = par === 3;
    const junkVal = hole <= 8 ? (g.junkValue.front||0) : (g.junkValue.back||0);
    const allPlayers = State.data.players;

    // Default scores to par if hole has no scores yet (and hasn't been intentionally cleared)
    if (!State.data._clearedHoles) State.data._clearedHoles = {};
    const holeHasScores = allPlayers.some(p => g.gross[p.id] && g.gross[p.id][hole] != null);
    if (!holeHasScores && !State.data._clearedHoles[hole]) {
      State.begin();
      State.data.games.forEach(gm => {
        allPlayers.forEach(p => {
          if (gm.gross[p.id] && gm.gross[p.id][hole] == null) {
            gm.gross[p.id][hole] = par;
          }
        });
      });
      State.end();
    }

    // Navigation
    const goToHole = (h) => {
      State.data.scoringHole = Math.max(0, Math.min(17, h));
      State.scheduleRender();
    };

    const navBar = h('div',{class:'hole-scoring-nav'},[
      h('button',{class:'hole-nav-btn', disabled:hole===0, onclick:()=>goToHole(hole-1)},'\u2039'),
      h('div',{class:'hole-nav-info'},[
        h('div',{class:'hole-num'},`Hole ${hole+1}`),
        h('div',{class:'hole-details'},`Par ${par}  \u00B7  HCP ${hcp}`)
      ]),
      hole === 17
        ? h('button',{class:'hole-nav-btn',style:'width:auto;padding:0 14px;font-size:13px;font-weight:700;border-radius:20px;',onclick:()=>UI.showRoundCompleteModal()},'Finish')
        : h('button',{class:'hole-nav-btn',onclick:()=>goToHole(hole+1)},'\u203A')
    ]);

    // Score class helper
    const scoreClass = (score) => {
      if (score == null) return 'no-score';
      const diff = score - par;
      if (diff <= -2) return 'eagle';
      if (diff === -1) return 'birdie';
      if (diff === 1) return 'bogey';
      if (diff >= 2) return 'double-bogey';
      return '';
    };

    const vsPar = (score) => {
      if (score == null) return '';
      const diff = score - par;
      if (diff > 0) return `+${diff}`;
      if (diff < 0) return String(diff);
      return 'E';
    };

    // Player score rows
    const playerRows = allPlayers.map(p => {
      const gross = g.gross[p.id] ? g.gross[p.id][hole] : null;

      // Stroke dots for this hole across all games (color-coded per game)
      const strokeDots = [];
      State.data.games.forEach((gm, gi) => {
        const inA = (gm.teamA||[]).includes(p.id);
        const inB = (gm.teamB||[]).includes(p.id);
        const inSkins = (gm.skinsPlayers||[]).includes(p.id);
        const inWolf = (gm.wolfPlayers||[]).includes(p.id);
        const inNP = (gm.ninePointPlayers||[]).includes(p.id);
        if (!inA && !inB && !inSkins && !inWolf && !inNP) return;
        const s = Game.strokes(gm, p.id, hole);
        if (s > 0) strokeDots.push(h('span',{class:`dot g${gi+1}`}));
      });

      const adjustScore = (delta) => {
        // Re-entering scores clears the "intentionally cleared" flag
        if (State.data._clearedHoles) delete State.data._clearedHoles[hole];
        let current = gross;
        if (current == null) current = par;
        else current += delta;
        current = Math.max(MIN_SCORE, Math.min(MAX_SCORE, current));
        // Set score in ALL games that include this player
        State.data.games.forEach(gm => {
          if (gm.gross[p.id]) gm.gross[p.id][hole] = current;
        });
        State.scheduleSave();
        State.scheduleRender();
      };

      const setScore = (value) => {
        if (State.data._clearedHoles) delete State.data._clearedHoles[hole];
        const clamped = Math.max(MIN_SCORE, Math.min(MAX_SCORE, value));
        State.data.games.forEach(gm => {
          if (gm.gross[p.id]) gm.gross[p.id][hole] = clamped;
        });
        State.scheduleSave();
        State.scheduleRender();
      };

      // Inline junk controls for this player
      let junkInline = null;
      const hasAnyJunk = State.data.games.some(gm => gm.withJunk);
      if (hasAnyJunk) {
        if (!g.junkCounts[p.id]) g.junkCounts[p.id] = Utils.make18(0);
        const junkCount = g.junkCounts[p.id][hole] || 0;
        const adjustJunk = (delta) => {
          State.data.games.forEach(gm => {
            if (!gm.junkCounts[p.id]) gm.junkCounts[p.id] = Utils.make18(0);
            const cur = gm.junkCounts[p.id][hole] || 0;
            gm.junkCounts[p.id][hole] = Math.max(0, cur + delta);
          });
          State.scheduleSave();
          State.scheduleRender();
        };
        junkInline = h('div',{class:'hole-junk-inline'},[
          h('button',{class:'hole-junk-adj',onclick:()=>adjustJunk(-1)},'\u2212'),
          h('span',{class:'hole-junk-val',style:junkCount>0?'color:var(--warning);':''},junkCount > 0 ? String(junkCount) : '\u2013'),
          h('button',{class:'hole-junk-adj',onclick:()=>adjustJunk(1)},'+')
        ]);
      }

      // Drum picker — 5 numbers loaded (2 off-screen), 3 visible, center is selected
      const currentScore = gross != null ? gross : par;
      const drumNums = [];
      for (let n = currentScore - 2; n <= currentScore + 2; n++) {
        if (n >= MIN_SCORE && n <= MAX_SCORE) drumNums.push(n);
      }
      const centerIdx = drumNums.indexOf(currentScore);
      const centerDiff = currentScore - par;
      let frameClass = 'score-drum-frame';
      if (centerDiff <= -2) frameClass += ' eagle';
      else if (centerDiff === -1) frameClass += ' birdie';
      else if (centerDiff === 1) frameClass += ' bogey';
      else if (centerDiff >= 2) frameClass += ' double-bogey';

      // Position track so currentScore is centered in the visible window
      const CELL = 52;
      const drumCenter = 80; // half of 160px drum width
      const trackOffset = drumCenter - (centerIdx * CELL) - (CELL / 2);
      const drumTrack = h('div',{class:'score-drum-track',style:`transform:translateX(${trackOffset}px);`},
        drumNums.map((n, i) => {
          const diff = n - par;
          let cls = 'score-drum-num';
          if (i === centerIdx) {
            cls += ' center';
            if (diff <= -2) cls += ' eagle';
            else if (diff === -1) cls += ' birdie';
            else if (diff === 1) cls += ' bogey';
            else if (diff >= 2) cls += ' double-bogey';
          }
          return h('div',{class:cls},String(n));
        })
      );

      // Touch overlay for swipe handling
      const touchOverlay = h('div',{class:'score-drum-touch'});
      // Wire up swipe after DOM insertion
      const drumId = `drum-${p.id}-${hole}`;
      const drum = h('div',{class:'score-drum',id:drumId},[
        drumTrack,
        h('div',{class:frameClass}),
        touchOverlay
      ]);

      const scoreDrum = h('div',{class:'score-drum-wrap'},[
        drum,
        junkInline
      ].filter(Boolean));

      // Store swipe handler data for post-render wiring
      if (!UI._drumHandlers) UI._drumHandlers = [];
      UI._drumHandlers.push({ drumId, pid: p.id, currentScore, par, hole, setScore, centerIdx });

      // Cumulative to-par label (all scored holes)
      let cumDiff = 0, hasAnyScore = false;
      for (let i = 0; i <= 17; i++) {
        const s = g.gross[p.id] && g.gross[p.id][i];
        if (s != null) { cumDiff += s - (State.data.course.par[i]||4); hasAnyScore = true; }
      }
      const cumStr = !hasAnyScore ? '' : cumDiff > 0 ? `+${cumDiff}` : cumDiff < 0 ? String(cumDiff) : 'E';
      const cumColor = !hasAnyScore ? 'var(--muted)' : cumDiff < 0 ? 'var(--success)' : cumDiff > 0 ? 'var(--danger)' : 'var(--muted)';
      const vsParLabel = hasAnyScore ? h('span',{style:`font-size:11px;font-weight:700;color:${cumColor};`},cumStr) : null;

      return h('div',{class:'hole-player-row'},[
        h('div',{class:'hole-player-info'},[
          h('div',{class:'hole-player-name'},p.name),
          h('div',{style:'display:flex;gap:6px;align-items:center;'},[
            h('span',{class:'hole-player-hcp'},`HCP ${g.strokesCount[p.id]||0}`),
            strokeDots.length ? h('span',{class:'hole-stroke-dots'},strokeDots) : null,
            vsParLabel
          ].filter(Boolean))
        ]),
        scoreDrum
      ]);
    });

    // KP Button for par 3s
    let kpSection = null;
    if (isPar3) {
      const ranking = Game.getKPRanking(hole);
      const hasKP = ranking.length > 0;
      const kpNames = ranking.map(pid => {
        const p = allPlayers.find(pl => pl.id === pid);
        return p ? p.name : '?';
      });

      kpSection = h('div',{style:'padding:8px 12px;'},[
        h('button',{class:`kp-btn ${hasKP?'has-kp':''}`, onclick:()=>this.showKPWizard(hole)},[
          hasKP ? `\u2691 KP: ${kpNames.join(', then ')}` : '\u2691 Tap to Enter KP'
        ])
      ]);
    }

    // Hole strip (bottom navigation dots)
    const holeDots = [];
    for (let i = 0; i < 18; i++) {
      const iPar = State.data.course.par[i] || 4;
      const hasScores = allPlayers.some(p => g.gross[p.id] && g.gross[p.id][i] != null);
      let cls = 'hole-dot';
      if (i === hole) cls += ' current';
      if (hasScores) cls += ' has-scores';
      if (iPar === 3) cls += ' par3';
      holeDots.push(h('div',{class:cls, onclick:()=>goToHole(i)},String(i+1)));
    }
    const holeStrip = h('div',{class:'hole-strip'},holeDots);

    // Game status summary cards
    const statusCards = State.data.games.map((game, idx) => {
      const theme = `theme-g${(idx%6)+1}`;
      if (!Game.hasAnyScores(game)) return null;

      // Team games: multi-line card
      if (game.gameType === 'nassau' || game.gameType === 'vegas') {
        const isNassau = game.gameType === 'nassau';
        const result = isNassau ? Game.computeResult(game) : Game.computeVegasResult(game);
        const sz = (game.teamA||[]).length || 1;
        const junk = game.withJunk ? Game.computeJunk(game) : null;
        const kpResult = game.withJunk ? Game.computeKP(game) : null;
        const fmtPts = (pts) => pts > 0 ? `+${pts}` : pts === 0 ? 'E' : String(pts);
        const fmtSeg = (s) => s.winners.join('/');
        const hasBack9Score = State.data.players.some(p => {
          const arr = game.gross[p.id] || [];
          return arr.slice(9).some(score => score != null);
        });
        const allHolesScored = [...(game.teamA||[]), ...(game.teamB||[])].every(pid => {
          const scores = game.gross[pid];
          return scores && scores.every(s => s != null);
        });

        // KP front/back split
        let frontKP = 0, backKP = 0;
        if (kpResult) {
          kpResult.results.forEach(r => {
            if (r.carried || !r.teamWinner) return;
            const net = r.teamWinner === 'A' ? (r.carryStack||1) : -(r.carryStack||1);
            if (r.hole <= 8) frontKP += net; else backKP += net;
          });
        }

        // Per-player total
        const perPlayer = isNassau ? result.teamTotals.total / sz : result.totalValue / sz;

        // Build lines
        const lines = [];

        // Line 1: Game type + team names + total (bold)
        const typeLabel = isNassau ? 'Nassau' : 'Vegas';
        const aN = (game.teamA||[]).map(pid => UI.playerName(pid)).join(' & ');
        const bN = (game.teamB||[]).map(pid => UI.playerName(pid)).join(' & ');
        const totStr = perPlayer !== 0 ? (perPlayer > 0 ? '+' : '') + Utils.fmt(perPlayer) + '/ea' : 'Even';
        lines.push(h('div',{style:'display:flex;justify-content:space-between;font-weight:700;font-size:12px;'},[
          h('span',{},[h('b',{},typeLabel), `: ${aN} vs ${bN}`]),
          h('span',{},totStr)
        ]));

        // Line 2: Front
        const buildNineLine = (label, betsStr, junkPts, kpNet, dollarPP) => {
          let parts = [`Bets: ${betsStr}`];
          if (junkPts !== 0) parts.push(`Junk: ${fmtPts(junkPts)}`);
          if (kpNet !== 0) parts.push(`KP: ${fmtPts(kpNet)}`);
          const dollarStr = dollarPP !== 0 ? Utils.fmt(dollarPP) + '/ea' : '';
          return h('div',{style:'display:flex;justify-content:space-between;font-size:11px;margin-top:3px;color:var(--muted);'},[
            h('span',{},`${label}:  ${parts.join('  ')}`),
            dollarStr ? h('span',{},dollarStr) : ''
          ].filter(Boolean));
        };

        if (isNassau) {
          lines.push(buildNineLine('Front', fmtSeg(result.segments.front), junk ? junk.frontNetPts : 0, frontKP, result.segments.front.payA));
          if (hasBack9Score) lines.push(buildNineLine('Back', fmtSeg(result.segments.back), junk ? junk.backNetPts : 0, backKP, result.segments.back.payA));
          lines.push(buildNineLine('Overall', fmtSeg(result.segments.overall), 0, 0, result.segments.overall.payA));
        } else {
          const frontPP = result.frontPoints * (game.pointValue.front || 0);
          const backPP = result.backPoints * (game.pointValue.back || 0);
          lines.push(buildNineLine('Front', fmtPts(result.frontPoints) + ' pts', junk ? junk.frontNetPts : 0, frontKP, frontPP));
          if (hasBack9Score) lines.push(buildNineLine('Back', fmtPts(result.backPoints) + ' pts', junk ? junk.backNetPts : 0, backKP, backPP));
        }

        return h('div',{class:`${theme} game-status-card`,style:'margin-bottom:4px;'},[
          h('div',{class:'card',style:'padding:8px 10px;'},lines)
        ]);
      }

      // Skins: player names, skin counts, and take
      if (game.gameType === 'skins') {
        const result = Game.computeSkinsResult(game);
        const mode = game.skinsMode || 'net';
        const players = game.skinsPlayers || [];
        const carry = mode === 'gross' ? result.grossCarry : mode === 'net' ? result.netCarry : (result.grossCarry + result.netCarry);

        // Each player: name, skins, take
        const playerLines = players.map(pid => {
          const name = UI.playerName(pid);
          const skins = mode === 'gross' ? result.grossSkins[pid] :
                        mode === 'net' ? result.netSkins[pid] :
                        (result.grossSkins[pid] + result.netSkins[pid]);
          const pr = result.playerResults[pid];
          const take = pr ? pr.totalWin : 0;
          return h('div',{style:'display:flex;justify-content:space-between;font-size:11px;color:var(--muted);'},[
            h('span',{},`${name}: ${skins || 0} skin${(skins||0)===1?'':'s'}`),
            take > 0 ? h('span',{},Utils.fmt(take)) : ''
          ].filter(Boolean));
        });

        const lines = [];
        // Header: game label + carry (if any)
        lines.push(h('div',{style:'display:flex;justify-content:space-between;font-weight:700;font-size:12px;'},[
          h('span',{},UI.gameLabel(game)),
          carry > 0 ? h('span',{style:'font-weight:400;font-size:11px;color:var(--muted);'},`Carry: ${carry}`) : ''
        ].filter(Boolean)));
        lines.push(...playerLines);

        return h('div',{class:`${theme} game-status-card`,style:'margin-bottom:4px;'},[
          h('div',{class:'card',style:'padding:8px 10px;'},lines)
        ]);
      }

      // Wolf / 9-Point: simple single-line
      let statusText = '';
      if (game.gameType === 'wolf') {
        const res = Game.computeWolfResult(game);
        const players = game.wolfPlayers || [];
        const playerLines = players.map(pid => {
          const val = res.playerNet[pid] || 0;
          return h('span',{style:'font-size:11px;' + (val > 0 ? 'color:var(--success);' : val < 0 ? 'color:var(--danger);' : '')},
            `${UI.playerName(pid)}: ${val > 0 ? '+' : ''}${Utils.fmt(val)}`);
        });
        return h('div',{class:`${theme} game-status-card`,style:'margin-bottom:4px;'},[
          h('div',{class:'card',style:'padding:6px 10px;'},[
            h('div',{style:'font-weight:700;font-size:12px;margin-bottom:4px;'},UI.gameLabel(game)),
            h('div',{style:'display:flex;flex-wrap:wrap;gap:6px 12px;'},playerLines)
          ])
        ]);
      } else if (game.gameType === 'ninepoint') {
        const res = Game.computeNinePointResult(game);
        const players = game.ninePointPlayers || [];
        const playerLines = players.map(pid => {
          const val = res.playerNet[pid] || 0;
          return h('span',{style:'font-size:11px;' + (val > 0 ? 'color:var(--success);' : val < 0 ? 'color:var(--danger);' : '')},
            `${UI.playerName(pid)}: ${val > 0 ? '+' : ''}${Utils.fmt(val)}`);
        });
        return h('div',{class:`${theme} game-status-card`,style:'margin-bottom:4px;'},[
          h('div',{class:'card',style:'padding:6px 10px;'},[
            h('div',{style:'font-weight:700;font-size:12px;margin-bottom:4px;'},UI.gameLabel(game)),
            h('div',{style:'display:flex;flex-wrap:wrap;gap:6px 12px;'},playerLines)
          ])
        ]);
      }
      return h('div',{class:`${theme} game-status-card`,style:'margin-bottom:4px;'},[
        h('div',{class:'card',style:'padding:6px 10px;'},[
          h('div',{class:'row',style:'align-items:center;justify-content:space-between;font-size:12px;'},[
            h('span',{class:'pill',style:'font-size:11px;'},UI.gameLabel(game)),
            h('span',{},statusText)
          ])
        ])
      ]);
    }).filter(Boolean);

    // Column headers — centered above drum and junk controls
    const colHeaderItems = [
      h('div',{class:'hole-col-hdr score',style:'width:160px;text-align:center;'},'Score')
    ];
    if (g.withJunk) {
      colHeaderItems.push(h('div',{class:'hole-col-hdr junk',style:'width:69px;text-align:center;margin-left:8px;margin-right:2px;'},'Junk'));
    }
    const colHeader = h('div',{style:'display:flex;justify-content:flex-end;padding:2px 12px 1px;'},colHeaderItems);

    // Clear hole button
    const clearHole = () => {
      if (!State.data._clearedHoles) State.data._clearedHoles = {};
      State.data._clearedHoles[hole] = true;
      State.data.games.forEach(gm => {
        allPlayers.forEach(p => {
          if (gm.gross[p.id]) gm.gross[p.id][hole] = null;
          if (gm.junkCounts[p.id]) gm.junkCounts[p.id][hole] = 0;
        });
        if (gm.kpData) gm.kpData[hole] = null;
      });
      State.scheduleSave();
      State.scheduleRender();
    };
    const clearBtn = h('div',{style:'text-align:center;padding:1px 0 3px;'},[
      h('button',{class:'hole-clear-btn',onclick:clearHole},'Clear Hole')
    ]);

    // Wolf partner selection for current hole
    const wolfGames = State.data.games.filter(gm => gm.gameType === 'wolf');
    const wolfSection = wolfGames.length ? h('div',{class:'hole-press-section'},wolfGames.map(game => {
      const actualIdx = State.data.games.indexOf(game);
      const theme = `theme-g${(actualIdx%6)+1}`;
      const wolfPlayers = game.wolfPlayers || [];
      if (wolfPlayers.length < 4) return null;
      const wolfResult = Game.computeWolfResult(game);
      const detail = wolfResult.holeDetails[hole] || {};
      const wolfPid = detail.wolf || wolfPlayers[hole % wolfPlayers.length];
      const wolfName = UI.playerName(wolfPid) || '?';
      const currentSel = game.wolfSelections[hole] || '';
      const otherPlayers = wolfPlayers.filter(p => p !== wolfPid);
      const setSel = (val) => { game.wolfSelections[hole] = val; State.scheduleSave(); State.scheduleRender(); };
      return h('div',{class:`hole-press-row ${theme}`},[
        h('span',{class:'hole-press-label'},`Wolf: ${wolfName}`),
        h('div',{class:'hole-press-btns'},[
          h('button',{class:`hole-press-btn${currentSel===''?' active':''}`,onclick:()=>setSel('')},'?'),
          ...otherPlayers.map(pid => {
            const name = UI.playerName(pid) || '?';
            const abbr = name.length <= 4 ? name : name.slice(0,3);
            return h('button',{class:`hole-press-btn${currentSel===pid?' active':''}`,onclick:()=>setSel(pid)},abbr);
          }),
          h('button',{class:`hole-press-btn${currentSel==='wolf'?' active':''}`,onclick:()=>setSel('wolf')},'W'),
          h('button',{class:`hole-press-btn${currentSel==='blind'?' active':''}`,onclick:()=>setSel('blind')},'BW')
        ])
      ]);
    }).filter(Boolean)) : null;

    // Vegas press controls for current hole
    const vegasGames = State.data.games.filter(gm => gm.gameType === 'vegas');
    const pressSection = vegasGames.length ? h('div',{class:'hole-press-section'},vegasGames.map((game, gi) => {
      const actualIdx = State.data.games.indexOf(game);
      const theme = `theme-g${(actualIdx%6)+1}`;
      const currentPress = game.presses[hole] || '';
      const setPress = (val) => {
        game.presses[hole] = val;
        State.scheduleSave();
        State.scheduleRender();
      };
      return h('div',{class:`hole-press-row ${theme}`},[
        h('span',{class:'hole-press-label'},UI.gameLabel(game)),
        h('div',{class:'hole-press-btns'},[
          h('button',{class:`hole-press-btn${currentPress===''?' active':''}`,onclick:()=>setPress('')},'—'),
          h('button',{class:`hole-press-btn${currentPress==='press'?' active':''}`,onclick:()=>setPress('press')},'Press'),
          h('button',{class:`hole-press-btn${currentPress==='blind'?' active':''}`,onclick:()=>setPress('blind')},'Blind')
        ])
      ]);
    })) : null;

    // Scoring card
    const scoringCard = h('div',{class:'hole-scoring'},[
      navBar,
      colHeader,
      ...playerRows,
      kpSection,
      wolfSection,
      pressSection,
      clearBtn
    ].filter(Boolean));

    // Toggle bar for switching between hole view and table view
    const toggleBar = h('div',{class:'scoring-toggle'},[
      h('button',{class:'scoring-toggle-btn active',onclick:()=>{}},'Hole View'),
      h('button',{class:'scoring-toggle-btn',onclick:()=>{State.data.scoringView='table';State.scheduleRender();}},'Table View'),
      h('button',{class:'scoring-toggle-btn',onclick:()=>{State.data.scoringView='junk';State.data.tab='scores';State.scheduleRender();}},'Junk')
    ]);

    return h('div',{},[
      toggleBar,
      scoringCard,
      holeStrip,
      ...(statusCards.length ? statusCards : [])
    ]);
  },

  // KP Wizard Modal
  showKPWizard(hole) {
    const allPlayers = State.data.players;
    const par = State.data.course.par[hole] || 3;
    const existingRanking = Game.getKPRanking(hole);

    // Build the wizard step by step
    const buildStep = (ranking, unresolvedGames) => {
      // Remove any existing modal
      const existing = document.querySelector('.kp-modal');
      if (existing) existing.remove();

      // If no unresolved games, we're done
      if (unresolvedGames.length === 0) {
        Game.setKPRanking(hole, ranking);
        State.scheduleSave();
        State.scheduleRender();
        // Check if this is the last par 3 — if so, check for sweeps/quads
        const par3s = Game.getPar3Holes();
        const lastPar3 = par3s[par3s.length - 1];
        if (hole === lastPar3) {
          setTimeout(() => UI.checkSweepsQuads(), 300);
        }
        return;
      }

      // Figure out which players to show
      // Only players in unresolved games who aren't already ranked
      const rankedSet = new Set(ranking);
      const eligiblePids = new Set();
      unresolvedGames.forEach(gm => {
        [...(gm.teamA||[]), ...(gm.teamB||[])].forEach(pid => {
          if (!rankedSet.has(pid)) eligiblePids.add(pid);
        });
      });

      const eligiblePlayers = allPlayers.filter(p => eligiblePids.has(p.id));
      const isFirst = ranking.length === 0;

      const overlay = document.createElement('div');
      overlay.className = 'kp-modal';

      const title = isFirst
        ? 'Who was closest to the pin and made par or better?'
        : 'Next closest to the pin and made par or better?';

      const subtitle = `Hole ${hole+1} \u2022 Par ${par}`;

      const content = document.createElement('div');
      content.className = 'kp-modal-content';

      const titleEl = document.createElement('h3');
      titleEl.textContent = title;
      content.appendChild(titleEl);

      const subEl = document.createElement('div');
      subEl.className = 'subtitle';
      subEl.textContent = subtitle;
      content.appendChild(subEl);

      // Player buttons
      eligiblePlayers.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'kp-player-btn';
        btn.textContent = p.name;
        btn.onclick = () => {
          const newRanking = [...ranking, p.id];
          overlay.remove();

          // Check which games are now resolved
          const stillUnresolved = unresolvedGames.filter(gm => {
            const gamePlayers = [...(gm.teamA||[]), ...(gm.teamB||[])];
            // Is any ranked player in this game?
            return !newRanking.some(pid => gamePlayers.includes(pid));
          });

          if (stillUnresolved.length === 0) {
            Game.setKPRanking(hole, newRanking);
            State.scheduleSave();
            State.scheduleRender();
            const par3s = Game.getPar3Holes();
            if (hole === par3s[par3s.length - 1]) {
              setTimeout(() => UI.checkSweepsQuads(), 300);
            }
          } else {
            buildStep(newRanking, stillUnresolved);
          }
        };
        content.appendChild(btn);
      });

      // "No one" button
      const noOneBtn = document.createElement('button');
      noOneBtn.className = 'kp-player-btn no-one';
      noOneBtn.textContent = 'No one';
      noOneBtn.onclick = () => {
        overlay.remove();
        Game.setKPRanking(hole, ranking);
        State.scheduleSave();
        State.scheduleRender();
        const par3s = Game.getPar3Holes();
        if (hole === par3s[par3s.length - 1]) {
          setTimeout(() => UI.checkSweepsQuads(), 300);
        }
      };
      content.appendChild(noOneBtn);

      // Clear button if there's existing data
      if (existingRanking.length > 0 && isFirst) {
        const clearBtn = document.createElement('button');
        clearBtn.className = 'kp-player-btn';
        clearBtn.style.cssText = 'color:var(--danger);border-color:var(--danger);margin-top:8px;';
        clearBtn.textContent = 'Clear KP';
        clearBtn.onclick = () => {
          overlay.remove();
          Game.setKPRanking(hole, []);
          State.scheduleSave();
          State.scheduleRender();
        };
        content.appendChild(clearBtn);
      }

      overlay.appendChild(content);
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      document.body.appendChild(overlay);
    };

    // Check if we have team games (nassau/vegas) — use full wizard with ranking
    const teamGames = State.data.games.filter(gm => gm.gameType === 'nassau' || gm.gameType === 'vegas');
    if (teamGames.length > 0) {
      buildStep([], teamGames);
    } else {
      // Non-team games only: simple "who is closest?" — one pick, done
      const existing = document.querySelector('.kp-modal');
      if (existing) existing.remove();
      const allPids = new Set();
      State.data.games.forEach(gm => {
        [...(gm.skinsPlayers||[]),...(gm.wolfPlayers||[]),...(gm.ninePointPlayers||[])].forEach(pid => allPids.add(pid));
      });
      const eligible = allPlayers.filter(p => allPids.has(p.id));
      const overlay = document.createElement('div');
      overlay.className = 'kp-modal';
      const content = document.createElement('div');
      content.className = 'kp-modal-content';
      const titleEl = document.createElement('h3');
      titleEl.textContent = 'Who was closest to the pin?';
      content.appendChild(titleEl);
      const subEl = document.createElement('div');
      subEl.className = 'subtitle';
      subEl.textContent = `Hole ${hole+1} \u2022 Par ${par}`;
      content.appendChild(subEl);
      eligible.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'kp-player-btn';
        btn.textContent = p.name;
        btn.onclick = () => { overlay.remove(); Game.setKPRanking(hole, [p.id]); State.scheduleSave(); State.scheduleRender(); };
        content.appendChild(btn);
      });
      const noOneBtn = document.createElement('button');
      noOneBtn.className = 'kp-player-btn no-one';
      noOneBtn.textContent = 'No one';
      noOneBtn.onclick = () => { overlay.remove(); Game.setKPRanking(hole, []); State.scheduleSave(); State.scheduleRender(); };
      content.appendChild(noOneBtn);
      if (existingRanking.length > 0) {
        const clearBtn = document.createElement('button');
        clearBtn.className = 'kp-player-btn';
        clearBtn.style.cssText = 'color:var(--danger);border-color:var(--danger);margin-top:8px;';
        clearBtn.textContent = 'Clear KP';
        clearBtn.onclick = () => { overlay.remove(); Game.setKPRanking(hole, []); State.scheduleSave(); State.scheduleRender(); };
        content.appendChild(clearBtn);
      }
      overlay.appendChild(content);
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      document.body.appendChild(overlay);
    }
  },

  // Check for sweeps after last par 3 KP entry, then ask quads question
  checkSweepsQuads() {
    const games = State.data.games.filter(gm => gm.gameType === 'nassau' || gm.gameType === 'vegas');
    const sweepsGames = [];

    games.forEach(gm => {
      const kpResult = Game.computeKP(gm);
      if (kpResult.hasSweeps) {
        sweepsGames.push({ game: gm, kpResult });
      }
    });

    if (sweepsGames.length === 0) return;

    // Ask the quads question for each game with sweeps, one at a time
    const askQuads = (index) => {
      if (index >= sweepsGames.length) {
        State.scheduleSave();
        State.scheduleRender();
        return;
      }

      const { game, kpResult } = sweepsGames[index];
      const sweepsTeam = kpResult.sweepsTeam;
      const losingTeam = sweepsTeam === 'A' ? 'B' : 'A';
      const losingPlayers = losingTeam === 'A' ? (game.teamA||[]) : (game.teamB||[]);
      const losingNames = losingPlayers.map(pid => {
        const p = State.data.players.find(pl => pl.id === pid);
        return p ? p.name : '?';
      }).join(' / ');

      const winningPlayers = sweepsTeam === 'A' ? (game.teamA||[]) : (game.teamB||[]);
      const winningNames = winningPlayers.map(pid => {
        const p = State.data.players.find(pl => pl.id === pid);
        return p ? p.name : '?';
      }).join(' / ');

      const overlay = document.createElement('div');
      overlay.className = 'kp-modal';

      const content = document.createElement('div');
      content.className = 'kp-modal-content';

      const icon = document.createElement('div');
      icon.style.cssText = 'text-align:center;font-size:28px;margin-bottom:8px;';
      icon.textContent = '\uD83C\uDFC6';
      content.appendChild(icon);

      const title = document.createElement('h3');
      title.style.cssText = 'text-align:center;';
      title.textContent = 'Sweeps!';
      content.appendChild(title);

      const desc = document.createElement('div');
      desc.className = 'subtitle';
      desc.style.cssText = 'text-align:center;';
      desc.textContent = `${winningNames} won all KPs in ${UI.gameLabel(game)}`;
      content.appendChild(desc);

      const question = document.createElement('div');
      question.style.cssText = 'margin:16px 0 12px;font-size:15px;font-weight:500;text-align:center;';
      question.textContent = `Did ${losingNames} hit ANY par 3 greens this round?`;
      content.appendChild(question);

      const yesBtn = document.createElement('button');
      yesBtn.className = 'kp-player-btn';
      yesBtn.textContent = 'Yes — Sweeps only (2x KP)';
      yesBtn.onclick = () => {
        game.quadsConfirmed[losingTeam] = false;
        overlay.remove();
        askQuads(index + 1);
      };
      content.appendChild(yesBtn);

      const noBtn = document.createElement('button');
      noBtn.className = 'kp-player-btn';
      noBtn.style.cssText = 'background:rgba(217,119,6,0.1);border-color:var(--warning);color:var(--warning);';
      noBtn.textContent = 'No — QUADS! (4x KP)';
      noBtn.onclick = () => {
        game.quadsConfirmed[losingTeam] = true;
        overlay.remove();
        askQuads(index + 1);
      };
      content.appendChild(noBtn);

      overlay.appendChild(content);
      document.body.appendChild(overlay);
    };

    askQuads(0);
  },

  scores() {
    const g = State.data.games[0];
    if (!g) return h('div',{class:'card'},'No game. Add one in Setup.');

    const last = Game.getLastScored();
    const updateSums = (pid) => {
      const arr = g.gross[pid];
      const f = Utils.sumRange(arr,0,8);
      const b = Utils.sumRange(arr,9,17);
      const t = (f==null && b==null)?null:((f||0)+(b||0));
      const fEl = document.getElementById(`sumF_${pid}`);
      const bEl = document.getElementById(`sumB_${pid}`);
      const tEl = document.getElementById(`sumT_${pid}`);
      if (fEl) fEl.textContent = f==null?'':String(f);
      if (bEl) bEl.textContent = b==null?'':String(b);
      if (tEl) tEl.textContent = t==null?'':String(t);
    };

    const createDots = (pid, hole) => {
      const dots = [];
      for (let gi = 0; gi < Math.min(6, State.data.games.length); gi++) {
        const gm = State.data.games[gi];
        const inA = (gm.teamA||[]).includes(pid);
        const inB = (gm.teamB||[]).includes(pid);
        const inSkins = (gm.skinsPlayers||[]).includes(pid);
        const inWolf = (gm.wolfPlayers||[]).includes(pid);
        const inNP = (gm.ninePointPlayers||[]).includes(pid);
        if (!inA && !inB && !inSkins && !inWolf && !inNP) continue;
        const s = Game.strokes(gm, pid, hole);
        if (s > 0) dots.push(h('span',{class:`dot g${gi+1}`}));
      }
      return dots.length ? h('span',{class:'dots'},dots) : null;
    };

    const head = [h('th',{class:'sticky'},'Hole')];
    for (let i = 0; i < 18; i++) head.push(h('th',{id:`col_h_${i}`},String(i+1)));
    head.push(h('th',{},'F'),h('th',{},'B'),h('th',{},'TOT'));

    const parRow = [h('th',{class:'sticky'},'Par')];
    for (let i = 0; i < 18; i++) parRow.push(h('th',{},String(State.data.course.par[i]||'')));
    parRow.push(h('th',{}),h('th',{}),h('th',{}));

    // Get score indicator class based on gross score vs par
    const getScoreClass = (score, par) => {
      if (score == null) return '';
      const diff = score - par;
      if (diff <= -2) return 'eagle';
      if (diff === -1) return 'birdie';
      if (diff === 0) return '';
      if (diff === 1) return 'bogey';
      return 'double-bogey';
    };

    const rows = State.data.players.map((p, ri) => {
      // Ensure gross array exists for this player
      if (!g.gross[p.id]) g.gross[p.id] = Utils.make18(null);
      const cells = [h('td',{class:'sticky'},p.name)];
      for (let hole = 0; hole < 18; hole++) {
        const tabIdx = (hole * State.data.players.length) + ri + 1;
        const score = g.gross[p.id][hole];
        const par = State.data.course.par[hole] || 4;
        const scoreClass = getScoreClass(score, par);
        cells.push(h('td',{},[
          h('div',{class:'cellWrap' + (scoreClass ? ' ' + scoreClass : '')},[
            h('input',{
              type:'tel',inputmode:'numeric',tabindex:tabIdx,
              value:score==null?'':String(score),
              style:'width:54px;text-align:center;',
              placeholder:'-',
              onfocus:()=>State.begin(),
              oninput:(e)=>{
                e.target.value = Utils.sanitize(e.target.value);
                const v = e.target.value===''?null:parseInt(e.target.value);
                State.data.games.forEach(gm => { if (gm.gross[p.id]) gm.gross[p.id][hole] = v; });
                // Update score indicator immediately
                const wrap = e.target.closest('.cellWrap');
                wrap.classList.remove('eagle','birdie','bogey','double-bogey');
                const cls = getScoreClass(v, par);
                if (cls) wrap.classList.add(cls);
                // Check if all players have scores for this hole - if so, update status bars
                const allHaveScore = State.data.players.every(pl => {
                  const s = g.gross[pl.id] && g.gross[pl.id][hole];
                  return s != null;
                });
                if (allHaveScore) {
                  updateStatusBars();
                }
              },
              onkeydown:(e)=>{
                if (e.key==='Enter') {
                  e.preventDefault();
                  let next = tabIdx + 1;
                  const maxCol = (hole+1)*State.data.players.length;
                  if (next > maxCol) {
                    if (hole+1 < 18) next = (hole+1)*State.data.players.length - (State.data.players.length-1);
                    else next = tabIdx;
                  }
                  const nextEl = document.querySelector(`input[tabindex="${next}"]`);
                  if (nextEl) nextEl.focus();
                }
              },
              onblur:(e)=>{
                const v = e.target.value===''?null:parseInt(e.target.value);
                if (v!==null && (v<MIN_SCORE || v>MAX_SCORE)) {
                  Err.show(`Invalid score ${v}. Use ${MIN_SCORE}-${MAX_SCORE}`);
                  e.target.value = '';
                  State.data.games.forEach(gm => { if (gm.gross[p.id]) gm.gross[p.id][hole] = null; });
                } else {
                  State.data.games.forEach(gm => { if (gm.gross[p.id]) gm.gross[p.id][hole] = v; });
                  e.target.value = v==null?'':String(v);
                }
                updateSums(p.id);
                State.end();
              }
            }),
            h('div',{class:'score-indicator'}),
            createDots(p.id, hole) || ''
          ])
        ]));
      }
      const arr = g.gross[p.id];
      const f = Utils.sumRange(arr,0,8);
      const b = Utils.sumRange(arr,9,17);
      const t = (f==null && b==null)?null:((f||0)+(b||0));
      cells.push(
        h('td',{id:`sumF_${p.id}`},f==null?'':String(f)),
        h('td',{id:`sumB_${p.id}`},b==null?'':String(b)),
        h('td',{id:`sumT_${p.id}`},t==null?'':String(t))
      );
      return h('tr',{},cells);
    });


    // Build Vegas press rows
    const vegasRows = State.data.games.filter(g => g.gameType === 'vegas').map((game,gi) => {
      const actualIdx = State.data.games.indexOf(game);
      const theme = `theme-g${(actualIdx%6)+1}`;
      const cells = [h('td',{class:'sticky press-label',style:'font-weight:600;'},UI.gameLabel(game))];
      for (let hole = 0; hole < 18; hole++) {
        const currentPress = game.presses[hole] || '';
        const sel = h('select',{
          class:'press-select',
          onchange:(e)=>{
            game.presses[hole] = e.target.value;
            State.scheduleSave();
            State.scheduleRender();
          }
        },[
          h('option',{value:'',selected:currentPress===''},'—'),
          h('option',{value:'press',selected:currentPress==='press'},'P'),
          h('option',{value:'blind',selected:currentPress==='blind'},'B')
        ]);
        cells.push(h('td',{},[sel]));
      }
      cells.push(h('td',{colspan:'3'}));
      return h('tr',{class:`press-row ${theme}`},cells);
    });

    // Build Wolf selection rows
    const wolfRows = State.data.games.filter(g => g.gameType === 'wolf').flatMap((game,gi) => {
      const actualIdx = State.data.games.indexOf(game);
      const theme = `theme-g${(actualIdx%6)+1}`;
      const wolfPlayers = game.wolfPlayers || [];
      // Skip if no wolf players configured
      if (wolfPlayers.length < 4) {
        const cells = [h('td',{class:'sticky press-label',style:'font-weight:600;'},UI.gameLabel(game))];
        for (let hole = 0; hole < 18; hole++) {
          cells.push(h('td',{class:'muted',style:'font-size:10px;'},'-'));
        }
        cells.push(h('td',{colspan:'3'}));
        return [h('tr',{class:`press-row ${theme}`},cells)];
      }
      // Compute wolf result to get actual wolf for each hole (includes catch-up logic)
      const wolfResult = Game.computeWolfResult(game);

      // Determine catch-up start hole: 4 players = hole 17 (index 16), 5 players = hole 16 (index 15)
      const catchUpStart = wolfPlayers.length === 4 ? 16 : 15;

      // Row 1: Wolf name for each hole
      const wolfNameCells = [h('td',{class:'sticky press-label',style:'font-weight:600;font-size:11px;'},'Wolf')];
      for (let hole = 0; hole < 18; hole++) {
        const detail = wolfResult.holeDetails[hole] || {};
        const isCatchUp = hole >= catchUpStart;
        // For catch-up holes, show TBD unless we can determine from current standings
        let displayName;
        if (isCatchUp) {
          // Check if all prior holes have selections made - if so, wolf is determined
          const allPriorSelected = Array.from({length: hole}, (_, h) => game.wolfSelections[h]).every(s => s);
          if (allPriorSelected && detail.wolf) {
            const name = UI.playerName(detail.wolf) || '?';
            displayName = name.length <= 3 ? name : name.slice(0,2);
          } else {
            displayName = 'TBD';
          }
        } else {
          const wolfPid = detail.wolf || wolfPlayers[hole % wolfPlayers.length];
          const name = UI.playerName(wolfPid) || '?';
          displayName = name.length <= 3 ? name : name.slice(0,2);
        }
        wolfNameCells.push(h('td',{style:'font-size:11px;text-align:center;' + (isCatchUp ? 'color:#ca8a04;' : '')},displayName));
      }
      wolfNameCells.push(h('td',{colspan:'3'}));
      const wolfNameRow = h('tr',{class:`press-row ${theme}`},wolfNameCells);

      // Row 2: Partner selection dropdown
      const pickCells = [h('td',{class:'sticky press-label',style:'font-weight:600;font-size:11px;'},'Pick')];
      for (let hole = 0; hole < 18; hole++) {
        const detail = wolfResult.holeDetails[hole] || {};
        const isCatchUp = hole >= catchUpStart;
        const wolfPid = detail.wolf || wolfPlayers[hole % wolfPlayers.length];
        const currentSel = game.wolfSelections[hole] || '';
        // Options: player names (except wolf), Wolf, Blind Wolf
        const otherPlayers = wolfPlayers.filter(p => p !== wolfPid);
        const options = [
          h('option',{value:'',selected:currentSel===''},'?'),
          ...otherPlayers.map(pid => {
            const name = UI.playerName(pid) || '?';
            const abbr = name.length <= 3 ? name : name.slice(0,2);
            return h('option',{value:pid,selected:currentSel===pid},abbr);
          }),
          h('option',{value:'wolf',selected:currentSel==='wolf'},'W'),
          h('option',{value:'blind',selected:currentSel==='blind'},'BW')
        ];
        const sel = h('select',{
          class:'press-select',
          style:'font-size:12px;',
          onchange:(e)=>{
            game.wolfSelections[hole] = e.target.value;
            State.scheduleSave();
            State.scheduleRender();
          }
        },options);
        pickCells.push(h('td',{},[sel]));
      }
      pickCells.push(h('td',{colspan:'3'}));
      const pickRow = h('tr',{class:`press-row ${theme}`},pickCells);

      return [wolfNameRow, pickRow];
    });

    const tbl = h('table',{},[
      h('thead',{},[h('tr',{},head),h('tr',{},parRow)]),
      h('tbody',{},[...rows,...vegasRows,...wolfRows])
    ]);

    const scroller = h('div',{class:'card scroll',id:'scoresScroll'},tbl);

    setTimeout(()=>{
