<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New Preview</title>
<style>
:root, :root[data-theme="classic"] { --bg:#0b0e13; --card:#0f1420; --txt:#ecf0f6; --muted:#a3a9b6; --border:#1e2633; --acc:#3b82f6; --success:#16a34a; --danger:#dc2626; --warning:#d97706; --gold:#c9a96e; --radius:14px; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.btn { background:var(--card); border:1px solid var(--border); border-radius:999px; padding:8px 12px; cursor:pointer; color:var(--txt); transition:all 0.2s; font-size:16px; }
.btn.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
.whats-new-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10000; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn 0.2s; }
.whats-new-modal { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:360px; width:100%; max-height:80vh; overflow-y:auto; }
.whats-new-modal h2 { margin:0 0 4px; font-size:18px; }
.whats-new-modal .version-tag { font-size:12px; color:var(--acc); font-weight:600; margin-bottom:12px; display:block; }
.whats-new-modal ul { margin:0; padding:0 0 0 18px; font-size:14px; line-height:1.8; color:var(--txt); }
.whats-new-modal .btn { width:100%; margin-top:16px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="whats-new-overlay">
  <div class="whats-new-modal">
    <h2>What's New</h2>
    <span class="version-tag">Version 7.0</span>
    <ul>
      <li>Fresh interface redesign with color themes and light/dark modes</li>
      <li>KPs now handled outside of junk — prompted automatically on Par 3s</li>
      <li>Geo-located course database — nearby courses auto-detected in wizard</li>
    </ul>
    <button class="btn primary" onclick="this.closest('.whats-new-overlay').remove()">Got It</button>
  </div>
</div>
</body>
</html>
