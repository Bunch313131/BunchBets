        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });

      const fS = '"Inter",system-ui,sans-serif';
      const fK = '"Kalam",Georgia,serif';

      // Share-specific formatter with +/- prefix, clean integers
      const sfmt = v => {
        if (v == null || !isFinite(v)) return '$0';
        const abs = Math.abs(v);
        const str = abs % 1 === 0 ? '$' + abs : '$' + abs.toFixed(2);
        return v < -0.005 ? '-' + str : v > 0.005 ? '+' + str : '$0';
      };
      const tfmt = v => {
        if (!isFinite(v)) return '$0';
        const abs = Math.abs(v);
        return abs % 1 === 0 ? '$' + abs : '$' + abs.toFixed(2);
      };

      // Gather data
      const players = State.data.players;
      const games = State.data.games;
      const course = State.data.course;
      const par = [];
      for (let i = 0; i < 18; i++) par.push(course.par[Game.courseHole(i)] || 4);
      const g0 = games[0];
      if (!g0) { Err.toast('No game data to share'); return; }

      const playerData = players.map(p => {
        const arr = (g0.gross[p.id]) || [];
        const scores = [];
        for (let i = 0; i < 18; i++) scores.push(arr[i] ?? null);
        const f = Utils.sumRange(arr, 0, 8);
        const b = Utils.sumRange(arr, 9, 17);
        const t = (f == null && b == null) ? null : ((f||0) + (b||0));
        return { name: p.name, id: p.id, scores, front: f, back: b, total: t };
      });
      const numP = players.length;

      // Build gameLines in new format
      const gameLines = [];
      games.forEach(g => {
        if (!Game.hasAnyScores(g)) return;

        if (g.gameType === 'vegas') {
          const res = Game.computeVegasResult(g);
          const sz = (g.teamA||[]).length || 1;
          const teamANames = (g.teamA || []).map(pid => this.playerName(pid));
          const teamBNames = (g.teamB || []).map(pid => this.playerName(pid));
          const teamLabel = `${teamANames.join(' / ')} vs ${teamBNames.join(' / ')}`;
          const frontVal = res.frontPoints * (g.pointValue.front || 0);
          const backVal = res.backPoints * (g.pointValue.back || 0);
          const overallVal = frontVal + backVal;
          const segLines = [
            [`Front: ${sfmt(frontVal)}/ea`, `Back: ${sfmt(backVal)}/ea`, `Overall: ${sfmt(overallVal)}/ea`]
          ];
          const extras = [];
          if (Math.abs(res.junkValue/sz) > 0.005) extras.push(`Junk: ${sfmt(res.junkValue/sz)}/ea`);
          if (Math.abs(res.kpValue/sz) > 0.005) extras.push(`KP: ${sfmt(res.kpValue/sz)}/ea`);
          if (extras.length) segLines.push(extras);
          segLines.push([`Total: ${sfmt(res.totalValue/sz)}/ea`]);
          gameLines.push({ label: 'Vegas', type: 'team', teamLabel, segmentLines: segLines });
        } else if (g.gameType === 'skins') {
          const res = Game.computeSkinsResult(g);
          const buyIn = res.buyIn || 0;
          const rows = (g.skinsPlayers || []).map(pid => {
            const pr = res.playerResults[pid] || {};
            const totalSkins = (pr.grossSkins || 0) + (pr.netSkins || 0);
            return { name: this.playerName(pid), detail: `${totalSkins} skin${totalSkins !== 1 ? 's' : ''}`, net: pr.profit || 0 };
          });
          gameLines.push({ label: `Skins $${buyIn}`, type: 'individual', rows });
        } else if (g.gameType === 'wolf') {
          const res = Game.computeWolfResult(g);
          const pv = res.pointValue || 0;
          const rows = (g.wolfPlayers || []).map(pid => ({
            name: this.playerName(pid), detail: '', net: res.playerNet[pid] || 0
          }));
          gameLines.push({ label: `Wolf $${pv}`, type: 'individual', rows });
        } else if (g.gameType === 'ninepoint') {
          const res = Game.computeNinePointResult(g);
          const pv = res.pointValue || 0;
          const rows = (g.ninePointPlayers || []).map(pid => ({
            name: this.playerName(pid), detail: `${res.playerPoints[pid] || 0} pts`, net: res.playerNet[pid] || 0
          }));
          gameLines.push({ label: `9-Point $${pv}`, type: 'individual', rows });
        } else {
          // Nassau (default)
          const res = Game.computeResult(g);
          const sz = (g.teamA||[]).length || 1;
          const teamANames = (g.teamA || []).map(pid => this.playerName(pid));
          const teamBNames = (g.teamB || []).map(pid => this.playerName(pid));
          const teamLabel = `${teamANames.join(' / ')} vs ${teamBNames.join(' / ')}`;
          const segLines = [
            [`Front: ${sfmt(res.segments.front.payA)}/ea`, `Back: ${sfmt(res.segments.back.payA)}/ea`, `Overall: ${sfmt(res.segments.overall.payA)}/ea`]
          ];
          const extras = [];
          if (Math.abs(res.teamTotals.junk/sz) > 0.005) extras.push(`Junk: ${sfmt(res.teamTotals.junk/sz)}/ea`);
          this.kpParts(res.teamTotals, sz).forEach((r) => extras.push(`${r.label}: ${sfmt(r.amount)}/ea`));
          if (extras.length) segLines.push(extras);
          segLines.push([`Total: ${sfmt(res.teamTotals.total/sz)}/ea`]);
          gameLines.push({ label: 'Nassau', type: 'team', teamLabel, segmentLines: segLines });
        }
      });

      // Compute per-player net
      const net = {};
      players.forEach(p => net[p.id] = 0);
      games.forEach(g => {
        if (!Game.hasAnyScores(g)) return;
        const gameNet = Game.computeGamePlayerNet(g);
        Object.keys(gameNet).forEach(pid => { net[pid] = (net[pid]||0) + gameNet[pid]; });
      });
      const xfers = this.calcTransfers(net);

      // Seeded random for hand-drawn lines
      let seed = 1;
      if (course.name) for (let i = 0; i < course.name.length; i++) seed = (seed * 31 + course.name.charCodeAt(i)) & 0x7fffffff;
      seed = seed || 12345;
      const srand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      const P = {
        paper: '#f5f0e1', paperDark: '#ebe5d3', ink: '#2c2c2c', inkLight: '#8a7e6b',
        green: '#1a5632', greenInk: '#1a6b35', redInk: '#c0392b',
        gold: '#b8960c', grid: '#c4b99a', white: '#faf8f0'
      };

      // Dynamic sizing
      const scale = 2;
      const padLR = 20;
      const mc = document.createElement('canvas').getContext('2d');
      mc.font = `bold 14px ${fS}`;
      const holeW = Math.max(42, mc.measureText('Hole').width + 16);
      const parW = Math.max(42, mc.measureText('Par').width + 16);
      mc.font = `bold 13px ${fS}`;
      let maxNameW = 0;
      playerData.forEach(p => {
        const nm = p.name.length > 8 ? p.name.substring(0, 8) : p.name;
        maxNameW = Math.max(maxNameW, mc.measureText(nm).width);
      });
      mc.font = `16px ${fK}`;
      const scoreW = mc.measureText('88').width;
      const playerW = Math.max(scoreW + 28, maxNameW + 14);

      const tableW = holeW + parW + numP * playerW;
      const minW = 380; // Prevent header/game text from being cut off with few players
      const W = Math.max(tableW + 2 * padLR, minW);
      const rowH = 28;
      const headerH = 110, courseH = 44;
      const numTableRows = 22;
      const tableH = numTableRows * rowH;

      // Pre-measure game & settle section heights
      let gameSectionH = 0;
      if (gameLines.length > 0) {
        gameSectionH = 32;
        gameLines.forEach(game => {
          gameSectionH += 22;
          if (game.type === 'team') {
            gameSectionH += 16;
            gameSectionH += (game.segmentLines?.length || 0) * 15;
          } else {
            gameSectionH += game.rows.length * 18;
          }
          gameSectionH += 8;
        });
      }
      const settleSectionH = 32 + numP * 20 + (xfers.length ? 2 + xfers.length * 20 : 0);
      const footerH = 40;
      const H = headerH + courseH + gameSectionH + 16 + settleSectionH + 20 + tableH + footerH;

      const canvas = document.createElement('canvas');
      canvas.width = W * scale;
      canvas.height = H * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      // Drawing helpers — hand-drawn wobbly lines
      const drawLine = (x1, y1, x2, y2, amp) => {
        amp = amp || 0.7;
        const steps = Math.max(3, Math.ceil(Math.hypot(x2-x1, y2-y1) / 25));
        ctx.beginPath(); ctx.moveTo(x1, y1);
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          ctx.lineTo(
            x1 + (x2-x1)*t + (i < steps ? (srand()-0.5)*amp : 0),
            y1 + (y2-y1)*t + (i < steps ? (srand()-0.5)*amp : 0)
          );
        }
        ctx.stroke();
      };
      const drawCircle = (cx, cy, r) => {
        ctx.beginPath();
        const pts = Math.ceil(Math.PI * 2 / 0.12);
        for (let i = 0; i <= pts; i++) {
          const a = (i / pts) * Math.PI * 2;
          const rr = r + (srand()-0.5) * 1.0;
          const x = cx + Math.cos(a) * rr, y2 = cy + Math.sin(a) * rr;
          i === 0 ? ctx.moveTo(x, y2) : ctx.lineTo(x, y2);
        }
        ctx.closePath(); ctx.stroke();
      };
      const drawRect2 = (cx, cy, s) => {
        const hf = s/2;
        drawLine(cx-hf,cy-hf,cx+hf,cy-hf,0.5); drawLine(cx+hf,cy-hf,cx+hf,cy+hf,0.5);
        drawLine(cx+hf,cy+hf,cx-hf,cy+hf,0.5); drawLine(cx-hf,cy+hf,cx-hf,cy-hf,0.5);
      };
      const drawDivider = (title, atY) => {
        ctx.font = `bold 11px ${fS}`;
        const tw = ctx.measureText(title).width;
        const dp = 10;
        ctx.strokeStyle = P.grid; ctx.lineWidth = 0.8;
        drawLine(padLR, atY + 9, W/2 - tw/2 - dp, atY + 9);
        drawLine(W/2 + tw/2 + dp, atY + 9, W - padLR, atY + 9);
        ctx.fillStyle = P.inkLight;
        ctx.textAlign = 'center';
        ctx.fillText(title, W/2, atY + 13);
      };

      // === START DRAWING ===

      // Parchment background
      ctx.fillStyle = P.paper;
      ctx.fillRect(0, 0, W, H);
      const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.05)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(180,170,150,0.07)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < 15; i++) {
        const fy = srand() * H;
        ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy + (srand()-0.5)*2); ctx.stroke();
      }

      // 1. GREEN HEADER BAR
      let y = 0;
      const hdrGrad = ctx.createLinearGradient(0, 0, 0, headerH);
      hdrGrad.addColorStop(0, '#1e6b3a');
      hdrGrad.addColorStop(1, '#0f3d1e');
      ctx.fillStyle = hdrGrad;
      ctx.fillRect(0, 0, W, headerH);
      ctx.fillStyle = P.gold;
      ctx.fillRect(0, headerH - 2.5, W, 2.5);
      ctx.fillStyle = 'rgba(184,150,12,0.3)';
      ctx.fillRect(0, 0, W, 1.5);

      // Logo — left side
      const logoSize = 38;
      const logoPad = 12;
      if (logoImg) {
        ctx.save();
        const lx = logoPad, ly = headerH - logoSize - 10;
        const lr = 8;
        ctx.beginPath();
        ctx.moveTo(lx + lr, ly); ctx.lineTo(lx + logoSize - lr, ly);
        ctx.quadraticCurveTo(lx + logoSize, ly, lx + logoSize, ly + lr);
        ctx.lineTo(lx + logoSize, ly + logoSize - lr);
        ctx.quadraticCurveTo(lx + logoSize, ly + logoSize, lx + logoSize - lr, ly + logoSize);
        ctx.lineTo(lx + lr, ly + logoSize);
        ctx.quadraticCurveTo(lx, ly + logoSize, lx, ly + logoSize - lr);
        ctx.lineTo(lx, ly + lr);
        ctx.quadraticCurveTo(lx, ly, lx + lr, ly);
        ctx.closePath(); ctx.clip();
        ctx.drawImage(logoImg, lx, ly, logoSize, logoSize);
        ctx.restore();
      }

      // "BUNCH BETS" — right side
      ctx.fillStyle = P.white;
      ctx.font = `800 22px ${fS}`;
      ctx.textAlign = 'right';
      ctx.fillText('BUNCH BETS', W - logoPad, headerH - 18);
      y = headerH;

      // 2. COURSE & DATE
      ctx.fillStyle = P.ink;
      ctx.font = `600 15px ${fS}`;
      ctx.textAlign = 'center';
      const dateStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      ctx.fillText(`${course.name}  \u00b7  ${dateStr}`, W/2, y + 28);
      ctx.strokeStyle = P.grid; ctx.lineWidth = 0.8;
      drawLine(padLR + 30, y + 36, W - padLR - 30, y + 36);
      y += courseH;

      // 3. GAME RESULTS
      if (gameLines.length > 0) {
        drawDivider('GAME RESULTS', y);
        y += 32;

        gameLines.forEach(game => {
          ctx.fillStyle = P.ink;
          ctx.font = `bold 16px ${fK}`;
          ctx.textAlign = 'left';
          ctx.fillText(game.label, padLR + 8, y + 16);
          y += 22;
          if (game.type === 'team') {
            // Team subtitle
            ctx.fillStyle = P.inkLight;
            ctx.font = `13px ${fK}`;
            ctx.textAlign = 'left';
            ctx.fillText(game.teamLabel, padLR + 14, y + 12);
            y += 16;
            // Segment lines
            if (game.segmentLines) {
              game.segmentLines.forEach((lineSegs, li) => {
                const isTotal = li === game.segmentLines.length - 1;
                ctx.font = isTotal ? `bold 13px ${fK}` : `13px ${fK}`;
                ctx.fillStyle = P.ink;
                ctx.textAlign = 'left';
                ctx.fillText(lineSegs.join(' \u00b7 '), padLR + 14, y + 12);
                y += 15;
              });
            }
          } else {
            // Individual games — per-player
            game.rows.forEach(row => {
              ctx.textAlign = 'left';
              const netStr = sfmt(row.net);
              ctx.fillStyle = P.inkLight;
              ctx.font = `14px ${fK}`;
              const nameStr = row.detail ? `${row.name}: ${row.detail}` : row.name;
              ctx.fillText(nameStr, padLR + 14, y + 13);
              const nameW2 = ctx.measureText(nameStr + '  ').width;
              ctx.fillStyle = P.ink;
              ctx.font = `bold 14px ${fK}`;
              ctx.fillText(netStr, padLR + 14 + nameW2, y + 13);
              y += 18;
            });
          }
          y += 8;
        });
      }

      y += 16;

      // 4. SETTLE UP
      drawDivider('SETTLE UP', y);
      y += 32;

      players.forEach(p => {
        const val = net[p.id];
        const color = val > 0.005 ? P.greenInk : val < -0.005 ? P.redInk : P.ink;
        ctx.fillStyle = color;
        ctx.font = `bold 16px ${fK}`;
        ctx.textAlign = 'left';
        ctx.fillText(`${p.name}:  ${sfmt(val)}`, padLR + 12, y + 15);
        y += 20;
      });

      if (xfers.length) {
        y += 2;
        xfers.forEach(x => {
          ctx.fillStyle = P.ink;
          ctx.font = `15px ${fK}`;
          ctx.textAlign = 'left';
          ctx.fillText(`${this.playerName(x.from)}  \u2192  ${this.playerName(x.to)}:  ${tfmt(x.amount)}`, padLR + 14, y + 15);
          y += 20;
        });
      }

      y += 20;

      // 5. SCORECARD TABLE (rotated: players across, holes down)
      const tx = Math.max(padLR, (W - tableW) / 2);
      let cy = y;

      const rowDefs = [];
      for (let h = 0; h < 9; h++) rowDefs.push({ type: 'hole', idx: h });
      rowDefs.push({ type: 'sum', label: State.data.startingHole ? Game.rangeLabel(0,8) : 'OUT', key: 'front' });
      for (let h = 9; h < 18; h++) rowDefs.push({ type: 'hole', idx: h });
      rowDefs.push({ type: 'sum', label: State.data.startingHole ? Game.rangeLabel(9,17) : 'IN', key: 'back' });
      rowDefs.push({ type: 'sum', label: 'TOT', key: 'total' });

      let fPar = 0, bPar = 0;
      for (let i = 0; i < 9; i++) fPar += (par[i] || 0);
      for (let i = 9; i < 18; i++) bPar += (par[i] || 0);
      const tPar = fPar + bPar;

      // Column header — INTER
      ctx.fillStyle = P.green;
      ctx.fillRect(tx, cy, tableW, rowH);
      ctx.fillStyle = P.white;
      ctx.font = `bold 13px ${fS}`;
      ctx.textAlign = 'center';
      ctx.fillText('HOLE', tx + holeW/2, cy + 18);
      ctx.fillText('PAR', tx + holeW + parW/2, cy + 18);
      for (let pi = 0; pi < numP; pi++) {
        const nm = playerData[pi].name.length > 8 ? playerData[pi].name.substring(0, 8) : playerData[pi].name;
        ctx.fillText(nm.toUpperCase(), tx + holeW + parW + pi * playerW + playerW/2, cy + 18);
      }
      cy += rowH;

      // Data rows
      rowDefs.forEach((row, ri) => {
        const isSum = row.type === 'sum';
        ctx.fillStyle = isSum ? P.paperDark : (ri % 2 === 0 ? P.paper : 'rgba(196,185,154,0.13)');
        ctx.fillRect(tx, cy, tableW, rowH);

        // Hole number / label — INTER
        ctx.fillStyle = P.ink;
        ctx.font = isSum ? `bold 13px ${fS}` : `13px ${fS}`;
        ctx.textAlign = 'center';
        ctx.fillText(isSum ? row.label : String(Game.holeLabel(row.idx)), tx + holeW/2, cy + 18);

        // Par — INTER
        ctx.fillStyle = isSum ? P.ink : P.inkLight;
        ctx.font = isSum ? `bold 13px ${fS}` : `13px ${fS}`;
        const parVal = isSum ? (row.key === 'front' ? fPar : row.key === 'back' ? bPar : tPar) : (par[row.idx] || '');
        ctx.fillText(String(parVal), tx + holeW + parW/2, cy + 18);

        // Scores — KALAM
        for (let pi = 0; pi < numP; pi++) {
          const colCx = tx + holeW + parW + pi * playerW + playerW/2;
          const colCy = cy + rowH/2;

          if (isSum) {
            const val = playerData[pi][row.key];
            ctx.fillStyle = P.ink;
            ctx.font = `bold 16px ${fK}`;
            ctx.textAlign = 'center';
            ctx.fillText(val != null ? String(val) : '\u2013', colCx, cy + 19);
          } else {
            const score = playerData[pi].scores[row.idx];
            const hp = par[row.idx] || 4;

            if (score != null) {
              const diff = score - hp;
              if (diff <= -2) {
                ctx.strokeStyle = P.greenInk; ctx.lineWidth = 1.2;
                drawCircle(colCx, colCy, 9); drawCircle(colCx, colCy, 13);
              } else if (diff === -1) {
                ctx.strokeStyle = P.greenInk; ctx.lineWidth = 1.2;
                drawCircle(colCx, colCy, 11);
              } else if (diff === 1) {
                ctx.strokeStyle = P.redInk; ctx.lineWidth = 1.2;
                drawRect2(colCx, colCy, 22);
              } else if (diff >= 2) {
                ctx.strokeStyle = P.redInk; ctx.lineWidth = 1.2;
                drawRect2(colCx, colCy, 18); drawRect2(colCx, colCy, 24);
              }

              ctx.fillStyle = diff < 0 ? P.greenInk : diff > 0 ? P.redInk : P.ink;
              ctx.font = `16px ${fK}`;
              ctx.textAlign = 'center';
              ctx.fillText(String(score), colCx, cy + 19);
            } else {
              ctx.fillStyle = P.inkLight;
              ctx.font = `15px ${fK}`;
              ctx.textAlign = 'center';
              ctx.fillText('\u2013', colCx, cy + 19);
            }
          }
        }
        cy += rowH;
      });

      // Grid lines
      const tableTop = y, tableBot = cy;
      let gy = tableTop;
      for (let r = 0; r <= numTableRows; r++) {
        const thick = r === 0 || r === numTableRows || r === 1 || r === 10 || r === 11 || r === 20 || r === 21;
        ctx.strokeStyle = thick ? 'rgba(140,128,100,0.6)' : P.grid;
        ctx.lineWidth = thick ? 1.3 : 0.6;
        drawLine(tx, gy, tx + tableW, gy);
        gy += rowH;
      }
      ctx.strokeStyle = P.grid;
      ctx.lineWidth = 1.2;
      drawLine(tx, tableTop, tx, tableBot);
      drawLine(tx + tableW, tableTop, tx + tableW, tableBot);
      ctx.lineWidth = 0.9;
      drawLine(tx + holeW, tableTop, tx + holeW, tableBot);
      drawLine(tx + holeW + parW, tableTop, tx + holeW + parW, tableBot);
      ctx.lineWidth = 0.5;
      for (let pi = 1; pi < numP; pi++) {
        drawLine(tx + holeW + parW + pi * playerW, tableTop, tx + holeW + parW + pi * playerW, tableBot);
      }

      // 6. FOOTER
      ctx.fillStyle = P.inkLight;
      ctx.font = `500 11px ${fS}`;
      ctx.textAlign = 'center';
      ctx.fillText('\u26f3  bunchbets.com', W/2, H - 14);

      // Share or download
      gtag('event', 'share_results', { method: 'image', player_count: State.data.players.length });
      canvas.toBlob(async (blob) => {
        if (!blob) { Err.show('Failed to generate image'); return; }
        const file = new File([blob], 'bunch-bets-scorecard.png', { type: 'image/png' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: 'Bunch Bets Scorecard', text: '\u26f3 Scored with Bunch Bets' }); }
          catch (e) { if (e.name !== 'AbortError') this._downloadCanvas(canvas); }
        } else {
          this.share();
        }
      }, 'image/png');
    } catch(e) {
      Err.show('Share image failed: ' + e.message);
    }
  },

  _downloadCanvas(canvas) {
    const link = document.createElement('a');
    link.download = 'bunch-bets-scorecard.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  },

  highlights() {
    const minInp = h('input',{
      type:'number',value:State.data.settings.thMin,style:'width:80px;padding:4px 6px;',
      oninput:(e)=>{State.data.settings.thMin=parseFloat(e.target.value)||0;State.scheduleRender();}
    });
    const topInp = h('input',{
      type:'number',value:State.data.settings.thTop,style:'width:64px;padding:4px 6px;',
      oninput:(e)=>{State.data.settings.thTop=Math.max(1,parseInt(e.target.value)||1);State.scheduleRender();}
    });

    const toolbar = h('div',{class:'row',style:'justify-content:space-between;align-items:center;'},[
      h('div',{class:'pill'},'Highlights (hole vs zero)'),
      h('div',{},[
        h('label',{},['Min $ ',minInp]),
        h('label',{style:'margin-left:8px;'},['Top ',topInp])
      ])
    ]);

    const all = this.buildHighlights()
      .filter(x => x.value >= State.data.settings.thMin)
      .slice(0, State.data.settings.thTop);

    const content = all.length 
      ? h('ul',{}, all.map(x => h('li',{}, x.text)))
      : h('div',{class:'muted',style:'padding:8px 0;'},'No highlights yet.');

    return h('div',{},[h('div',{class:'card'},[toolbar, content])]);
  },

  buildHighlights() {
    const equalizeHole = (g, hole) => {
      const g2 = Utils.clone(g);
      const ids = [...(g2.teamA||[]),...(g2.teamB||[])];
      ids.forEach(pid => {
        const s = Game.strokes(g2, pid, hole) || 0;
        if (!g2.gross[pid]) g2.gross[pid] = Utils.make18(null);
        g2.gross[pid][hole] = s + 100;
        if (!g2.junkCounts[pid]) g2.junkCounts[pid] = Utils.make18(0);
        g2.junkCounts[pid][hole] = 0;
      });
      return g2;
    };

    const aggTotal = (games) => {
      let tot = 0;
      games.forEach(g => {
        if (g.gameType === 'vegas') {
          tot += Game.computeVegasResult(g).totalValue;
        } else if (g.gameType === 'skins') {
          const res = Game.computeSkinsResult(g);
          Object.values(res.playerResults).forEach(pr => { if (pr.profit > 0) tot += pr.profit; });
        } else if (g.gameType === 'wolf') {
          const res = Game.computeWolfResult(g);
          Object.values(res.playerNet||{}).forEach(v => { if (v > 0) tot += v; });
        } else if (g.gameType === 'ninepoint') {
          const res = Game.computeNinePointResult(g);
          Object.values(res.playerNet||{}).forEach(v => { if (v > 0) tot += v; });
        } else {
          tot += Game.computeResult(g).teamTotals.total;
        }
      });
      return tot;
    };

    const actual = aggTotal(State.data.games);
    const lines = [];

    for (let hole = 0; hole < 18; hole++) {
      const hasAny = State.data.games.some(g => {
        const ids = [...(g.teamA||[]),...(g.teamB||[])];
        return ids.some(pid => {
          const v = g.gross[pid] && g.gross[pid][hole];
          return v != null;
        });
      });
      if (!hasAny) continue;

      const neutral = State.data.games.map(g => equalizeHole(g, hole));
      const cf = aggTotal(neutral);
      const swing = actual - cf;
      if (swing === 0) continue;

      const contrib = State.data.games.map((g, idx) => {
        const a = Game.computeResult(g).teamTotals.total;
        const c = Game.computeResult(neutral[idx]).teamTotals.total;
        return {gi:idx, delta:a-c, game:g};
      });
      contrib.sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));
      const top = contrib[0];

      const getGameTotal = (game) => {
        if (game.gameType === 'vegas') {
          return Game.computeVegasResult(game).totalValue;
        } else {
          return Game.computeResult(game).teamTotals.total;
        }
      };

      const perPlayer = [...(top.game.teamA||[]),...(top.game.teamB||[])].map(pid => {
        const g2 = Utils.clone(top.game);
        const s = Game.strokes(g2, pid, hole) || 0;
        g2.gross[pid][hole] = s + 100;
        g2.junkCounts[pid][hole] = 0;
        const cfRes = getGameTotal(g2);
        const actRes = getGameTotal(top.game);
        return {pid, delta:actRes - cfRes};
      }).filter(pc => Math.abs(pc.delta) > 0.001);

      perPlayer.sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));

      const swingSign = swing > 0 ? 1 : -1;
      const sameDir = perPlayer.filter(pc => Math.sign(pc.delta) === swingSign);
      const rel = sameDir.length ? sameDir : perPlayer;
      if (!rel.length) continue;

      const maxD = Math.max(...rel.map(pc => Math.abs(pc.delta)));
      const tied = rel.filter(pc => Math.abs(Math.abs(pc.delta) - maxD) < 0.001);

      const labelFor = (pid) => {
        const parVal = State.data.course.par[Game.courseHole(hole)];
        const gross = top.game.gross[pid] && top.game.gross[pid][hole];
        if (parVal == null || gross == null) return '';
        const d = gross - parVal;
        if (d <= -3) return 'albatross';
        if (d === -2) return 'eagle';
        if (d === -1) return 'birdie';
        if (d === 1) return 'bogey';
        if (d >= 2) return 'double bogey';
        return gross === parVal ? 'par' : '';
      };

      const pluralize = (s) => {
        if (s === 'par') return 'pars';
        if (s === 'birdie') return 'birdies';
        if (s === 'eagle') return 'eagles';
        if (s === 'bogey') return 'bogeys';
        if (s === 'double bogey') return 'double bogeys';
        if (s === 'albatross') return 'albatrosses';
        return s ? (s + 's') : s;
      };

      const names = tied.map(t => UI.playerName(t.pid));
      const labels = tied.map(t => labelFor(t.pid));

      let whoText;
      const allSame = labels.length && labels.every(l => l && l === labels[0]);
      if (labels.length === 1) {
        whoText = names[0] + (labels[0] ? (' ' + labels[0]) : '');
      } else if (allSame) {
        whoText = names.join(' & ') + (labels[0] ? ("'s " + pluralize(labels[0])) : '');
      } else {
        const parts = names.map((nm, i) => nm + (labels[i] ? (' ' + labels[i]) : ''));
        whoText = parts.join(' & ');
      }

      const toward = swing > 0 ? 'Team A' : 'Team B';
      const swingSz = (top.game.teamA||[]).length || 1;
      const swingPP = Math.abs(swing) / swingSz;
      lines.push({
        hole,
        value:Math.abs(swing),
        swing,
        text:`Hole ${Game.holeLabel(hole)}: ${whoText} swung ${Utils.fmt(swingPP)}/ea toward ${toward}`
      });
    }

    lines.sort((a,b) => (b.value - a.value) || (b.hole - a.hole));
    return lines;
  },

  /**
   * Group Score — the "N gross + M net" side game.
   *
   * Works on either the live round or a history snapshot; Game.comboSource
   * normalises the two. Nothing here writes: it is a read-only view over scores
   * that already exist, so opening it mid-round cannot disturb a game.
   */
  /**
   * Link the short names this group writes on a card to the golfer records in
   * the pool. Suggestions are ranked, but nothing is saved without a tap — a
   * wrong link here would quietly file rounds under the wrong man.
   */
  showLinkNames() {
    const names = Cloud.unlinkedNames();
    const overlay = document.createElement('div');
    overlay.className = 'history-overlay';
    overlay.innerHTML =
      '<div class="history-header">' +
      '<button class="history-back" id="linkBack">&larr; Back</button>' +
      '<h2>Link names</h2><div style="width:60px;"></div></div>' +
      '<div class="history-list" id="linkBody"></div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#linkBack').onclick = () => overlay.remove();
    const body = overlay.querySelector('#linkBody');

    if (!names.length) {
      body.innerHTML = '<div class="history-empty">Every name on your cards is already linked.</div>';
      return;
    }

    const esc = (t) => String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    body.innerHTML =
      '<div class="cloud-note" style="padding:0 4px 12px;">Your cards use short names; the group roster uses full ones. ' +
      'Link them once and every round \u2014 past and future \u2014 files against the right person. ' +
      'Suggestions are a guess, so check each one.</div>' +
      names.map((n) => {
        const opts = Cloud.suggestFor(n);
        const rest = Cloud.pool.filter((g) => opts.indexOf(g) === -1);
        const opt = (g, sel) => '<option value="' + esc(g.id) + '"' + (sel ? ' selected' : '') + '>' +
          esc(g.name) + (g.currentIndex ? ' \u00b7 ' + esc(g.currentIndex) : '') + '</option>';
        return '<div class="link-row"><div class="link-name">' + esc(n) + '</div>' +
          '<select class="link-pick" data-name="' + esc(n) + '">' +
          '<option value="">\u2014 not in this group \u2014</option>' +
          opts.map((g, i) => opt(g, i === 0)).join('') +
          (rest.length ? '<optgroup label="everyone else">' + rest.map((g) => opt(g, false)).join('') + '</optgroup>' : '') +
          '</select></div>';
      }).join('') +
      '<button class="btn primary" id="linkSave" style="width:100%;margin-top:16px;padding:12px;">Save links</button>';

    body.querySelector('#linkSave').onclick = async () => {
      const pairs = [...body.querySelectorAll('.link-pick')].map((sel) => ({
        name: sel.getAttribute('data-name'), golferId: sel.value,
      })).filter((x) => x.golferId);
      if (!pairs.length) { overlay.remove(); return; }
      body.querySelector('#linkSave').disabled = true;
      body.querySelector('#linkSave').textContent = 'Saving\u2026';
      await Cloud.linkNames(pairs);
      overlay.remove();
      Err.toast(Cloud.status || 'Linked');
    };
  },

  /**
   * Group standings, computed on read from the rounds the cloud let us see.
   *
   * Money lives on its own tab and is always scoped to a single group, because
   * money is only meaningful inside the settlement it happened in \u2014 "up $340
   * in the Saturday group" is a fact, "up $410 across all groups" is arithmetic
   * about people who never played each other (doc 08 \u00a73). Scoring is just golf
   * and carries no such restriction.
   */
  async showStandings() {
    const esc = (t) => String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    const overlay = document.createElement('div');
    overlay.className = 'history-overlay';
    overlay.innerHTML =
      '<div class="history-header">' +
      '<button class="history-back" id="standBack">&larr; Back</button>' +
      '<h2>Standings</h2><div style="width:60px;"></div></div>' +
      '<div class="history-list" id="standBody"></div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#standBack').onclick = () => overlay.remove();
    const body = overlay.querySelector('#standBody');
    const msg = (t) => { body.innerHTML = '<div class="history-empty">' + t + '</div>'; };

    if (!CLOUD_ENABLED) { msg('Standings are part of the beta.'); return; }
    if (!Cloud.user)     { msg('Sign in to see your group standings.<br><br>Menu \u2192 Account \u2192 Sign in with Google.'); return; }
    Cloud.warm();
    if (!Cloud.api)      { msg('Still connecting\u2026 give it a second and try again.'); return; }
    if (!Cloud.groups.length) { msg('You are not in a group yet.<br><br>A group is what makes money add up \u2014 it is the set of people who actually settle with each other.'); return; }

    const group = Cloud.groups[0];
    msg('Loading ' + esc(group.name) + '\u2026');

    let rounds = [];
    try {
      rounds = await Cloud.api.groupRounds(group.id);
    } catch (e) {
      msg('Could not load standings: ' + esc(e.code || e.message));
      return;
    }
    if (!rounds.length) { msg('No rounds in ' + esc(group.name) + ' yet.'); return; }

    // A golfer id is not a name. Prefer the pool (current and correct), fall
    // back to whatever the round recorded, so a standings row is never a raw id.
    const nameCache = {};
    rounds.forEach((r) => Object.keys(r.results || {}).forEach((gid) => {
      if (!nameCache[gid]) nameCache[gid] = (r.results[gid] || {}).name || '';
    }));
    const nameFor = (gid) => {
      const g = Cloud.pool.filter((x) => x.id === gid)[0];
      return (g && g.name) || nameCache[gid] || gid;
    };

    const years = Object.keys(rounds.reduce((a, r) => {
      const y = String(r.date || '').slice(0, 4);
      if (/^\d{4}$/.test(y)) a[y] = 1;
      return a;
    }, {})).sort().reverse();

    let season = years[0] || 'all';
    let tab = 'money';

    const money = (n) => (n < 0 ? '-$' + Math.abs(n) : '$' + n);

    const draw = () => {
      const scoped = season === 'all' ? rounds
        : rounds.filter((r) => String(r.date || '').slice(0, 4) === season);
      let stats = Cloud.api.aggregate(scoped);       // already sorted by money desc

      if (tab === 'scoring') {
        // Lowest average first, and anyone without a completed 18 goes last
        // rather than sorting as a zero.
        stats = stats.slice().sort((a, b) => {
          if (a.scoringAvg == null) return 1;
          if (b.scoringAvg == null) return -1;
          return a.scoringAvg - b.scoringAvg;
        });
      }

      const guests = stats.filter((x) => x.golferId.indexOf('guest:') === 0).length;

      const tabs =
        '<div class="stand-tabs">' +
        '<button class="stand-tab' + (tab === 'money' ? ' on' : '') + '" data-tab="money">Money</button>' +
        '<button class="stand-tab' + (tab === 'scoring' ? ' on' : '') + '" data-tab="scoring">Scoring</button>' +
        '</div>';

      const seasons = years.length > 1 || season !== 'all'
        ? '<div class="stand-seasons">' +
          years.map((y) => '<button class="stand-season' + (season === y ? ' on' : '') + '" data-season="' + y + '">' + y + '</button>').join('') +
          '<button class="stand-season' + (season === 'all' ? ' on' : '') + '" data-season="all">All time</button></div>'
        : '';

      const head = tab === 'money'
        ? '<div class="stand-row stand-head"><div class="stand-pos"></div><div class="stand-name">' + esc(group.name) + '</div>' +
          '<div class="stand-n">Rds</div><div class="stand-n">Won</div><div class="stand-n wide">Net</div></div>'
        : '<div class="stand-row stand-head"><div class="stand-pos"></div><div class="stand-name">' + esc(group.name) + '</div>' +
          '<div class="stand-n">18s</div><div class="stand-n">Best</div><div class="stand-n wide">Avg</div></div>';

      const rows = stats.map((x, i) => {
        const guest = x.golferId.indexOf('guest:') === 0;
        const nm = esc(nameFor(x.golferId)) + (guest ? ' <span class="stand-guest">unlinked</span>' : '');
        const cells = tab === 'money'
          ? '<div class="stand-n">' + x.rounds + '</div>' +
            '<div class="stand-n">' + x.wins + '</div>' +
            '<div class="stand-n wide ' + (x.money > 0 ? 'up' : x.money < 0 ? 'down' : '') + '">' + money(x.money) + '</div>'
          : '<div class="stand-n">' + x.grossRounds + '</div>' +
            '<div class="stand-n">' + (x.best == null ? '\u2014' : x.best) + '</div>' +
            '<div class="stand-n wide">' + (x.scoringAvg == null ? '\u2014' : x.scoringAvg.toFixed(1)) + '</div>';
        return '<div class="stand-row"><div class="stand-pos">' + (i + 1) + '</div>' +
               '<div class="stand-name">' + nm + '</div>' + cells + '</div>';
      }).join('');

      // The money column is the whole reason the group exists, so say plainly
      // what it does and does not include.
      const foot = tab === 'money'
        ? '<div class="cloud-note" style="margin-top:14px;">Money is only counted inside <b>' + esc(group.name) +
          '</b> \u2014 rounds played with anyone else are not in this column, because that is not who you settled with.</div>'
        : '<div class="cloud-note" style="margin-top:14px;">Scoring average counts completed 18-hole rounds only. Nine holes would flatter everybody.</div>';

      const nudge = guests
        ? '<div class="cloud-note"><b>' + guests + ' player(s) above are not linked to anyone in the group.</b><br>' +
          'Their rounds count, but they will not merge with the real record until you link the names.' +
          '<br><button class="cloud-backup" id="standLink">Link them</button></div>'
        : '';

      body.innerHTML = tabs + seasons +
        '<div class="stand-table">' + head + rows + '</div>' +
        nudge + foot +
        '<div class="cloud-note" style="opacity:.7;">' + scoped.length + ' round(s)' +
        (season === 'all' ? '' : ' in ' + season) + '.</div>';

      body.querySelectorAll('.stand-tab').forEach((b) => {
        b.onclick = () => { tab = b.getAttribute('data-tab'); draw(); };
      });
      body.querySelectorAll('.stand-season').forEach((b) => {
        b.onclick = () => { season = b.getAttribute('data-season'); draw(); };
      });
      const ln = body.querySelector('#standLink');
      if (ln) ln.onclick = () => { overlay.remove(); UI.showLinkNames(); };
    };

    draw();
  },

  showComboCalc(round, label) {
    const src = Game.comboSource(round);
    const OPTIONS = [[1,1],[1,2],[2,1],[2,2],[1,3]];
    let sel = 1;                 // 1 gross + 2 net — what we actually play
    let theirs = '';

    // Short display names, disambiguated only when two first names collide.
    const base = {};
    src.players.forEach(p => {
      const parts = String(p.name || '').trim().split(/\s+/);
      base[p.id] = parts[0] || p.id;
    });
    const disp = {};
    src.players.forEach(p => {
      const parts = String(p.name || '').trim().split(/\s+/);
      const dup = src.players.filter(q => base[q.id] === base[p.id]).length > 1;
      disp[p.id] = (dup && parts[1]) ? base[p.id] + ' ' + parts[1].charAt(0) : base[p.id];
    });

    const overlay = document.createElement('div');
    overlay.className = 'history-overlay';
    overlay.innerHTML = `
      <div class="history-header">
        <button class="history-back" id="comboBack">&larr; Back</button>
        <h2>Group Score</h2>
        <div style="width:60px;"></div>
      </div>
      <div class="history-list" id="comboBody"></div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#comboBack').onclick = () => overlay.remove();
    const body = overlay.querySelector('#comboBody');

    const render = () => {
      const opt = OPTIONS[sel];
      const need = opt[0] + opt[1];
      const res = Game.computeCombo(src, opt[0], opt[1]);

      const chips = OPTIONS.map((o, i) =>
        `<button class="combo-chip${i === sel ? ' active' : ''}" data-i="${i}">${o[0]} gross + ${o[1]} net</button>`
      ).join('');

      if (!res.holesScored) {
        body.innerHTML = `
          <div class="combo-chips">${chips}</div>
          <div class="history-empty">Not enough scores for ${opt[0]} gross + ${opt[1]} net.<br><br>
          This combination needs ${need} players with a score on the same hole.</div>
        `;
        wireChips();
        return;
      }

      let parSum = 0;
      res.holes.forEach(h => {
        if (h.sum == null) return;
        parSum += (src.parArr[(h.pos + src.startingHole) % 18] || 0);
      });
      const vsPar = res.total - parSum * need;
      const parTxt = parSum ? ` &middot; ${vsPar > 0 ? '+' : ''}${vsPar} vs par` : '';
      const where = (label ? label + ' &middot; ' : '') + src.courseName;

      const rows = res.holes.map(h => {
        const ch = (h.pos + src.startingHole) % 18;
        if (h.sum == null) {
          return `<tr><td class="num">${ch + 1}</td><td colspan="2" style="color:var(--muted);">&mdash;</td><td class="num" style="color:var(--muted);">&mdash;</td></tr>`;
        }
        const gTxt = h.gross.map(pid => `${disp[pid]} ${src.gross[pid][h.pos]}`).join(', ');
        const nTxt = h.net.map(pid => {
          const st = Game.comboStrokes(src.handicap[pid], src.hcpArr, h.pos, src.startingHole);
          return `${disp[pid]} ${src.gross[pid][h.pos] - st}`;
        }).join(', ');
        return `<tr><td class="num">${ch + 1}</td><td>${gTxt}</td><td>${nTxt}</td><td class="num">${h.sum}</td></tr>`;
      }).join('');

      body.innerHTML = `
        <div class="combo-chips">${chips}</div>
        <div class="combo-total">${res.total}</div>
        <div class="combo-sub">${where}<br>${res.holesScored} of 18 holes${parTxt}</div>
        <div style="display:flex;justify-content:center;">
          <input id="comboTheirs" type="number" inputmode="numeric" placeholder="Their score" value="${theirs}"
            style="width:140px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:15px;text-align:center;">
        </div>
        <div class="combo-margin" id="comboMargin"></div>
        <div class="history-detail-section" style="margin-top:20px;">
          <h3>Hole by Hole</h3>
          <table class="combo-table">
            <thead><tr><th>#</th><th>Gross</th><th>Net</th><th style="text-align:center;">Score</th></tr></thead>
            <tbody>
              ${rows}
              <tr class="total-row"><td></td><td colspan="2">Total</td><td class="num">${res.total}</td></tr>
            </tbody>
          </table>
        </div>
      `;

      const marginEl = body.querySelector('#comboMargin');
      const updateMargin = () => {
        const v = parseInt(theirs, 10);
        if (theirs === '' || isNaN(v)) { marginEl.textContent = ''; return; }
        const d = res.total - v;
        if (d < 0)      { marginEl.textContent = `You win by ${-d}`;  marginEl.style.color = 'var(--success)'; }
        else if (d > 0) { marginEl.textContent = `You lose by ${d}`;  marginEl.style.color = 'var(--danger)'; }
        else            { marginEl.textContent = 'Tied';              marginEl.style.color = 'var(--muted)'; }
      };
      updateMargin();

      // Update the margin in place. Re-rendering here would steal focus from
      // the field the user is still typing in.
      const input = body.querySelector('#comboTheirs');
      input.oninput = () => { theirs = input.value; updateMargin(); };

      wireChips();
    };

    function wireChips() {
      body.querySelectorAll('.combo-chip').forEach(btn => {
        btn.onclick = () => { sel = parseInt(btn.dataset.i, 10); render(); };
      });
    }

    render();
  }
};

/**
 * Tapping a number field clears it, showing the old value ghosted behind, so
 * typing replaces rather than inserting beside the existing digit.
 *
 * Every one of these holds a short number that is almost always being replaced
 * outright — a handicap, a par, a stake. Landing the caret next to the old digit
 * means "8" becomes "78" or "87" depending on which side of it you happened to
 * tap, and on a phone getting back out of that is fiddlier than it sounds.
 *
 * This started as select-all, which is the obvious answer and is wrong on a
 * phone: iOS draws a real text selection, with the two blue drag handles and
 * often the cut/copy bar, over a two-character number. Correct behaviour,
 * unpleasant to look at, and it invites a drag nobody wants. Clearing the field
 * gets the same result with no selection UI at all, and the placeholder keeps
 * the old number visible so you can see what you are replacing.
 *
 * Restoring happens in the CAPTURE phase of blur, which is load-bearing: several
 * of these fields own an onblur that does parseInt(value) || 0, and a target-phase
 * restore would run after it had already written a zero over the real number.
 * The synthetic input event then lets whatever owns the field re-read it, so a
 * field that was typed into and then emptied ends up agreeing with state instead
 * of showing one number and having stored another.
 *
 * Delegated on purpose. There are two dozen of these fields, the wizard builds
 * more on the fly, and a per-field handler is a rule that only holds until the
 * next field is added. Text fields are untouched: the player-name box filters a
 * dropdown on what is typed, and clearing it would strand the dropdown.
 */
const BB_HELD = 'bbHeldValue', BB_PH = 'bbHeldPlaceholder';

function bbIsNumberField(el) {
  return !!el && el.tagName === 'INPUT' && !el.readOnly && !el.disabled &&
         (el.type === 'number' || el.type === 'tel' ||
          (el.inputMode || '').toLowerCase() === 'numeric');
}

document.addEventListener('focusin', (e) => {
  const el = e.target;
  if (!bbIsNumberField(el) || !el.value || (BB_HELD in el.dataset)) return;
  el.dataset[BB_HELD] = el.value;
  el.dataset[BB_PH] = el.placeholder || '';
  el.placeholder = el.value;
  el.value = '';
});

document.addEventListener('blur', (e) => {
  const el = e.target;
  if (!el || !el.dataset || !(BB_HELD in el.dataset)) return;
  const held = el.dataset[BB_HELD];
  const restored = el.value === '';
  if (restored) el.value = held;
  el.placeholder = el.dataset[BB_PH] || '';
  delete el.dataset[BB_HELD];
  delete el.dataset[BB_PH];
  // Only when we put the number back: the field's owner may have recorded the
  // empty box as a zero on the way through.
  if (restored) { try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch (err) {} }
}, true);

// === WHAT'S NEW / VERSION CHECK ===

/**
 * Compare two dotted versions segment by segment: -1, 0 or 1.
 *
 * This used to be parseFloat, which reads "7.10" as 7.1 — so 7.10 would have
 * compared EQUAL to 7.1 and LESS than 7.9, and What's New would have silently
 * stopped appearing for everyone at exactly this release. The failure is
 * invisible: no error, no missing screen to notice, just notes that quietly
 * never show again.
 *
 * A missing segment counts as zero, so "8" and "8.0" are the same version.
 */
function cmpVersion(a, b) {
  const pa = String(a == null ? '' : a).split('.');
  const pb = String(b == null ? '' : b).split('.');
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}
function showWhatsNew() {
  const storedVersion = localStorage.getItem(VERSION_KEY);
  if (!storedVersion) {
    // First launch ever — store version, don't show notes
    localStorage.setItem(VERSION_KEY, APP_VERSION);
    return;
  }
  if (cmpVersion(storedVersion, APP_VERSION) >= 0) return; // Same or newer, nothing new

  // Older version — collect all notes the user hasn't seen
  const allNotes = [];
  Object.keys(RELEASE_NOTES).sort(cmpVersion).forEach(v => {
    if (cmpVersion(v, storedVersion) > 0) allNotes.push(...RELEASE_NOTES[v]);
  });
  if (!allNotes.length) {
    localStorage.setItem(VERSION_KEY, APP_VERSION);
    return;
  }
  const notes = allNotes;

  const overlay = document.createElement('div');
  overlay.className = 'whats-new-overlay';
  overlay.innerHTML = `
    <div class="whats-new-modal">
      <h2>What's New</h2>
      <span class="version-tag">Version ${APP_VERSION}</span>
      <ul>${notes.map(n => `<li>${n}</li>`).join('')}</ul>
      <button class="btn primary" id="whatsNewClose">Got It</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#whatsNewClose').onclick = () => {
    localStorage.setItem(VERSION_KEY, APP_VERSION);
    overlay.remove();
  };
  overlay.onclick = (e) => {
    if (e.target === overlay) {
      localStorage.setItem(VERSION_KEY, APP_VERSION);
      overlay.remove();
    }
  };
}

function confirmInstalled() {
  const isNew = localStorage.getItem(INSTALL_KEY) !== 'true';
  localStorage.setItem(INSTALL_KEY, 'true');
  const gate = document.getElementById('installGate');
  if (gate) gate.classList.remove('show');
  if (isNew) {
    gtag('event', 'pwa_installed', {
      method: isStandalone() ? 'standalone' : 'prompt'
    });
  }
}

function showInstallGate() {
  const gate = document.getElementById('installGate');
  if (!gate) return;

  if (isIOS_install()) {
    gate.innerHTML = `
      <div class="install-gate-title">${IS_BETA ? 'Bunch Bets BETA' : 'Bunch Bets'}</div>
      <div class="install-gate-card">
        <h3>Add to Home Screen</h3>
        <div class="install-gate-steps">
          <div class="step"><span class="step-num">1</span><span>Tap the <strong>Share</strong> button ${IOS_SHARE_SVG} at the bottom of Safari</span></div>
          <div class="step"><span class="step-num">2</span><span>Scroll down and tap <strong>Add to Home Screen</strong></span></div>
          <div class="step"><span class="step-num">3</span><span>Tap <strong>Add</strong> in the top right</span></div>
        </div>
      </div>
      <div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,0.35);max-width:340px;line-height:1.5;">For the best experience, add Bunch Bets to your Home Screen and launch it from there.</div>`;
  } else if (deferredInstallPrompt) {
    gate.innerHTML = `
      <div class="install-gate-title">${IS_BETA ? 'Bunch Bets BETA' : 'Bunch Bets'}</div>
      <div class="install-gate-card">
        <h3>Install the App</h3>
        <div class="install-gate-steps">
          <div class="step" style="justify-content:center;"><span>Tap below to add Bunch Bets to your Home Screen</span></div>
        </div>
      </div>
      <div class="install-gate-actions">
        <button class="btn primary" onclick="triggerNativeInstall()">Add to Home Screen</button>
      </div>`;
  } else {
    gate.innerHTML = `
      <div class="install-gate-title">${IS_BETA ? 'Bunch Bets BETA' : 'Bunch Bets'}</div>
      <div class="install-gate-card">
        <h3>Add to Home Screen</h3>
        <div class="install-gate-steps">
          <div class="step"><span class="step-num">1</span><span>Open your browser menu</span></div>
          <div class="step"><span class="step-num">2</span><span>Tap <strong>Add to Home Screen</strong></span></div>
        </div>
      </div>
      <div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,0.35);max-width:340px;line-height:1.5;">For the best experience, add Bunch Bets to your Home Screen and launch it from there.</div>`;
  }
  gate.classList.add('show');
}

async function triggerNativeInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const result = await deferredInstallPrompt.userChoice;
  if (result.outcome === 'accepted') confirmInstalled();
  deferredInstallPrompt = null;
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  confirmInstalled();
});

// Gate check — block app unless standalone or confirmed installed
(function() {
  if (isStandalone() || isInstalled()) {
    // No install gate — What's New will be triggered by launch detection below
    return;
  }
  showInstallGate();
})();
// === END INSTALL GATE ===

// Header: date + weather
(function() {
  const dateEl = document.getElementById('headerDate');
  const weatherEl = document.getElementById('headerWeather');
  if (dateEl) {
    const now = new Date();
    const opts = { weekday: 'long', month: 'long', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', opts);
  }
  // Weather — callable function so it can refresh when course changes
  window._updateWeather = function() {
    if (!weatherEl) return;
    weatherEl.textContent = '';
    function fetchWeather(lat, lng) {
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
        .then(r => r.json())
        .then(data => {
          if (!data || !data.current) return;
          const c = data.current;
          const temp = Math.round(c.temperature_2m);
          const wind = Math.round(c.wind_speed_10m);
          const codes = {0:['☀️','Clear'],1:['🌤','Mostly Clear'],2:['⛅','Partly Cloudy'],3:['☁️','Overcast'],45:['🌫','Foggy'],48:['🌫','Foggy'],51:['🌦','Light Drizzle'],53:['🌦','Drizzle'],55:['🌧','Heavy Drizzle'],61:['🌧','Light Rain'],63:['🌧','Rain'],65:['🌧️','Heavy Rain'],71:['🌨','Light Snow'],73:['❄️','Snow'],75:['❄️','Heavy Snow'],80:['🌦','Showers'],81:['🌧','Showers'],82:['⛈','Heavy Showers'],95:['⛈','Thunderstorm'],96:['⛈','Thunderstorm'],99:['⛈','Thunderstorm']};
          const [emoji, desc] = codes[c.weather_code] || ['☀️','Clear'];
          const windEmoji = wind >= 15 ? '💨' : '🍃';
          weatherEl.textContent = `${emoji} ${temp}°F ${desc}  ${windEmoji} ${wind}mph`;
        })
        .catch(() => { weatherEl.textContent = ''; });
    }
    // Match course name to COURSE_DB — fuzzy: "El Macero" matches "El Macero CC"
    const courseName = State.data && State.data.course && State.data.course.name;
    let dbCourse = null;
    if (courseName && typeof COURSE_DB !== 'undefined') {
      const lower = courseName.toLowerCase();
      dbCourse = COURSE_DB.find(c => c.name.toLowerCase() === lower)
        || COURSE_DB.find(c => c.name.toLowerCase().startsWith(lower))
        || COURSE_DB.find(c => lower.startsWith(c.name.toLowerCase().replace(/ cc$| gc$| golf club$/,'')));
    }
    if (dbCourse && dbCourse.lat && dbCourse.lng) {
      fetchWeather(dbCourse.lat, dbCourse.lng);
    } else {
      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(loc => { if (loc.latitude && loc.longitude) fetchWeather(loc.latitude, loc.longitude); })
        .catch(() => {});
    }
  };
  window._updateWeather();
})();


// Intelligent launch detection
(function() {
  gtag('event', 'app_open', { theme: localStorage.getItem('bunchbets_theme') || 'classic' });
  const today = new Date().toDateString();
  const lastActive = State.data.lastActiveDate;

  // Check if there's an active game with scores
  const hasActiveGame = () => {
    // Check if any game has at least one score entered
    for (const g of State.data.games) {
      for (const pid of Object.keys(g.gross || {})) {
        const scores = g.gross[pid];
        if (scores && scores.some(s => s !== null)) return true;
      }
    }
    return false;
  };

  // If joining via URL, don't auto-launch wizard (joinGame will handle navigation)
  const appReady = () => { document.body.classList.remove('splashing'); document.body.style.background = ''; };
  if (joiningViaUrl) { appReady(); return; }

  // If it's a new day, show wizard for fresh start
  // If same day with active game, go to scores
  if (lastActive !== today) {
    // New day - show wizard, then show What's New after splash finishes
    Wizard.start();
    setTimeout(() => showWhatsNew(), 10000);
  } else if (hasActiveGame()) {
    // Same day with active game - go to scores tab
    State.data.tab = 'scores';
    State.scheduleRender();
    appReady();
    showWhatsNew();
  } else {
    // Same day but no active game - show wizard
    Wizard.start();
    setTimeout(() => showWhatsNew(), 10000);
  }
})();

// === SERVICE WORKER ===
// Offline shell. Without this an installed PWA cannot cold-start with no signal,
// which is the situation this app exists for. See sw.js for the caching strategy.
(function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;

  // Escape hatch. Load the app with ?nosw=1 to tear the worker out and drop its
  // caches — recovers a bad deploy without needing another deploy.
  if (new URLSearchParams(location.search).has('nosw')) {
    // Must wait for load: a service worker cannot navigate() a client whose
    // document is still loading, so firing this during parse silently does nothing.
    window.addEventListener('load', function () {
      (async function tearDown() {
        try {
          const ctrl = navigator.serviceWorker.controller;
          if (ctrl) {
            ctrl.postMessage({ type: 'KILL' });
            // Fallback: if the worker cannot navigate us, go there ourselves.
            setTimeout(function () {
              if (navigator.serviceWorker.controller) {
                location.replace(location.pathname + '?swremoved=1');
              }
            }, 3000);
            return;
          }
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
          const keys = (window.caches ? await caches.keys() : []) || [];
          await Promise.all(keys.filter((k) => k.indexOf('bunchbets-') === 0).map((k) => caches.delete(k)));
          try { Err.toast('Service worker removed'); } catch (e) {}
        } catch (e) {}
      })();
    });
    return;
  }

  let updateAccepted = false;

  function showUpdateBanner(waitingWorker) {
    if (document.getElementById('swUpdate')) return;
    const bar = document.createElement('div');
    bar.className = 'sw-update show';
    bar.id = 'swUpdate';
    bar.innerHTML = '<span>A new version of Bunch Bets is ready.</span>' +
                    '<span style="display:flex;align-items:center;gap:4px;">' +
                    '<button class="sw-dismiss" id="swLater">Later</button>' +
                    '<button id="swReload">Reload</button></span>';
    document.body.appendChild(bar);
    document.getElementById('swLater').onclick = () => bar.remove();
    document.getElementById('swReload').onclick = () => {
      updateAccepted = true;
      bar.remove();
      // Ask the waiting worker to take over; controllerchange then reloads us.
      if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
    };
  }

  if (new URLSearchParams(location.search).has('swremoved')) {
    window.addEventListener('load', function () {
      setTimeout(function () { try { Err.toast('Service worker removed'); } catch (e) {} }, 600);
    });
    return;
  }

  // Register immediately rather than on 'load'. Deferring to load is the usual
  // advice (don't compete with the first paint for bandwidth), but it means a
  // single slow subresource — fonts, analytics, the Firebase SDK — can delay or
  // prevent registration entirely. On a phone with one bar that is exactly the
  // case where the offline shell matters most.
  (function () {
    navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).then(function (reg) {
      // A worker already waiting from a previous visit.
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound', function () {
        const incoming = reg.installing;
        if (!incoming) return;
        incoming.addEventListener('statechange', function () {
          // controller present => this is an update, not the first install.
          if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner(incoming);
          }
        });
      });
    }).catch(function () { /* offline first load, or SW unsupported — app still works */ });

    // clients.claim() fires this on the very first install too, so only reload
    // when the user actually asked for the update.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!updateAccepted) return;
      updateAccepted = false;
      location.reload();
    });

    // clients.claim() fires this on the very first install too, so only reload
    // when the user actually asked for the update.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!updateAccepted) return;
      updateAccepted = false;
      location.reload();
    });
  })();

  // Menu readout: is this device actually able to play offline right now?
    // Guessing at that from the outside is how the first phone test got wasted.
    function refreshOfflineStatus() {
      const el = document.getElementById('swStatus');
      if (!el) return;
      if (!('serviceWorker' in navigator)) { el.textContent = 'Not supported on this browser'; return; }
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (!reg) { el.textContent = 'Not installed yet — open once with a signal'; return; }
        const ctrl = navigator.serviceWorker.controller;
        if (!ctrl) { el.textContent = 'Installing — close and reopen the app to finish'; return; }
        const ch = new MessageChannel();
        let answered = false;
        ch.port1.onmessage = function (e) {
          answered = true;
          const d = e.data || {};
          el.textContent = d.shellCached
            ? 'Ready to play offline (v' + d.version + ', ' + d.entries + ' files cached)'
            : 'Active, but the offline copy is missing — reopen with a signal';
        };
        try { ctrl.postMessage({ type: 'STATUS' }, [ch.port2]); } catch (e) {}
        setTimeout(function () { if (!answered) el.textContent = 'Active, but not responding'; }, 2500);
      }).catch(function () { el.textContent = 'Status unavailable'; });
    }
  window._bbOfflineStatus = refreshOfflineStatus;
  window.addEventListener('load', function () {
    setTimeout(refreshOfflineStatus, 1500);
    const menuBtn = document.getElementById('menuToggle');
    if (menuBtn) menuBtn.addEventListener('click', function () { setTimeout(refreshOfflineStatus, 100); });
  });
})();

})();
</script>
