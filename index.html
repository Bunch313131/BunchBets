<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<!-- The first-paint value only. UI.syncStatusBarColor() replaces it with the
     active theme's --status-bar as soon as the menu initialises; this is the
     default theme's (Augusta, light) so the status bar does not flash black
     above a green header on a cold launch. -->
<meta name="theme-color" content="#2d6a3f" />
<style>html,body{background:#000}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- NOT black-translucent. Safari 26 ("Liquid Glass") stopped painting a fixed
     colour behind the status bar and started SAMPLING the page pixels under it,
     falling back to a white wash whenever it cannot read a flat colour there —
     a semi-transparent header, a textured one, or a transparent root. This
     app's header is all three at once depending on the theme: a repeating
     gradient over var(--card), which is rgba() on Midnight.

     The result was a white gradient bleeding down from the top, past the
     cutout, over the header. iOS 27 made it stronger. It is not ours to fix in
     CSS — Apple has published nothing, and the behaviour is reverse-engineered
     — so the fix is to stop putting content up there at all. `default` insets
     the web view below an opaque status bar, and that bar is filled with
     `theme-color`, which UI.syncStatusBarColor() keeps matching the header.

     `viewport-fit=cover` stays: it still governs the home indicator, the
     landscape side insets, and the browser (non-installed) case, and every
     env(safe-area-inset-*) in this file simply resolves to 0 at the top when
     the status bar is opaque.

     NOTE FOR WHOEVER TESTS THIS: an already-installed home-screen app keeps
     the old style. The icon has to be deleted and re-added. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="BunchBets180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Bunch Bets V7.3</title>
<!-- Environment switch — anything that is not the production host is BETA.
     Runs before render so the manifest/icon are correct at install time. -->
<script>
(function(){
  window._bbBeta = location.hostname !== 'bunchbets.com';
  if (!window._bbBeta) return;
  document.title = 'Bunch Bets BETA';
  var m = document.querySelector('link[rel="manifest"]');
  if (m) m.href = 'manifest.beta.webmanifest';
  var a = document.querySelector('link[rel="apple-touch-icon"]');
  if (a) a.href = 'BunchBetsBeta180.png';
  // Beta used to stain the status bar red to mark the environment. It cannot
  // any more: the bar is now a solid band butted against the header, and a red
  // stripe above a green header reads as a rendering fault rather than a label.
  // The BETA badge in the header says the same thing without the seam.
  document.addEventListener('DOMContentLoaded', function(){
    document.body.classList.add('is-beta');
    var logo = document.querySelector('.header-brand img');
    if (logo) logo.src = 'BunchBetsBeta180.png';
  });
})();
</script>
<!-- Viewport height fix — must run before body renders to avoid flash.

     window.innerHeight, NOT screen.height.

     screen.height is the whole physical panel. That was right for exactly as
     long as the app drew under a translucent status bar and really did occupy
     the whole panel. 7.20 made the status bar opaque, so iOS now insets the web
     view below it — and the body went on being forced to the full panel height,
     ~50px taller than the window it lives in, with overflow:hidden. The header
     was pushed out of view at the top and the bottom nav off the end: "once you
     get to gameplay, the black bar is gone from the top and the top header is
     now cut off."

     innerHeight is the layout viewport, which is exactly the web view. It also
     does NOT shrink when the keyboard opens (visualViewport.height does, which
     would collapse the whole app while somebody types a player's name), and in
     a browser tab it tracks the URL bar the way 100dvh does.

     screen.height survives only as the last-ditch fallback. -->
<script>
(function(){
  function setAppHeight(){
    var h = window.innerHeight || screen.height;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  // innerHeight is not always settled while the head is still parsing, and the
  // status bar inset in particular lands late on a cold launch in standalone.
  window.addEventListener('load', setAppHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setAppHeight, 100); });
})();
</script>

.theme-switch { position:relative; width:50px; height:26px; display:inline-block; }

.theme-slider:before { position:absolute; content:""; height:20px; width:20px; left:3px; bottom:3px; background:var(--card); border-radius:50%; transition:0.3s; }
.theme-switch input:checked + .theme-slider { background:var(--acc); }

.theme-g5 .card { outline:1px solid rgba(20,184,166,.45); background:linear-gradient(0deg,rgba(20,184,166,.08),rgba(20,184,166,.08)) var(--card); }
.theme-g6 .card { outline:1px solid rgba(219,39,119,.45); background:linear-gradient(0deg,rgba(219,39,119,.08),rgba(219,39,119,.08)) var(--card); }
.cellWrap { position:relative; }
.cellWrap input { width:54px; text-align:center; padding-right:14px; }
.cellWrap .dots { position:absolute; right:2px; top:4px; display:flex; flex-direction:column; gap:2px; pointer-events:none; z-index:1; }
.cellWrap .dot { width:6px; height:6px; border-radius:50%; }
.cellWrap .dot.g1 { background-color:#16a34a; }
.cellWrap .dot.g2 { background-color:#dc2626; }
.cellWrap .dot.g3 { background-color:#d97706; }
.cellWrap .dot.g4 { background-color:#6366f1; }
.cellWrap .dot.g5 { background-color:#14b8a6; }
.cellWrap .dot.g6 { background-color:#db2777; }
/* Score indicators - circles for under par, squares for over par */
.cellWrap .score-indicator { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.cellWrap .score-indicator::before { content:''; position:absolute; width:28px; height:28px; border:2px solid transparent; }
.cellWrap .score-indicator::after { content:''; position:absolute; width:36px; height:36px; border:2px solid transparent; }
.cellWrap.birdie .score-indicator::before { border-color:#16a34a; border-radius:50%; }
.cellWrap.eagle .score-indicator::before { border-color:#16a34a; border-radius:50%; }
.cellWrap.eagle .score-indicator::after { border-color:#16a34a; border-radius:50%; }
.cellWrap.bogey .score-indicator::before { border-color:#dc2626; border-radius:4px; }
.cellWrap.double-bogey .score-indicator::before { border-color:#dc2626; border-radius:4px; }
.cellWrap.double-bogey .score-indicator::after { border-color:#dc2626; border-radius:4px; }
.junkWrap { position:relative; display:inline-block; }
.junkBox { width:48px; height:36px; text-align:center; font-size:20px; padding:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.22); position:relative; z-index:2; border-radius:6px; }
.junkVal { position:absolute; top:8px; right:6px; font-size:12px; pointer-events:none; z-index:1; }
.junkWrap .junkBox:not(:placeholder-shown) + .junkVal { display:none; }
.junkWrap:focus-within .junkVal { display:none; }
.game-options-row { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,0.8fr); gap:16px 20px; align-items:start; }
@media (max-width: 360px) { .game-options-row { grid-template-columns:1fr; } }
.ios .junkWrap .junkBox { color:transparent; -webkit-text-fill-color:transparent; caret-color:var(--txt); z-index:1; }
.ios .junkWrap .junkVal { position:absolute; inset:0; display:flex !important; align-items:center; justify-content:center; z-index:2; color:var(--txt); -webkit-text-fill-color:var(--txt); transform:translateZ(0); }
select.press-select { min-height:36px; padding:6px 8px; font-size:14px; }
.press-row { background:rgba(255,255,255,0.02); }
.press-row.theme-g1 { background:rgba(22,163,74,0.15); }
.press-row.theme-g2 { background:rgba(220,38,38,0.15); }
.press-row.theme-g3 { background:rgba(217,119,6,0.15); }
.press-row.theme-g4 { background:rgba(99,102,241,0.15); }
.press-row.theme-g5 { background:rgba(20,184,166,0.15); }
.press-row.theme-g6 { background:rgba(219,39,119,0.15); }
/* Scores/Junk Toggle Bar */
.scoring-toggle { display:flex; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:6px; }
.scoring-toggle-btn { flex:1; padding:5px 10px; text-align:center; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s; border:none; background:transparent; color:var(--muted); }
.scoring-toggle-btn.active { background:var(--acc); color:#fff; }
.scoring-toggle-btn:not(.active):hover { background:rgba(255,255,255,0.05); }
.press-label { font-weight:600; font-size:12px; }
.hole-press-section { padding:6px 12px 2px; }
.hole-press-row { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-radius:8px; margin-bottom:4px; }
.hole-press-row.theme-g1 { background:rgba(22,163,74,0.15); }
.hole-press-row.theme-g2 { background:rgba(220,38,38,0.15); }
.hole-press-row.theme-g3 { background:rgba(217,119,6,0.15); }
.hole-press-row.theme-g4 { background:rgba(99,102,241,0.15); }
.hole-press-row.theme-g5 { background:rgba(20,184,166,0.15); }
.hole-press-row.theme-g6 { background:rgba(219,39,119,0.15); }
.hole-press-label { font-weight:600; font-size:12px; }
.hole-press-btns { display:flex; gap:0; border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.hole-press-btn { padding:5px 12px; font-size:12px; font-weight:500; border:none; background:transparent; color:var(--muted); cursor:pointer; }
.hole-press-btn.active { background:var(--acc); color:#fff; }
.digits-display { font-size:20px; font-weight:700; font-family:monospace; color:var(--acc); }
.points-positive { color:var(--success); font-weight:600; }
.points-negative { color:var(--danger); font-weight:600; }
/* Live Sharing Styles */
.live-banner { background:linear-gradient(135deg,var(--acc),#6366f1); color:#fff; padding:8px 12px; text-align:center; font-weight:600; font-size:14px; }
.live-banner.viewer { background:linear-gradient(135deg,#d97706,#dc2626); }
.share-code { font-family:monospace; font-size:24px; font-weight:700; letter-spacing:2px; background:rgba(255,255,255,0.1); padding:8px 16px; border-radius:8px; display:inline-block; }
.modal-overlay { position:fixed; top:calc(-1 * env(safe-area-inset-top, 0px)); left:0; right:0; bottom:calc(-1 * env(safe-area-inset-bottom, 0px)); background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:400px; width:100%; max-height:90vh; overflow-y:auto; }
.modal h2 { margin:0 0 16px 0; font-size:18px; }
.modal-actions { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
.copy-btn { background:var(--acc); color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
.copy-btn:hover { opacity:0.9; }
.join-input { font-family:monospace; font-size:20px; letter-spacing:2px; text-transform:uppercase; text-align:center; }
.sync-indicator { display:inline-block; width:8px; height:8px; border-radius:50%; background:#16a34a; margin-right:6px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
/* Viewer mode - disable all inputs */
.viewer-mode input, .viewer-mode select, .viewer-mode button:not(.btn) { pointer-events:none; opacity:0.7; }
.viewer-mode .tabs .btn { pointer-events:auto; opacity:1; }
.viewer-mode #joinBtn { display:none; }

/* Hamburger Menu Styles */
.header-brand { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.beta-badge { display:none; }
body.is-beta .beta-badge { display:inline-flex; align-items:center; background:#dc2626; color:#fff; font-size:9px; font-weight:800; letter-spacing:1.5px; padding:2px 6px; border-radius:4px; flex-shrink:0; }
body.is-beta header { box-shadow: inset 0 3px 0 #dc2626; }
.header-brand img { width:36px; height:36px; border-radius:8px; flex-shrink:0; }
.header-info { display:flex; flex-direction:column; gap:1px; flex:1; text-align:center; }
.header-date { font-size:14px; font-weight:600; letter-spacing:0.3px; }
.header-weather { font-size:11px; color:var(--muted); font-weight:500; }
.hamburger { background:none; border:none; color:var(--txt); font-size:28px; cursor:pointer; padding:4px 8px; line-height:1; }
.hamburger:hover { color:var(--acc); }
.menu-overlay { position:fixed; top:calc(-1 * env(safe-area-inset-top, 0px)); left:0; right:0; bottom:calc(-1 * env(safe-area-inset-bottom, 0px)); background:rgba(0,0,0,0.5); z-index:100; opacity:0; visibility:hidden; transition:opacity 0.3s, visibility 0.3s; }
.menu-overlay.open { opacity:1; visibility:visible; }
.slide-menu { position:fixed; top:0; right:-280px; width:280px; height:100%; background:var(--card); border-left:1px solid var(--border); z-index:101; transition:right 0.3s ease; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; }
.slide-menu.open { right:0; }
.menu-header { padding:16px; padding-top:calc(env(safe-area-inset-top, 0px) + 16px); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.menu-header h2 { margin:0; font-size:16px; }
.menu-close { background:none; border:none; color:var(--txt); font-size:24px; cursor:pointer; padding:4px; line-height:1; }
.menu-close:hover { color:var(--danger); }
.menu-section { padding:12px 0; border-bottom:1px solid var(--border); }
.menu-section:last-child { border-bottom:none; }
.menu-section-title { padding:8px 16px; font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:0.5px; }
.menu-item { display:block; width:100%; padding:12px 16px; background:none; border:none; color:var(--txt); font-size:15px; text-align:left; cursor:pointer; transition:background 0.2s; }
.menu-item:hover { background:rgba(255,255,255,0.05); }
.menu-item.active { color:var(--acc); background:rgba(59,130,246,0.1); }
.menu-item.danger { color:var(--danger); }
.menu-item.primary { color:var(--acc); font-weight:600; }
.cloud-note { padding:2px 16px 8px; font-size:12px; line-height:1.45; color:var(--muted); }
.cloud-id { padding:10px 16px; font-size:13px; line-height:1.5; }
.cloud-id b { font-size:15px; }
.cloud-id .sub { color:var(--muted); font-size:12px; }
.cloud-invite { margin:4px 12px 8px; padding:10px 12px; border:1px solid var(--acc); border-radius:10px; font-size:13px; line-height:1.45; }
.cloud-invite button { margin-top:8px; width:100%; padding:9px; border-radius:8px; border:none; background:var(--acc); color:#fff; font-weight:700; font-size:13px; cursor:pointer; }
.cloud-backup { margin-top:8px; padding:7px 12px; border-radius:8px; border:1px solid var(--acc); background:none; color:var(--acc); font-weight:700; font-size:12px; cursor:pointer; }
.wiz-tee { margin-top:14px; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--card); }
/* Docked under the course list, NOT inside it. The list scrolls and this does
   not, so it needs a hard edge of its own — sharing the page background made it
   read as the last card in the list, i.e. as belonging to whatever course
   happened to be scrolled to rather than to the one that is selected. */
.wiz-tee-dock { flex:0 0 auto; padding:0 16px 12px; border-top:1px solid var(--border); background:var(--card); }
.wiz-tee-dock .wiz-tee { margin-top:12px; }
.wiz-tee-course { font-size:12px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
.wiz-tee-row { display:flex; align-items:center; gap:10px; }
.wiz-tee-label { font-size:13px; font-weight:700; flex:0 0 auto; }
.wiz-tee-pick { flex:1; min-height:44px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:var(--txt); font-size:15px; }
.wiz-tee-msg { margin-top:8px; font-size:12px; color:var(--muted); line-height:1.45; }
.wiz-cloud { margin-top:14px; padding:12px; border:1px dashed var(--border); border-radius:10px; }
.wiz-cloud-msg { font-size:12.5px; color:var(--muted); line-height:1.45; }
.wiz-cloud-btn { margin-top:10px; width:100%; padding:11px; border-radius:8px; border:none; background:var(--acc); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
.wiz-cloud-btn:disabled { opacity:0.5; }
.stand-tabs { display:flex; gap:8px; margin-bottom:10px; }
.stand-tab { flex:1; padding:9px; border-radius:8px; border:1px solid var(--border); background:none; color:var(--muted); font-weight:700; font-size:13px; cursor:pointer; }
.stand-tab.on { border-color:var(--acc); color:var(--acc); }
.stand-seasons { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.stand-season { padding:5px 10px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; }
.stand-season.on { border-color:var(--acc); color:var(--acc); }
.stand-table { border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.stand-row { display:flex; align-items:center; padding:11px 10px; border-bottom:1px solid var(--border); font-size:14px; }
.stand-row:last-child { border-bottom:none; }
.stand-head { background:var(--card); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
.stand-pos { flex:0 0 22px; color:var(--muted); font-size:12px; }
.stand-name { flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stand-n { flex:0 0 40px; text-align:right; font-variant-numeric:tabular-nums; }
.stand-n.wide { flex:0 0 62px; font-weight:700; }
.stand-n.up { color:var(--success); }
.stand-n.down { color:var(--danger, #e5484d); }
.stand-guest { font-size:10px; font-weight:700; color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:1px 4px; margin-left:5px; text-transform:uppercase; }
.link-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); }
.link-name { flex:0 0 30%; font-weight:700; font-size:15px; }
.link-pick { flex:1; padding:9px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--txt); font-size:14px; }

/* Wizard Styles */
.wizard-overlay { position:fixed; top:calc(-1 * env(safe-area-inset-top, 0px)); left:0; right:0; bottom:calc(-1 * env(safe-area-inset-bottom, 0px)); z-index:200; display:flex; flex-direction:column; overflow:hidden; background:#000; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
.wizard-splash {
  background: linear-gradient(135deg, #0a2e14 0%, #061a0b 50%, #000 100%);
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  transition:transform 1.4s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease;
  box-shadow:0 8px 40px rgba(0,0,0,0.6), 0 2px 12px rgba(0,0,0,0.4);
  margin-top:calc(-1 * env(safe-area-inset-top, 0px));
  margin-bottom:calc(-1 * env(safe-area-inset-bottom, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.wizard-splash.curtain-up { transform:translateY(-100%); box-shadow:0 20px 60px rgba(0,0,0,0.8), 0 8px 24px rgba(0,0,0,0.5); }
.wizard-splash canvas.splash-particles { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
.splash-center { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:10px; }
.splash-glow { position:absolute; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(22,163,74,0.5) 0%, transparent 65%); filter:blur(50px); opacity:0; animation:splashGlowIn 2.2s ease-out 0.2s forwards; z-index:0; }
.splash-shimmer { position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.06) 40%, rgba(255,255,255,0.14) 48%, rgba(255,255,255,0.06) 56%, transparent 66%); opacity:0; animation:splashShimmerFull 1.6s ease-in-out 3.4s forwards; }
@keyframes splashShimmerFull { 0%{opacity:1;transform:translateX(-100%);} 100%{opacity:1;transform:translateX(100%);} }
.splash-logo { position:relative; z-index:1; opacity:0; transform:scale(0.7); filter:blur(12px); animation:splashLogoIn 2s cubic-bezier(0.16,1,0.3,1) 0.3s forwards; }
.splash-logo svg { width:200px; height:200px; filter:drop-shadow(0 10px 40px rgba(0,0,0,0.6)) drop-shadow(0 0 60px rgba(22,163,74,0.5)); }
.splash-title { font-family:'Inter',system-ui,sans-serif; font-size:36px; font-weight:900; letter-spacing:4px; padding-left:4px; text-transform:uppercase; color:#fff; opacity:0; transform:translateY(16px) scale(0.95); animation:splashTextIn 1.2s ease-out 1.4s forwards; text-shadow:0 2px 30px rgba(0,0,0,0.6), 0 0 60px rgba(22,163,74,0.3); display:flex; align-items:center; }
.splash-s { position:relative; display:inline-block; }
.splash-s .s-line { position:absolute; left:calc(50% - 2px); top:4px; bottom:4px; width:2.5px; margin-left:-1.25px; background:#fff; transform-origin:center top; transform:scaleY(0); border-radius:2px; }
.splash-s.morph .s-line { animation:drawLine 0.5s ease-out forwards; background:#ffdd00; box-shadow:0 0 8px rgba(255,221,0,0.5); }
.splash-s.morph { animation:turnGold 0.4s ease-out 0.45s forwards; }
@keyframes drawLine { 0%{transform:scaleY(0);} 100%{transform:scaleY(1);} }
@keyframes turnGold { 0%{color:#fff;filter:brightness(1);text-shadow:none;} 50%{filter:brightness(1.5);} 100%{color:#ffdd00;filter:brightness(1);text-shadow:0 0 20px rgba(255,221,0,0.6), 0 0 40px rgba(255,221,0,0.3);} }
.splash-line { width:60px; height:2px; background:linear-gradient(90deg, transparent, #ffdd00, transparent); opacity:0; animation:splashLineIn 1.5s ease-out 1.1s forwards; }
.splash-subtitle { font-size:12px; font-weight:500; letter-spacing:3px; padding-left:3px; text-transform:uppercase; color:rgba(255,255,255,0.5); opacity:0; transform:translateY(8px); animation:splashTextIn 1s ease-out 2s forwards; }
@keyframes splashGlowIn { 0%{opacity:0;transform:scale(0.3);} 100%{opacity:0.85;transform:scale(1);} }
@keyframes splashLogoIn { 0%{opacity:0;transform:scale(0.7);filter:blur(12px);} 45%{filter:blur(0);} 100%{opacity:1;transform:scale(1);filter:blur(0);} }
@keyframes splashTextIn { 0%{opacity:0;transform:translateY(16px) scale(0.95);} 100%{opacity:1;transform:translateY(0) scale(1);} }
@keyframes splashLineIn { 0%{opacity:0;width:0;} 100%{opacity:1;width:60px;} }
.wizard-screen { background:var(--bg); flex:1; display:flex; flex-direction:column; overflow:hidden; }
.wizard-header { padding:20px 16px 12px; padding-top:calc(env(safe-area-inset-top, 0px) + 12px); text-align:center; }
.wizard-header h2 { margin:0 0 4px 0; font-size:22px; }
.wizard-header p { margin:0; color:var(--muted); font-size:14px; }
.wizard-content { flex:1; overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; padding:12px 16px; -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none; }
.wizard-content::-webkit-scrollbar { display:none; }
.wizard-footer { padding:12px 16px; border-top:1px solid var(--border); background:var(--card); display:flex; flex-wrap:wrap; gap:8px; }

.wizard-footer .btn.secondary { flex:0 0 auto; min-width:80px; background:var(--card); }
.wizard-skip { width:100%; text-align:center; margin-top:4px; }

.wizard-skip a:hover { color:var(--acc); }
.wizard-join-live { width:100%; margin-top:8px; padding:12px 12px; font-size:14px; font-weight:600; letter-spacing:0.5px; color:#fff; background:linear-gradient(135deg,var(--acc),#6366f1); border:2px solid #16a34a; border-radius:999px; cursor:pointer; animation:glowCycle 2s ease-in-out infinite; }
@keyframes glowCycle { 0%,100% { border-color:#16a34a; box-shadow:0 0 8px #16a34a, 0 0 20px rgba(22,163,74,0.3); } 50% { border-color:#ffdd00; box-shadow:0 0 8px #ffdd00, 0 0 20px rgba(255,221,0,0.3); } }
.wizard-player-row { display:grid; grid-template-columns:1fr 80px 40px; gap:8px; align-items:center; margin-bottom:12px; }
.wizard-player-row.header { font-size:12px; color:var(--muted); margin-bottom:8px; }
.wizard-player-row input { min-height:44px; }
.wizard-player-row .delete-btn { background:none; border:none; color:var(--danger); font-size:20px; cursor:pointer; padding:8px; }
.wizard-player-row .delete-btn:hover { opacity:0.7; }
.wizard-add-btn { background:rgba(59,130,246,0.1); border:1px dashed var(--acc); color:var(--acc); padding:12px; border-radius:10px; width:100%; cursor:pointer; font-size:14px; margin-top:8px; }
.wizard-add-btn:hover { background:rgba(59,130,246,0.2); }
.wizard-course-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; transition:all 0.2s; }
.wizard-course-card:hover { border-color:var(--acc); }
.wizard-course-card.selected { border-color:var(--acc); background:rgba(59,130,246,0.1); }
.wizard-course-card h3 { margin:0 0 4px 0; font-size:15px; }
.wizard-course-card p { margin:0; font-size:12px; color:var(--muted); }
.wizard-course-card .course-head { display:flex; justify-content:space-between; align-items:center; }
.wizard-course-distance { font-size:12px; color:var(--acc); font-weight:600; white-space:nowrap; }
.wizard-course-locating { text-align:center; padding:24px 0; color:var(--muted); font-size:13px; }
.wizard-course-section-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:16px 0 6px; font-weight:600; }
.wizard-section { margin-bottom:20px; }
.wizard-section-title { font-size:13px; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px; }
.wizard-option { display:flex; align-items:center; gap:10px; padding:12px; background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; }
.wizard-option:hover { border-color:var(--acc); }
.wizard-option.selected { border-color:var(--acc); background:rgba(59,130,246,0.1); }
.wizard-option input[type="radio"] { width:18px; height:18px; }
.wizard-team-zone { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; min-height:100px; text-align:center; }
.wizard-team-zone h4 { margin:0 0 8px 0; font-size:13px; color:var(--muted); text-align:center; }
.wizard-player-chip { display:inline-block; background:rgba(59,130,246,0.2); border:1px solid var(--acc); border-radius:20px; padding:6px 12px; margin:4px; font-size:13px; cursor:pointer; }
.wizard-player-chip:hover { background:rgba(59,130,246,0.3); }
.wizard-player-chip.team-a { background:rgba(22,163,74,0.2); border-color:#16a34a; }
.wizard-player-chip.team-b { background:rgba(220,38,38,0.2); border-color:#dc2626; }
.wizard-player-chip.skins-selected { background:#16a34a; border-color:#16a34a; color:#fff; font-weight:600; }
.wizard-player-chip.skins-selected::before { content:'✓ '; }
.wizard-player-chip.skins-unselected { background:rgba(100,100,100,0.15); border-color:rgba(100,100,100,0.3); color:var(--muted); }
.wizard-game-tabs { display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
.wizard-game-tab { padding:6px 14px; border-radius:20px; font-size:13px; cursor:pointer; border:1px solid var(--border); background:var(--card); transition:all 0.2s; }
.wizard-game-tab:hover { border-color:var(--acc); }
.wizard-game-tab.active { background:var(--acc); color:#fff; border-color:var(--acc); }
.wizard-game-tab .delete-game { margin-left:6px; opacity:0.7; }
.wizard-game-tab .delete-game:hover { opacity:1; }
.wizard-holes-grid { display:grid; grid-template-columns:repeat(9, 1fr); gap:4px; margin-bottom:12px; }
.wizard-hole-col { display:flex; flex-direction:column; align-items:center; gap:2px; }
.wizard-hole-num { font-size:11px; font-weight:600; color:var(--muted); }
.wizard-hole-input { width:100%; min-width:0; padding:6px 2px; text-align:center; font-size:13px; border:1px solid var(--border); border-radius:6px; background:var(--card); }
.wizard-hole-input:focus { border-color:var(--acc); outline:none; }
/* Currency input styling for stakes/points */
.currency-input-wrap { position:relative; display:flex; align-items:center; }
.currency-input-wrap::before { content:'$'; position:absolute; left:10px; color:var(--muted); font-size:14px; pointer-events:none; z-index:1; }
.currency-input { width:80px; padding:8px 8px 8px 22px; font-size:14px; min-height:40px; text-align:right; }
/* Help button for game explanations */
.help-btn { width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--acc); font-weight:700; font-size:14px; cursor:pointer; flex-shrink:0; }
.help-btn:hover { background:var(--acc); color:#fff; }

/* ═══════════════════════════════════════════════════════
   NEW HOLE-BY-HOLE SCORING SCREEN
   ═══════════════════════════════════════════════════════ */
.hole-scoring { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.hole-scoring-nav { display:flex; align-items:center; justify-content:space-between; background:var(--acc); padding:9px 12px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.hole-scoring-nav .hole-nav-btn { width:41px; height:41px; border-radius:50%; border:none; background:rgba(255,255,255,0.15); color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.hole-scoring-nav .hole-nav-btn:active { transform:scale(0.92); background:rgba(255,255,255,0.25); }
.hole-scoring-nav .hole-nav-btn:disabled { opacity:0.3; cursor:default; }
.hole-nav-info { text-align:center; color:#fff; }
.hole-nav-info .hole-num { font-size:19px; font-weight:700; }
.hole-nav-info .hole-details { font-size:12px; opacity:0.85; }

/* Column headers */
.hole-col-headers { display:flex; align-items:center; justify-content:flex-end; padding:4px 12px 3px; border-bottom:1px solid var(--border); }
.hole-col-hdr { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; text-align:center; }
.hole-col-hdr.score { color:var(--muted); }
.hole-col-hdr.junk { color:var(--warning); }

/* Player score rows */
.hole-player-row { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--border); }
.hole-player-row:last-child { border-bottom:none; }
.hole-player-info { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
.hole-player-name { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hole-player-hcp { font-size:10px; color:var(--muted); }
.hole-stroke-dots { display:flex; gap:3px; align-items:center; }
.hole-stroke-dots .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.hole-stroke-dots .dot.g1 { background-color:#16a34a; }
.hole-stroke-dots .dot.g2 { background-color:#dc2626; }
.hole-stroke-dots .dot.g3 { background-color:#d97706; }
.hole-stroke-dots .dot.g4 { background-color:#6366f1; }
.hole-stroke-dots .dot.g5 { background-color:#14b8a6; }
.hole-stroke-dots .dot.g6 { background-color:#db2777; }
.hole-score-controls { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.hole-score-adj { width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--txt); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; -webkit-tap-highlight-color:transparent; }
.hole-score-adj:active { transform:scale(0.9); background:var(--acc); color:#fff; border-color:var(--acc); }
.hole-score-display { width:40px; height:40px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:20px; font-weight:700; border:2px solid var(--border); background:var(--card); position:relative; }
.hole-score-display.eagle { border-color:var(--success); color:var(--success); background:rgba(22,163,74,0.08); }
.hole-score-display.birdie { border-color:var(--success); color:var(--success); }
.hole-score-display.bogey { border-color:var(--danger); color:var(--danger); }
.hole-score-display.double-bogey { border-color:var(--danger); color:var(--danger); background:rgba(220,38,38,0.08); }
.hole-score-display .vs-par { font-size:8px; font-weight:500; opacity:0.7; position:absolute; bottom:1px; right:3px; }
.hole-score-display.no-score { color:var(--muted); border-color:var(--border); font-size:14px; }

/* Junk entry inline with score */
.hole-junk-inline { display:flex; align-items:center; gap:3px; border-left:1px solid var(--border); padding-left:6px; margin-left:2px; }
.hole-junk-adj { width:21px; height:21px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--txt); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
.hole-junk-adj:active { background:var(--warning); color:#fff; border-color:var(--warning); }
.hole-junk-val { width:18px; text-align:center; font-size:14px; font-weight:700; }

/* Clear hole button */
.hole-clear-btn { border:none; background:transparent; color:var(--muted); font-size:11px; cursor:pointer; padding:4px 8px; opacity:0.6; }
.hole-clear-btn:active { opacity:1; color:var(--danger); }

/* KP button */
.kp-btn { width:100%; padding:10px; border:1px dashed var(--warning); border-radius:10px; background:rgba(217,119,6,0.08); color:var(--warning); font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; transition:all 0.15s; }
.kp-btn:active { background:rgba(217,119,6,0.2); }
.kp-btn.has-kp { border-style:solid; background:rgba(217,119,6,0.15); }

/* KP Wizard Modal */
.kp-modal { position:fixed; top:calc(-1 * env(safe-area-inset-top, 0px)); left:0; right:0; bottom:calc(-1 * env(safe-area-inset-bottom, 0px)); background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
.kp-modal-content { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; max-width:360px; width:100%; }
.kp-modal-content h3 { margin:0 0 4px; font-size:17px; }
.kp-modal-content .subtitle { color:var(--muted); font-size:13px; margin-bottom:16px; }
.kp-player-btn { display:block; width:100%; padding:12px 16px; margin-bottom:8px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--txt); font-size:15px; font-weight:500; cursor:pointer; text-align:left; transition:all 0.15s; }
.kp-player-btn:active { background:var(--acc); color:#fff; border-color:var(--acc); }
.kp-player-btn.no-one { color:var(--muted); font-style:italic; }
.kp-player-btn .kp-score { float:right; font-variant-numeric:tabular-nums; color:var(--muted); font-weight:700; }
.kp-note { border:1px solid var(--acc); border-radius:8px; padding:9px 11px; font-size:13px;
  line-height:1.4; color:var(--txt); margin-bottom:14px; background:rgba(22,163,74,0.08); }

/* Hole strip */
.hole-strip { display:flex; gap:3px; padding:8px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.hole-strip::-webkit-scrollbar { display:none; }
.hole-dot { width:27px; height:27px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; cursor:pointer; flex-shrink:0; color:var(--muted); background:var(--card); transition:all 0.15s; }
.hole-dot.current { background:var(--acc); color:#fff; border-color:var(--acc); }
.hole-dot.has-scores { border-color:var(--success); color:var(--success); }
.hole-dot.current.has-scores { color:#fff; }
.hole-dot.par3 { border-style:dashed; border-color:var(--warning); }
.hole-dot.par3.current { border-style:solid; }
.hole-dot.par3.has-scores { border-color:var(--success); border-style:solid; }

/* Game status summary cards below scoring */
.game-status-card { padding:2px 8px; margin-bottom:2px; }
.game-status-card .card { padding:5px 8px !important; }

/* Score drum picker — 3D wheel effect */
.score-drum-wrap { display:flex; align-items:center; gap:8px; margin-left:auto; }
.score-drum { position:relative; width:160px; height:49px; overflow:hidden; border-radius:14px; background:linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.03) 60%, rgba(0,0,0,0.3) 100%); box-shadow:inset 0 2px 6px rgba(0,0,0,0.5), inset 0 -2px 6px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); }
.score-drum::before { content:''; position:absolute; inset:0; border-radius:14px; background:linear-gradient(90deg, rgba(0,0,0,0.4) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.4) 100%); z-index:1; pointer-events:none; }
.score-drum::after { content:''; position:absolute; top:0; left:0; right:0; height:40%; background:linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 100%); border-radius:14px 14px 0 0; z-index:1; pointer-events:none; }
.score-drum-track { display:flex; transition:transform 0.2s ease-out; height:100%; align-items:center; }
.score-drum-num { width:52px; flex-shrink:0; height:41px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--muted); opacity:0.5; text-shadow:0 1px 2px rgba(0,0,0,0.3); }
.score-drum-num.center { font-size:25px; font-weight:800; color:var(--txt); opacity:1; text-shadow:0 1px 0 rgba(255,255,255,0.15), 0 2px 4px rgba(0,0,0,0.3); }
.score-drum-num.center.eagle, .score-drum-num.center.birdie { color:var(--success); text-shadow:0 0 8px rgba(22,163,74,0.3), 0 1px 0 rgba(255,255,255,0.1); }
.score-drum-num.center.bogey, .score-drum-num.center.double-bogey { color:var(--danger); text-shadow:0 0 8px rgba(220,38,38,0.3), 0 1px 0 rgba(255,255,255,0.1); }
.score-drum-frame { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:50px; height:43px; border:2px solid var(--acc); border-radius:12px; pointer-events:none; z-index:4; box-shadow:0 0 12px rgba(59,130,246,0.25), inset 0 0 8px rgba(59,130,246,0.1); background:rgba(59,130,246,0.04); }
.score-drum-frame.eagle, .score-drum-frame.birdie { border-color:var(--success); box-shadow:0 0 12px rgba(22,163,74,0.3), inset 0 0 8px rgba(22,163,74,0.1); background:rgba(22,163,74,0.04); }
.score-drum-frame.bogey, .score-drum-frame.double-bogey { border-color:var(--danger); box-shadow:0 0 12px rgba(220,38,38,0.3), inset 0 0 8px rgba(220,38,38,0.1); background:rgba(220,38,38,0.04); }
.score-drum-touch { position:absolute; inset:0; z-index:5; cursor:grab; }
.score-drum-touch:active { cursor:grabbing; }
/* Scorecard double-rule at Front/Back 9 boundary */
td:nth-child(11), th:nth-child(11) { border-left:3px double var(--muted); }
.money { color:var(--gold); font-weight:600; font-family:monospace; }
#app { animation:fadeIn 0.15s ease-in; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
/* Bottom nav bar */
.bottom-nav { background:var(--card); border-top:1px solid var(--border); display:flex; flex-shrink:0; padding:0 12px env(safe-area-inset-bottom, 10px); }
body:has(.wizard-overlay) .bottom-nav { display:none; }
body:has(.wizard-overlay) { background:#000; }
html:has(.wizard-overlay) { background:#000; }
body:has(.install-gate.show) { background:#050d08; }
html:has(.install-gate.show) { background:#050d08; }
.bottom-nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 6px; background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; transition:color 0.2s; }
.bottom-nav-btn.active { color:var(--acc); }
.bottom-nav-btn svg { width:22px; height:22px; }
.bottom-nav-dark-toggle { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 6px; background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; transition:color 0.2s; }
.bottom-nav-dark-toggle .toggle-icon { font-size:20px; line-height:22px; height:22px; }
/* Service-worker update banner — sits above the bottom nav, never auto-dismisses */
.sw-update { position:fixed; left:12px; right:12px; bottom:calc(72px + env(safe-area-inset-bottom,0px));
  z-index:9998; display:none; align-items:center; justify-content:space-between; gap:12px;
  background:var(--card,#161b22); color:var(--txt,#e5e5e5); border:1px solid var(--acc,#16a34a);
  border-radius:12px; padding:12px 14px; box-shadow:0 8px 30px rgba(0,0,0,0.5); font-size:13px; }
.sw-update.show { display:flex; }
.sw-update button { background:var(--acc,#16a34a); color:#fff; border:none; border-radius:8px;
  padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0; }
.sw-update .sw-dismiss { background:transparent; color:var(--muted,#8b949e); font-weight:500; padding:8px; }

/* Group Score — side-game calculator */
.combo-chips { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 18px; }
.combo-chip { padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--txt); font-size:13px; font-weight:600; cursor:pointer; }
.combo-chip.active { background:var(--acc); border-color:var(--acc); color:#fff; }
.combo-total { font-size:46px; font-weight:800; text-align:center; line-height:1; }
.combo-sub { text-align:center; color:var(--muted); font-size:13px; margin:6px 0 14px; }
.combo-margin { text-align:center; font-size:15px; font-weight:700; min-height:20px; margin-top:10px; }
.combo-table { width:100%; border-collapse:collapse; font-size:12px; }
.combo-table th { text-align:left; color:var(--muted); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--border); }
.combo-table td { padding:5px 4px; border-bottom:1px solid var(--border); }
.combo-table td.num { font-variant-numeric:tabular-nums; font-weight:700; text-align:center; }
.combo-table tr.total-row td { border-top:2px solid var(--border); border-bottom:none; font-weight:800; font-size:14px; }

/* === INSTALL GATE === */
.install-gate { display:none; position:fixed; top:calc(-1 * env(safe-area-inset-top, 0px)); left:0; right:0; bottom:calc(-1 * env(safe-area-inset-bottom, 0px)); z-index:9999; background:#050d08; color:#e5e5e5; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; font-family:'Inter',system-ui,sans-serif; }
.install-gate.show { display:flex; }
.install-gate-icon { width:120px; height:120px; margin-bottom:24px; filter:drop-shadow(0 8px 30px rgba(22,163,74,0.4)); }
.install-gate-icon svg { width:100%; height:100%; display:block; }
.install-gate-title { font-size:32px; font-weight:900; letter-spacing:3px; text-transform:uppercase; margin-bottom:6px; color:#fff; }
.install-gate-subtitle { font-size:13px; font-weight:500; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:32px; }
.install-gate-card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px 24px; max-width:340px; width:100%; }
.install-gate-card h3 { font-size:16px; font-weight:700; margin:0 0 14px 0; color:#fff; }
.install-gate-steps { text-align:left; font-size:14px; line-height:1.7; color:rgba(255,255,255,0.7); }
.install-gate-steps .step-num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; background:#16a34a; color:#fff; border-radius:50%; font-size:11px; font-weight:700; margin-right:8px; flex-shrink:0; }
.install-gate-steps .step { display:flex; align-items:flex-start; margin-bottom:8px; }
.install-gate-steps .share-icon { display:inline-block; width:16px; height:16px; vertical-align:middle; margin:0 2px; }
.install-gate-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; max-width:340px; width:100%; }
.install-gate-actions .btn { width:100%; justify-content:center; font-size:15px; font-weight:700; padding:14px 20px; border-radius:12px; border:none; cursor:pointer; }
.install-gate-actions .btn.primary { background:#16a34a; color:#fff; }
.install-gate-actions .btn.secondary { background:transparent; color:rgba(255,255,255,0.4); font-size:12px; font-weight:500; padding:8px; }
body.splashing > header, body.splashing > main, body.splashing > .bottom-nav { display:none; }

/* === ROUND HISTORY === */
.history-overlay { position:fixed; top:0; left:0; right:0; bottom:0; z-index:300; background:var(--bg); display:flex; flex-direction:column; overflow:hidden; }
.history-header { padding:12px 16px; padding-top:calc(env(safe-area-inset-top, 0px) + 12px); border-bottom:1px solid var(--border); background:var(--card); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.history-header h2 { margin:0; font-size:18px; }
.history-back { background:none; border:none; color:var(--acc); font-size:15px; cursor:pointer; padding:4px 8px; }
.history-list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px; }
.history-empty { text-align:center; color:var(--muted); padding:60px 20px; font-size:15px; }
.history-round { background:var(--card); border:1px solid var(--border); border-radius:var(--radius, 14px); padding:14px; margin-bottom:10px; cursor:pointer; transition:transform 0.15s; }
.history-round:active { transform:scale(0.98); }
.history-round-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
.history-round-date { font-weight:700; font-size:15px; }
.history-round-course { font-size:13px; color:var(--muted); }
.history-round-games { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.history-round-games .pill { display:inline-block; padding:2px 8px; font-size:11px; border-radius:999px; background:rgba(59,130,246,0.15); color:var(--acc); font-weight:600; text-transform:uppercase; }
.history-round-players { font-size:13px; color:var(--muted); }
.history-round-net { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:13px; }
.history-round-net span { padding:2px 6px; border-radius:6px; }
.history-round-net .winner { background:rgba(22,163,74,0.15); color:var(--success); font-weight:600; }
.history-round-net .loser { color:var(--muted); }
.history-detail { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px; }
.history-detail-section { background:var(--card); border:1px solid var(--border); border-radius:var(--radius, 14px); padding:14px; margin-bottom:10px; }
.history-detail-section h3 { margin:0 0 10px 0; font-size:15px; }
.history-detail-section table { width:100%; border-collapse:collapse; font-size:13px; }

// === GEO HELPERS ===
function haversineMi(lat1,lon1,lat2,lon2){
  const R=3958.8,toRad=n=>n*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
