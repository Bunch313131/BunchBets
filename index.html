 */
const Cloud = {
  api: null, user: null, userDoc: null, golfer: null,
  groups: [], invites: [], pool: [], status: '', busy: false, settling: false,
  syncing: false,
  _loading: null,

  loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector('script[src="' + src + '"]')) return resolve();
      const el = document.createElement('script');
      el.src = src;
      el.onload = resolve;
      el.onerror = () => reject(new Error('could not load ' + src));
      document.head.appendChild(el);
    });
  },

  // The auth and firestore SDKs are a couple of hundred KB that most launches
  // never need, so they load on demand — when the account panel is opened, when
  // a sign-in redirect is coming back, or when a session is already persisted.
  load() {
    if (this._loading) return this._loading;
    const self = this;
    this._loading = (async () => {
      await self.loadScript(CLOUD_SDK + 'firebase-auth-compat.js');
      await self.loadScript(CLOUD_SDK + 'firebase-firestore-compat.js');
      // ?v= is load-bearing, not decoration.
      //
      // js/cloud.js is the only shipped file the release ritual did not cover.
      // index.html is fetched network-first so a new build arrives immediately;
      // this module is a same-origin asset served CACHE-FIRST, refreshed only in
      // the background. A fix to it therefore does nothing for a whole launch,
      // with no symptom — which is exactly how a corrected saveRound sat unused
      // on a phone while it went on writing the bug it had fixed.
      //
      // Pinning the URL to APP_VERSION makes the module miss on every release,
      // at the HTTP layer as well as the service worker's.
      const mod = await import('./js/cloud.js?v=' + APP_VERSION);
      const api = mod.default;
      api.init(FIREBASE_CONFIG);
      api.onUserChanged((user) => {
        self.diag('authState ' + (user ? 'USER ' + user.email : 'null'));
        self.user = user;
        self.settling = false;
        if (user) self.refreshProfile();
        else { self.userDoc = null; self.golfer = null; self.groups = []; self.invites = []; self.render(); }
      });
      self.api = api;
      return api;
    })();
    // Log it. A swallowed loader failure is indistinguishable from "never tried",
    // which is exactly the wrong thing to be guessing about in the field.
    this._loading.catch((e) => { console.log('[cloud] load failed:', e && e.message); self._loading = null; });
    return this._loading;
  },

  // Firebase compat persists the session under firebase:authUser:<apiKey>:<app>.
  // Reading that key is how we decide whether to pay for the SDK on a cold load.
  hasSession() {
    try {
      const prefix = 'firebase:authUser:' + FIREBASE_CONFIG.apiKey + ':bbcloud';
      for (let i = 0; i < localStorage.length; i++) {
        if ((localStorage.key(i) || '').indexOf(prefix) === 0) return true;
      }
    } catch (e) {}
    return false;
  },

  redirectPending() {
    try { if (localStorage.getItem(CLOUD_REDIRECT_KEY) === '1') return true; } catch (e) {}
    // Firebase leaves its own marker before it navigates away. Trust that too:
    // if our flag is lost — different storage context, a clear, anything — the
    // returning credential would otherwise be silently dropped on the floor.
    return this.firebasePending();
  },

  firebasePending() {
    try {
      for (let i = 0; i < sessionStorage.length; i++) {
        if ((sessionStorage.key(i) || '').indexOf('firebase:pendingRedirect') === 0) return true;
      }
    } catch (e) {}
    return false;
  },

  // A home-screen app has no console and no address bar, so it cannot be
  // debugged from the outside. It records what it saw instead, across the
  // redirect, and shows it in the account panel.
  diag(msg) {
    try {
      const log = JSON.parse(localStorage.getItem(CLOUD_DIAG_KEY) || '[]');
      log.push(new Date().toTimeString().slice(0, 8) + '  ' + msg);
      localStorage.setItem(CLOUD_DIAG_KEY, JSON.stringify(log.slice(-10)));
    } catch (e) {}
  },

  diagRead() {
    try { return JSON.parse(localStorage.getItem(CLOUD_DIAG_KEY) || '[]'); } catch (e) { return []; }
  },

  diagClear() {
    try { localStorage.removeItem(CLOUD_DIAG_KEY); } catch (e) {}
    this.render();
  },

  /** Called once at startup. Never throws. */
  async boot() {
    if (!CLOUD_ENABLED) return;
    // Sign-in is popup-only now, so there is no redirect to finish. The only
    // reason to pay for the SDK on a cold start is an existing session; anything
    // else waits until the account panel is opened.
    try { localStorage.removeItem(CLOUD_REDIRECT_KEY); } catch (e) {}
    if (!this.hasSession()) { this.render(); return; }
    this.diag('boot restoring session');
    try {
      await this.load();
      this.diag('sdk loaded');
    } catch (e) {
      console.log('[cloud] boot failed:', e && e.message);
      this.diag('boot threw ' + (e && (e.code || e.message)));
      this.status = 'Cloud unavailable offline';
    }
    this.render();
  },

  /**
   * POPUP, always. signInWithRedirect cannot work from this origin: Safari
   * partitions the auth domain's storage, so the credential never comes back and
   * — worse — nothing errors (doc 17). Popup passes the credential by
   * postMessage between windows and does not touch partitioned storage.
   *
   * window.open is only permitted inside a live user gesture, so this must NOT
   * await anything before calling it. The SDK is warmed up when the panel renders
   * and the button stays disabled until it is ready; by the time it can be
   * tapped, `this.api` is already in hand and the popup opens synchronously.
   */
  signIn() {
    if (this.busy || !this.api) return;
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    this.diag('popup start standalone=' + standalone);
    this.busy = true; this.status = 'Waiting for Google…'; this.render();

    this.api.signInWithGoogle({ redirect: false }).then(() => {
      this.diag('popup ok');
      // Do NOT drop back to the signed-out panel here. The popup resolves before
      // onAuthStateChanged has finished awaiting ensureUserDoc(), so rendering
      // now paints "Sign in with Google" straight over a successful sign-in —
      // which looks exactly like a failure and invites a second attempt.
      this.busy = false;
      this.settling = true;
      this.status = '';
      this.render();
      // If auth never settles, say so rather than sitting on a spinner forever.
      setTimeout(() => {
        if (this.settling && !this.user) {
          this.diag('authState NEVER FIRED after popup');
          this.settling = false;
          this.status = 'Signed in with Google, but the app never got the session back.';
          this.render();
        }
      }, 12000);
    }).catch((e) => {
      const code = (e && e.code) || (e && e.message) || 'unknown';
      this.diag('popup failed ' + code);
      // A blocked popup is the one failure worth explaining rather than just
      // reporting, because the user can do something about it.
      this.status = /popup-blocked|popup_blocked/.test(code)
        ? 'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.'
        : /cancelled|closed-by-user/.test(code)
          ? 'Sign-in cancelled.'
          : 'Sign-in failed: ' + code;
      this.busy = false;
      this.settling = false;
      this.render();
    });
  },

  async signOut() {
    try { if (this.api) await this.api.signOut(); } catch (e) {}
    this.user = null; this.userDoc = null; this.golfer = null;
    this.groups = []; this.invites = []; this.status = '';
    this.render();
  },

  /**
   * Each await is breadcrumbed separately. A single "profile failed" tells you
   * nothing about WHICH of five round trips died, and this chain is invisible
   * from a phone.
   */
  async refreshProfile() {
    if (!this.api || !this.user) { this.diag('profile skipped api=' + !!this.api + ' user=' + !!this.user); return; }
    let step = 'start';
    try {
      step = 'ensureUserDoc';   await this.api.ensureUserDoc();
      step = 'myUserDoc';       this.userDoc = await this.api.myUserDoc();
      step = 'myGolfer';        this.golfer = await this.api.myGolfer();
      step = 'myGroups';        this.groups = await this.api.myGroups();
      step = 'pendingInvites';  this.invites = await this.api.pendingInvites();
      step = 'groupPool';       this.pool = this.groups.length
                                  ? await this.api.groupPool(this.groups[0].id) : [];
      this.status = '';
      this.diag('profile ok invites=' + this.invites.length + ' groups=' + this.groups.length);
    } catch (e) {
      this.diag('profile FAILED at ' + step + ': ' + (e.code || e.message));
      this.status = 'Could not load your profile (' + step + '): ' + (e.code || e.message);
    }
    this.render();
  },

  /**
   * Accepting joins the group AND claims the seeded golfer record the invitation
   * names. The rules only permit the claim because the invitation names that
   * exact golfer and is addressed to an email this account has verified — at the
   * rules layer "claim mine" and "seize yours" are otherwise identical writes
   * (doc 11).
   */
  async acceptInvite(id) {
    if (this.busy) return;
    this.busy = true; this.status = 'Joining…'; this.render();
    try {
      const res = await this.api.acceptInvite(id);
      await this.refreshProfile();
      Err.toast('Joined ' + ((this.groups[0] && this.groups[0].name) || res.groupId));
    } catch (e) {
      this.status = 'Could not join: ' + (e.code || e.message);
    }
    this.busy = false; this.render();
  },

  renderDiag(el, esc) {
    const lines = this.diagRead();
    if (!lines.length) return;
    const box = document.createElement('div');
    box.className = 'cloud-note';
    box.innerHTML = '<b>Sign-in diagnostics</b><br>' +
      '<span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.6;">' +
      lines.map(esc).join('<br>') + '</span>' +
      '<br><button id="cloudDiagClear" style="margin-top:6px;background:none;border:1px solid var(--border);' +
      'border-radius:6px;color:var(--muted);font-size:11px;padding:4px 8px;cursor:pointer;">Clear</button>';
    el.appendChild(box);
    const c = box.querySelector('#cloudDiagClear');
    if (c) c.onclick = () => Cloud.diagClear();
  },

  /**
   * Called when the menu opens. The tap that follows has to open a window
   * synchronously — it cannot do that if it must first wait for half a megabyte
   * of Firebase — so the SDK is fetched now and the button stays disabled until
   * it lands. Deliberately NOT in render(): boot() renders too, and a signed-out
   * launch should still cost nothing.
   */
  warm() {
    if (!CLOUD_ENABLED || this.api || this._loading) return;
    this.load().then(() => this.render()).catch(() => this.render());
  },

  // ------------------------------------------------------------------ rounds

  /**
   * Local player -> golfer id.
   *
   * EXACT match on a normalised name, or nothing. The pool is 17 real people
   * with names from GHIN; the local card has whatever was typed on the first
   * tee. A near-match here would quietly file someone's round under another
   * man's record and show up months later as a wrong season total, so anyone
   * who is not an unambiguous hit stays a guest.
   */
  golferIdFor(name) {
    const want = Cloud.norm(name);
    if (!want) return null;
    // A confirmed alias is as good as the real name — better, in fact, since it
    // is what this group actually writes on the card.
    const hits = this.pool.filter((g) =>
      Cloud.norm(g.name) === want || (g.aliases || []).some((a) => Cloud.norm(a) === want));
    return hits.length === 1 ? hits[0].id : null;   // ambiguous counts as no match
  },

  norm(t) {
    return String(t || '').toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
  },

  /** Every name in local history that still resolves to nobody. */
  unlinkedNames() {
    const seen = {};
    let rounds = [];
    try { rounds = History.load(); } catch (e) {}
    rounds.forEach((r) => (r.players || []).forEach((p) => {
      const nm = String(p.name || '').trim();
      if (!nm || this.golferIdFor(nm)) return;
      const key = Cloud.norm(nm);
      if (!(key in seen)) seen[key] = nm;   // keep the FIRST spelling seen
    }));
    return Object.keys(seen).map((k) => seen[k]).sort();
  },

  /**
   * Ranked candidates for an unlinked name. Surname first, because that is what
   * this group actually writes ("Bunch", "Casey", "Bridges"); then first name
   * ("Gary"); then a prefix, which is where Ken/Kenneth and Tim/Timothy live.
   * Prefixes are last precisely because they are the weakest signal.
   */
  suggestFor(name) {
    const want = Cloud.norm(name);
    if (!want) return [];
    const scored = this.pool.map((g) => {
      const toks = Cloud.norm(g.name).split(' ');
      const last = toks[toks.length - 1], first = toks[0];
      let score = 0;
      if (Cloud.norm(g.name) === want) score = 100;
      else if ((g.aliases || []).some((a) => Cloud.norm(a) === want)) score = 95;
      else if (last === want) score = 80;
      else if (first === want) score = 70;
      else if (want.length >= 3 && (first.indexOf(want) === 0 || last.indexOf(want) === 0)) score = 50;
      else if (want.length >= 3 && (want.indexOf(first) === 0 || want.indexOf(last) === 0)) score = 40;
      return { g, score };
    }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
    return scored.map((x) => x.g);
  },

  /**
   * Write the confirmed aliases, then re-upload every round they affect so the
   * stored rounds stop pointing at guests. Re-saving overwrites in place because
   * the doc id is the local round id.
   */
  async linkNames(pairs) {
    if (!this.api || !this.user) return;
    this.syncing = true; this.status = 'Linking…'; this.render();
    let linked = 0, failed = 0;
    for (const { name, golferId } of pairs) {
      if (!golferId) continue;
      try {
        await this.api.addAlias(golferId, name);
        const g = this.pool.filter((x) => x.id === golferId)[0];
        if (g) g.aliases = (g.aliases || []).concat([name]);
        linked++;
      } catch (e) {
        this.diag('alias failed ' + golferId + ' ' + (e.code || e.message));
        failed++;
      }
    }
    // Re-send every already-uploaded round that mentions a name we just linked,
    // because those docs still say guest:.
    //
    // Do NOT decide this by rebuilding the round and looking for a remaining
    // "guest:" — by this point the aliases are already in the pool, so the rounds
    // that need re-sending are exactly the ones that no longer look broken. That
    // test skips every round it was written to fix.
    const touched = {};
    pairs.forEach((x) => { if (x.golferId) touched[Cloud.norm(x.name)] = 1; });
    let resent = 0;
    try {
      for (const r of History.load()) {
        if (!r.cloudId) continue;
        const hit = (r.players || []).some((pl) => touched[Cloud.norm(pl.name)]);
        if (!hit) continue;
        if (await this.saveRound(r)) resent++;
      }
    } catch (e) {}
    this.syncing = false;
    this.status = linked + ' name(s) linked' + (resent ? ', ' + resent + ' round(s) updated' : '')
                + (failed ? ', ' + failed + ' failed' : '') + '.';
    await this.refreshProfile();
  },

  /** Local history snapshot -> the rounds schema in doc 08. */
  buildRound(r) {
    const players = (r.players || []).filter((p) => String(p.name || '').trim());
    const slug = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    const idOf = {}, golferIds = [], unmatched = [];
    players.forEach((p) => {
      const gid = this.golferIdFor(p.name);
      idOf[p.id] = gid || ('guest:' + (slug(p.name) || p.id));
      if (!gid) unmatched.push(p.name);
      golferIds.push(idOf[p.id]);
    });

    // Scores are duplicated across games and synced on entry, but a player need
    // not be in every game — read the union rather than trusting games[0].
    const grossTotal = (pid) => {
      let tot = 0, played = 0;
      for (let h = 0; h < 18; h++) {
        for (const g of (r.games || [])) {
          const arr = g.gross && g.gross[pid];
          if (arr && arr[h] != null) { tot += arr[h]; played++; break; }
        }
      }
      return { tot, played };
    };

    const results = {};
    players.forEach((p) => {
      const g = grossTotal(p.id);
      results[idOf[p.id]] = {
        name: p.name,                       // keep it readable without the pool
        money: (r.playerNet && r.playerNet[p.id]) || 0,
        gross: g.played === 18 ? g.tot : null,   // partial rounds must not skew a scoring average
        holes: g.played,
        handicap: p.handicap || 0,
      };
    });

    return {
      id: r.id,
      groupId: this.groups.length ? this.groups[0].id : null,
      date: r.date,
      courseName: (r.course && r.course.name) || 'Course',
      courseSnapshot: r.course || null,
      startingHole: r.startingHole || 0,
      golferIds,
      unmatchedNames: unmatched,            // visible, not silently dropped
      games: r.games || [],
      results,
      appVersion: APP_VERSION,
    };
  },

  /**
   * Fire and forget. The local save has already happened; this can fail in any
   * way it likes without the round being at risk. Success is recorded back onto
   * the local record so backfill knows what is already up.
   */
  saveRound(snapshot) {
    if (!CLOUD_ENABLED || !this.api || !this.user || !snapshot) return Promise.resolve(false);
    const self = this;
    return this.api.saveRound(this.buildRound(snapshot)).then((id) => {
      self.diag('round saved ' + id);
      self.markSynced(snapshot.id, id);
      return true;
    }).catch((e) => {
      self.diag('round save failed ' + (e.code || e.message));
      return false;
    });
  },

  /** Stamp the local history record so we never upload the same round twice. */
  markSynced(localId, cloudId) {
    try {
      const rounds = History.load();
      const row = rounds.filter((x) => x.id === localId)[0];
      if (!row) return;
      row.cloudId = cloudId;
      row.cloudSyncedAt = new Date().toISOString();
      History.save(rounds);
    } catch (e) {}
  },

  unsyncedRounds() {
    try { return History.load().filter((r) => !r.cloudId); } catch (e) { return []; }
  },

  /** Upload everything already sitting in local history. Sequential on purpose. */
  async backfill() {
    if (this.syncing || !this.api || !this.user) return;
    const pending = this.unsyncedRounds();
    if (!pending.length) { this.status = 'Everything is already backed up.'; this.render(); return; }
    this.syncing = true; this.status = 'Backing up ' + pending.length + ' round(s)…'; this.render();
    let ok = 0, failed = 0;
    for (const r of pending) {
      // One at a time: a burst of writes from a phone on course wifi is how you
      // find out about rate limits at the worst possible moment.
      const done = await this.saveRound(r);
      if (done) ok++; else failed++;
      this.status = 'Backing up… ' + (ok + failed) + ' of ' + pending.length;
      this.render();
    }
    this.syncing = false;
    this.status = failed ? (ok + ' backed up, ' + failed + ' failed — try again later')
                         : (ok + ' round(s) backed up.');
    this.render();
  },

  render() {
    // The account panel is no longer the only place cloud state is visible.
    try { Wizard.syncCloud(); } catch (e) {}
    const el = document.getElementById('menuAccount');
    if (!el) return;
    if (!CLOUD_ENABLED) { el.style.display = 'none'; return; }
    el.style.display = '';
    const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const note = this.status ? '<div class="cloud-note">' + esc(this.status) + '</div>' : '';

    if (!this.user) {
      const ready = !!this.api;
      const label = this.busy ? 'Waiting for Google\u2026'
        : this.settling ? 'Signing you in\u2026'
        : ready ? 'Sign in with Google' : 'Preparing sign-in\u2026';
      el.innerHTML =
        '<div class="menu-section-title">Account</div>' +
        '<button class="menu-item primary" id="cloudSignIn"' + (ready && !this.busy && !this.settling ? '' : ' disabled') + '>' +
        label + '</button>' +
        '<div class="cloud-note">Optional. Signing in saves your rounds and unlocks group stats \u2014 scoring works exactly the same without it.</div>' +
        note;
      const b = document.getElementById('cloudSignIn');
      if (b) b.onclick = () => Cloud.signIn();
      this.renderDiag(el, esc);
      return;
    }

    const name = (this.userDoc && this.userDoc.displayName) || this.user.displayName || this.user.email || 'Signed in';
    const linked = this.golfer
      ? esc(this.golfer.name) + (this.golfer.currentIndex ? ' \u00b7 ' + esc(this.golfer.currentIndex) : '')
      : 'No golfer linked yet';
    const groupLine = this.groups.length
      ? this.groups.map((g) => esc(g.name)).join(', ')
      : 'No group yet';

    const invites = this.invites.map((inv) =>
      '<div class="cloud-invite">You have been invited to join <b>' + esc(inv.groupId) + '</b>.' +
      '<br><span style="color:var(--muted);">Joining also links your scores to the record already on file.</span>' +
      '<button data-invite="' + esc(inv.id) + '"' + (this.busy ? ' disabled' : '') + '>Join</button></div>').join('');

    // Names on the card are not names in the pool. Until they are linked, every
    // round is filed against guests and the standings have nothing to add up.
    const stray = this.pool.length ? this.unlinkedNames() : [];
    const unlinked = stray.length
      ? '<div class="cloud-note"><b>' + stray.length + ' name(s) on your cards aren\u2019t linked to anyone:</b><br>' +
        esc(stray.slice(0, 6).join(', ')) + (stray.length > 6 ? '\u2026' : '') +
        '<br><button class="cloud-backup" id="cloudLink">Link them</button></div>'
      : '';

    const pending = this.unsyncedRounds().length;
    const total = (() => { try { return History.load().length; } catch (e) { return 0; } })();
    const backup = total === 0 ? ''
      : pending === 0
        ? '<div class="cloud-note">All ' + total + ' saved round(s) are backed up.</div>'
        : '<div class="cloud-note">' + pending + ' of ' + total + ' round(s) not backed up yet.' +
          '<br><button class="cloud-backup" id="cloudBackup"' + (this.syncing ? ' disabled' : '') + '>' +
          (this.syncing ? 'Backing up\u2026' : 'Back up now') + '</button></div>';

    el.innerHTML =
      '<div class="menu-section-title">Account</div>' +
      '<div class="cloud-id"><b>' + esc(name) + '</b>' +
      '<div class="sub">' + esc(this.user.email || '') + '</div>' +
      '<div class="sub" style="margin-top:6px;">' + linked + '</div>' +
      '<div class="sub">' + groupLine + '</div></div>' +
      invites + backup + unlinked + note +
      '<button class="menu-item" id="cloudSignOut">Sign out</button>';

    const bk = document.getElementById('cloudBackup');
    if (bk) bk.onclick = () => Cloud.backfill();
    const ln = document.getElementById('cloudLink');
    if (ln) ln.onclick = () => { UI.closeMenu(); UI.showLinkNames(); };

    this.renderDiag(el, esc);
    const out = document.getElementById('cloudSignOut');
    if (out) out.onclick = () => Cloud.signOut();
    el.querySelectorAll('[data-invite]').forEach((btn) => {
      btn.onclick = () => Cloud.acceptInvite(btn.getAttribute('data-invite'));
    });
  },
};

// === LIVE SYNC MODULE ===
window.LiveSync = {
  db: null,
  gameRef: null,
  shareCode: null,
  isHost: false,
  isViewer: false,
  unsubscribe: null,

  init() {
    if (FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") {
      console.log('Firebase not configured - live sharing disabled');
      return false;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      this.db = firebase.database();
      return true;
    } catch (e) {
      console.error('Firebase init failed:', e);
      return false;
    }
  },

  generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  },

  async hostGame() {
    if (!this.init()) {
      Err.show('Firebase not configured. See instructions in index.html to enable live sharing.');
      return null;
    }

    this.shareCode = this.generateCode();
    this.isHost = true;
    this.isViewer = false;
    gtag('event', 'live_sync', { action: 'host' });
    this.gameRef = this.db.ref(LIVE_PATH + '/' + this.shareCode);

    try {
      await this.gameRef.set({
        data: State.data,
        presets: State.presets,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });

      this.showBanner(`Hosting: ${this.shareCode}`, false);
      Err.toast('Game hosted! Share code: ' + this.shareCode);
      return this.shareCode;
    } catch (e) {
      Err.show('Failed to host game: ' + e.message);
      this.isHost = false;
      return null;
    }
  },

  async joinGame(code) {
    if (!this.init()) {
      Err.show('Firebase not configured. See instructions in index.html to enable live sharing.');
      return false;
    }

    code = code.toUpperCase().trim();
    if (!/^[A-Z0-9]{6}$/.test(code)) {
      Err.show('Invalid code. Should be 6 characters.');
      return false;
    }

    this.gameRef = this.db.ref(LIVE_PATH + '/' + code);

    try {
      const snapshot = await this.gameRef.once('value');
      if (!snapshot.exists()) {
        Err.show('Game not found. Check the code and try again.');
        return false;
      }

      this.shareCode = code;
      this.isViewer = true;
      this.isHost = false;

      // Subscribe to updates
      this.unsubscribe = this.gameRef.on('value', (snap) => {
        const val = snap.val();
        if (val && val.data) {
          State.data = val.data;
          State.presets = val.presets || [];
          // Sanitize games to ensure all player entries exist
          if (State.data.games && Array.isArray(State.data.games)) {
            State.data.games = State.data.games.map(g => Game.sanitize(g));
          }
          State.scheduleRender();
        }
      });

      this.showBanner(`Viewing: ${code} (read-only)`, true);
      this.disableEditing();
      State.data.tab = 'scores';
      State.scheduleRender();
      Err.toast('Connected to game ' + code);
      return true;
    } catch (e) {
      Err.show('Failed to join game: ' + e.message);
      return false;
    }
  },

  syncToFirebase() {
    if (!this.isHost || !this.gameRef) return;

    this.gameRef.update({
      data: State.data,
      presets: State.presets,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    }).catch(e => console.error('Sync failed:', e));
  },

  stopSharing() {
    if (this.unsubscribe && this.gameRef) {
      this.gameRef.off('value', this.unsubscribe);
    }
    this.shareCode = null;
    this.isHost = false;
    this.isViewer = false;
    this.gameRef = null;
    this.hideBanner();
    this.enableEditing();
    Err.toast('Disconnected from live game');
  },

  showBanner(text, isViewer) {
    const banner = document.getElementById('liveBanner');
    banner.innerHTML = `<span class="sync-indicator"></span>${text} <button class="btn small" style="margin-left:12px;padding:4px 8px;" onclick="LiveSync.stopSharing()">Disconnect</button>`;
    banner.className = 'live-banner' + (isViewer ? ' viewer' : '');
    banner.style.display = 'block';
  },

  hideBanner() {
    document.getElementById('liveBanner').style.display = 'none';
  },

  disableEditing() {
    document.body.classList.add('viewer-mode');
    // Hide edit buttons
    ['resetBtn', 'clearBtn', 'factoryBtn', 'hostBtn'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  },

  enableEditing() {
    document.body.classList.remove('viewer-mode');
    ['resetBtn', 'clearBtn', 'factoryBtn', 'hostBtn'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = '';
    });
  },

  showHostModal() {
    if (this.isHost) {
      // Already hosting - show current code
      this.showShareModal(this.shareCode);
      return;
    }

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>Host Live Game</h2>
        <p class="muted">Share your game in real-time. Others can view scores as you enter them.</p>
        <div class="modal-actions">
          <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn primary" id="startHostBtn">Start Hosting</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById('startHostBtn').onclick = async () => {
      const code = await this.hostGame();
      overlay.remove();
      if (code) this.showShareModal(code);
    };

    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  },

  showShareModal(code) {
    const url = window.location.origin + window.location.pathname + '?join=' + code;
    const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>Share This Code</h2>
        <p class="muted" style="margin-bottom:16px;">Others can join with this code to view live scores:</p>
        <div style="text-align:center;margin:20px 0;">
          <div class="share-code">${code}</div>
        </div>
        <div style="text-align:center;margin:16px 0;">
          <img src="${qrImgUrl}" alt="QR Code" style="width:180px;height:180px;border-radius:12px;background:#fff;padding:8px;">
          <p class="muted" style="font-size:11px;margin-top:8px;">Scan to join instantly</p>
        </div>
        <p class="muted" style="font-size:12px;">Or share this link:</p>
        <input type="text" value="${url}" readonly style="font-size:12px;margin-bottom:8px;" onclick="this.select()">
        <div class="modal-actions">
          <button class="btn" onclick="this.closest('.modal-overlay').remove()">Close</button>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('${code}');Err.toast('Code copied!');">Copy Code</button>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('${url}');Err.toast('Link copied!');">Copy Link</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  },

  showJoinModal() {
    if (this.isViewer) {
      Err.toast('Already viewing a game. Disconnect first.');
      return;
    }

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>Join Live Game</h2>
        <p class="muted">Enter the 6-character code to view a live game:</p>
        <input type="text" id="joinCodeInput" class="join-input" maxlength="6" placeholder="ABC123" style="margin:16px 0;">
        <div class="modal-actions">
          <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn primary" id="joinGameBtn">Join</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const input = document.getElementById('joinCodeInput');
    input.focus();
    input.oninput = () => { input.value = input.value.toUpperCase(); };
    input.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('joinGameBtn').click(); };

    document.getElementById('joinGameBtn').onclick = async () => {
      const code = input.value;
      const success = await this.joinGame(code);
      if (success) overlay.remove();
    };

    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  }
};

// === UTILITIES ===
const Utils = {
  fmt: n => isFinite(n) ? (n<0?'-':'') + '$' + Math.abs(n).toFixed(2) : '$0.00',
  make18: fill => Array(HOLES).fill(fill),
  uid: () => Math.random().toString(36).slice(2) + Date.now().toString(36),
  sanitize: v => String(v).replace(/[^0-9]/g, ''),
  sumRange(arr, start, end) {
    let total = 0, has = false;
    for (let i = start; i <= end && i < arr.length; i++) {
      const v = arr[i];
      if (v != null && isFinite(+v)) { total += +v; has = true; }
    }
    return has ? total : null;
  },
  clone: obj => JSON.parse(JSON.stringify(obj))
};

};

});

// === STATE MANAGER ===
/**
 * The course the app ships with, kept apart from live state so a saved round can
 * be migrated against it. `State.data.course` starts as a deep copy: the round
 * in play owns its own par and allocation, and editing them must never reach
 * back into this.
 */
const BB_DEFAULT_COURSE = {
      name: 'El Macero',
      // Verified against GHIN course 7796 on 2026-09-14: this par array and this
      // stroke allocation are what the course is actually rated to, and every
      // men's tee at El Macero shares both.
      //
      // This used to be a fork on `new Date() >= '2026-03-01'`, carrying a second
      // allocation for "before March". GHIN has no record of the older one, every
      // net bet at this course depended on which branch ran, and it had already
      // produced one wrong hand-computed total. A date fork is also untestable in
      // the only way that matters — it changes behaviour with no code change.
      hcp: [15,13,9,1,7,3,17,11,5,8,2,16,6,10,12,18,4,14],
      par: [4,5,3,4,5,4,3,4,4,4,4,3,4,4,5,3,4,5],
      // Rating and slope per tee, pulled from GHIN. An index is portable; a
      // course handicap is not, and the tee is what converts one to the other.
      // El Macero White is 72.0/129 — NOT the 73.0/127 recorded in August, since
      // the course was re-rated in between.
      teeName: 'White',
      tees: [
        { name: 'Aggie',            yardage: 7138, rating: 74.3, slope: 138, par: 72 },
        { name: 'Blue',             yardage: 6855, rating: 73.1, slope: 137, par: 72 },
        { name: 'Blue/White Combo', yardage: 6671, rating: 72.6, slope: 131, par: 72 },
        { name: 'White',            yardage: 6499, rating: 72.0, slope: 129, par: 72 },
        { name: 'White/Red Combo',  yardage: 6081, rating: 70.0, slope: 125, par: 72 },
        { name: 'Red',              yardage: 5849, rating: 69.2, slope: 124, par: 72 },
        { name: 'Red/Gold Combo',   yardage: 5515, rating: 67.5, slope: 120, par: 72 },
        { name: 'Gold',             yardage: 5285, rating: 66.6, slope: 117, par: 72 }
      ]
};

const State = {
  data: {
    tab: 'setup',
    players: [{id:'p1',name:'P1'},{id:'p2',name:'P2'},{id:'p3',name:'P3'},{id:'p4',name:'P4'},{id:'p5',name:'P5'}],
    games: [],
    course: JSON.parse(JSON.stringify(BB_DEFAULT_COURSE)),
    settings: { thTop: 12, thMin: 5 },
    debugStatus: false,
    lastActiveDate: null,
    roundCompleteShown: false,
    pressWizardShown: false,
    scoringHole: 0,
    scoringView: 'hole',
    startingHole: 0
  },
  // The same date fork used to sit here too, and with it an "El Macero New"
  // preset that existed only so the older allocation could be worked around.
  // GHIN knows one allocation for this course and it is this one.
  presets: {
    'El Macero': { hcp:[15,13,9,1,7,3,17,11,5,8,2,16,6,10,12,18,4,14], par:[4,5,3,4,5,4,3,4,4,4,4,3,4,4,5,3,4,5] },
    'Del Paso': { hcp:[11,17,1,7,15,9,3,5,13,12,10,18,8,16,6,2,14,4], par:[5,3,4,5,3,4,4,4,4,4,4,3,5,3,5,4,3,4] }
  },
  /** The allocation the app used to carry for El Macero before 2026-03-01.
   *  GHIN has no record of it, and every net bet at the course depended on
   *  which side of that date you were on. Kept only so saved copies of it can
   *  be recognised and corrected. */
  BAD_EL_MACERO_HCP: [7,15,9,1,11,3,17,13,5,4,2,10,8,12,14,18,6,16],

  /**
   * A saved course, brought forward.
   *
   * Saved state REPLACES the default wholesale, so a course saved before tees
   * existed would have no tees forever — the course-handicap conversion would
   * silently do nothing for every install that already has the app, which is
   * all of them. This attaches the tee list the app ships for that course and
   * changes nothing else: par and the allocation in play are left exactly as
   * saved, because those belong to the round being played.
   */
  migrateCourse(saved) {
    const c = saved || {};
    if (!c.tees && c.name === BB_DEFAULT_COURSE.name) {
      c.tees = JSON.parse(JSON.stringify(BB_DEFAULT_COURSE.tees));
      if (!c.teeName) c.teeName = BB_DEFAULT_COURSE.teeName;
    }
    return c;
  },

  /**
   * Saved presets, brought forward.
   *
   * Presets are the user's own list, so this does not overwrite them — with one
   * exception. A saved El Macero carrying the pre-March allocation is not a
   * preference, it is the date-fork defect written to disk, and re-picking that
   * course would hand out strokes on the wrong holes all over again. Only an
   * exact match is corrected; an allocation someone edited themselves is theirs.
   */
  migratePresets(saved) {
    const out = saved || {};
    const bad = this.BAD_EL_MACERO_HCP.join(',');
    Object.keys(out).forEach((name) => {
      const pre = out[name];
      if (pre && Array.isArray(pre.hcp) && pre.hcp.join(',') === bad) {
        pre.hcp = BB_DEFAULT_COURSE.hcp.slice();
      }
    });
    // "El Macero New" existed only as a hand-made workaround for the bad
    // allocation. If it is now identical to El Macero, it is clutter.
    if (out['El Macero New'] && out['El Macero'] &&
        out['El Macero New'].hcp.join(',') === out['El Macero'].hcp.join(',')) {
      delete out['El Macero New'];
    }
    return out;
  },

  locks: 0,
  saveTimer: null,
  renderTimer: null,

  begin() { this.locks++; },
  end() {
    this.locks = Math.max(0, this.locks - 1);
    if (!this.locks) {
      this.scheduleSave();
      this.scheduleRender();
    }
  },

  isRoundComplete() {
    // Check if all players across all games have scores for all 18 holes
    if (this.data.games.length === 0) return false;
    for (const g of this.data.games) {
      const pids = g.gameType === 'skins' ? (g.skinsPlayers||[])
        : g.gameType === 'wolf' ? (g.wolfPlayers||[])
        : g.gameType === 'ninepoint' ? (g.ninePointPlayers||[])
        : [...(g.teamA||[]), ...(g.teamB||[])];
      for (const pid of pids) {
        const scores = g.gross[pid];
        if (!scores) return false;
        for (let i = 0; i < 18; i++) {
          if (scores[i] === null || scores[i] === undefined) return false;
        }
      }
    }
    return true;
  },
  
  scheduleSave() {
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => {
      try {
        // Update lastActiveDate to today
        this.data.lastActiveDate = new Date().toDateString();
        const saveData = {...this.data, presets: this.presets};
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
        // Sync to Firebase if hosting
        if (LiveSync.isHost) LiveSync.syncToFirebase();
      } catch(e) {
        Err.show('Save failed: ' + e.message);
      }
    }, 200);
  },

  scheduleRender() {
    if (this.locks > 0) return;
    clearTimeout(this.renderTimer);
    this.renderTimer = setTimeout(() => {
      try { UI.render(); }
      catch(e) { Err.show('Render failed: ' + e.message); }
    }, 120);
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const obj = JSON.parse(raw);
      if (obj.players && Array.isArray(obj.players)) this.data.players = obj.players;
      if (obj.games && Array.isArray(obj.games)) this.data.games = obj.games.map(Game.sanitize);
      if (obj.course) this.data.course = this.migrateCourse(obj.course);
      if (obj.presets) this.presets = this.migratePresets(obj.presets);
      if (obj.settings) this.data.settings = obj.settings;
      if (obj.lastActiveDate) this.data.lastActiveDate = obj.lastActiveDate;
      this.data.roundCompleteShown = !!obj.roundCompleteShown;
      this.data.pressWizardShown = !!obj.pressWizardShown;
      // Validate tab value - only allow known tabs
      const validTabs = ['setup','scores','match','settle','rules'];
      this.data.tab = validTabs.includes(obj.tab) ? obj.tab : 'scores';
      this.data.debugStatus = !!obj.debugStatus;
      this.data.scoringHole = obj.scoringHole || 0;
      this.data.scoringView = 'hole'; // Always start on hole view
      this.data.startingHole = parseInt(obj.startingHole) || 0;
      this.data._clearedHoles = obj._clearedHoles || {};
      // Migration: if _scoredHoles not saved yet, infer from existing scores
      if (obj._scoredHoles) {
        this.data._scoredHoles = obj._scoredHoles;
      } else {
        this.data._scoredHoles = {};
        const games = this.data.games || [];
        const players = this.data.players || [];
        for (let h = 0; h < 18; h++) {
          const hasScore = players.some(p => games.some(gm => gm.gross[p.id] && gm.gross[p.id][h] != null));
          if (hasScore) this.data._scoredHoles[h] = true;
        }
      }
      return true;
    } catch(e) { 
      Err.show('Load failed: ' + e.message);
      return false; 
    }
  }
};

// === ROUND HISTORY ===
const HISTORY_KEY = 'bunchbets_history';
const HISTORY_MAX = 50;

const History = {
  load() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  },

  save(rounds) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(rounds.slice(0, HISTORY_MAX)));
    } catch(e) { Err.show('History save failed: ' + e.message); }
  },

  // Snapshot current round before clearing
  archiveCurrent() {
    if (!State.data.games.length) return;
    // Must have at least some scores entered
    const hasScores = State.data.games.some(g =>
      State.data.players.some(p => {
        const s = g.gross[p.id];
        return s && s.some(v => v !== null);
      })
    );
    if (!hasScores) return;

    // Prevent duplicate saves for the same round
    const rounds = this.load();
    const fingerprint = State.data.players.map(p => p.name).sort().join(',') + '|' +
      State.data.course.name + '|' + State.data.lastActiveDate;
    if (rounds.length && rounds[0]._fp === fingerprint) {
      // Update the existing entry with latest data instead of duplicating
      rounds.shift();
    }

    const net = {};
    State.data.players.forEach(p => net[p.id] = 0);
    State.data.games.forEach(g => {
      const gameNet = Game.computeGamePlayerNet(g);
      Object.keys(gameNet).forEach(pid => { net[pid] = (net[pid]||0) + gameNet[pid]; });
    });

    const snapshot = {
      id: Utils.uid(),
      _fp: fingerprint,
      date: new Date().toISOString(),
      course: Utils.clone(State.data.course),
      players: Utils.clone(State.data.players),
      games: Utils.clone(State.data.games),
      playerNet: Utils.clone(net),
      startingHole: State.data.startingHole || 0
    };

    rounds.unshift(snapshot);
    this.save(rounds);

    // The local save above is the one that matters and has already happened.
    // This is deliberately not awaited and deliberately cannot throw: a round
    // must never be at risk because the network is not there.
    try { Cloud.saveRound(snapshot); } catch (e) {}
  },

  deleteRound(id) {
    const rounds = this.load().filter(r => r.id !== id);
    this.save(rounds);
  },

  formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
    } catch(e) { return iso; }
  },

  gameLabel(type) {
    const labels = {nassau:'Nassau', vegas:'Vegas', skins:'Skins', wolf:'Wolf', ninepoint:'9-Point'};
    return labels[type] || type;
  },

  show() {
    const rounds = this.load();
    const overlay = document.createElement('div');
    overlay.className = 'history-overlay';
    overlay.innerHTML = `
      <div class="history-header">
        <button class="history-back" id="historyBack">&larr; Back</button>
        <h2>Round History</h2>
        <div style="width:60px;"></div>
      </div>
      <div class="history-list" id="historyList"></div>
    `;
    document.body.appendChild(overlay);

    const list = overlay.querySelector('#historyList');
    if (!rounds.length) {
      list.innerHTML = '<div class="history-empty">No saved rounds yet.<br><br>Rounds are automatically saved when you start a new game.</div>';
    } else {
      list.innerHTML = rounds.map(r => {
        const gameTypes = [...new Set(r.games.map(g => g.gameType))];
        const playerNames = r.players.map(p => p.name).join(', ');
        const netEntries = Object.entries(r.playerNet || {})
          .map(([pid, val]) => ({name: (r.players.find(p => p.id === pid)||{}).name || pid, val}))
          .sort((a,b) => b.val - a.val);
        const netHtml = netEntries.map(e =>
          `<span class="${e.val > 0.005 ? 'winner' : e.val < -0.005 ? 'loser' : ''}">${e.name}: ${e.val > 0 ? '+' : ''}${Utils.fmt(e.val)}</span>`
        ).join('');

        return `<div class="history-round" data-id="${r.id}">
          <div class="history-round-top">
            <div>
              <div class="history-round-date">${this.formatDate(r.date)}</div>
              <div class="history-round-course">${r.course.name || 'Custom Course'}</div>
            </div>
          </div>
          <div class="history-round-games">${gameTypes.map(t => `<span class="pill">${this.gameLabel(t)}</span>`).join('')}</div>
          <div class="history-round-players">${playerNames}</div>
          <div class="history-round-net">${netHtml}</div>
        </div>`;
      }).join('');
    }

    // Event listeners
    overlay.querySelector('#historyBack').onclick = () => overlay.remove();
    list.querySelectorAll('.history-round').forEach(el => {
      el.onclick = () => this.showDetail(el.dataset.id, overlay);
    });
  },

  showDetail(id, parentOverlay) {
    const rounds = this.load();
    const r = rounds.find(x => x.id === id);
    if (!r) return;

    const detailEl = parentOverlay.querySelector('#historyList');
    const headerH2 = parentOverlay.querySelector('.history-header h2');
    headerH2.textContent = this.formatDate(r.date);

    // Build scores table
    const players = r.players || [];
    let scoresHtml = '';
    if (r.games.length && players.length) {
      const g = r.games[0]; // Primary game for scores
      const sh = r.startingHole || 0;
      const ch = pos => (pos + sh) % 18; // local courseHole for this snapshot
      const pids = players.map(p => p.id);
      // Build mapped par array for display (position-ordered)
      const mappedPar = [];
      for (let i = 0; i < 18; i++) mappedPar.push(r.course.par[ch(i)] || 4);
      let headerRow = '<th>Hole</th><th>Par</th>' + players.map(p => `<th>${p.name}</th>`).join('');
      let rows = '';
      for (let h = 0; h < 18; h++) {
        rows += `<tr><td style="font-weight:600;">${ch(h)+1}</td><td>${mappedPar[h]||''}</td>`;
        players.forEach(p => {
          const s = g.gross[p.id];
          const val = s ? s[h] : null;
          rows += `<td>${val !== null && val !== undefined ? val : '-'}</td>`;
        });
        rows += '</tr>';
        if (h === 8) {
          // Front 9 totals
          rows += '<tr style="font-weight:700;border-top:2px solid var(--border);"><td>OUT</td><td>' + Utils.sumRange(mappedPar,0,8) + '</td>';
          players.forEach(p => {
            const s = g.gross[p.id];
            const tot = s ? Utils.sumRange(s,0,8) : null;
            rows += `<td>${tot !== null ? tot : '-'}</td>`;
          });
          rows += '</tr>';
        }
      }
      // Back 9 + total
      rows += '<tr style="font-weight:700;border-top:2px solid var(--border);"><td>IN</td><td>' + Utils.sumRange(mappedPar,9,17) + '</td>';
      players.forEach(p => {
        const s = r.games[0].gross[p.id];
        const tot = s ? Utils.sumRange(s,9,17) : null;
        rows += `<td>${tot !== null ? tot : '-'}</td>`;
      });
      rows += '</tr>';
      rows += '<tr style="font-weight:700;"><td>TOT</td><td>' + Utils.sumRange(mappedPar,0,17) + '</td>';
      players.forEach(p => {
        const s = r.games[0].gross[p.id];
        const f = s ? Utils.sumRange(s,0,8) : null;
        const b = s ? Utils.sumRange(s,9,17) : null;
        const tot = (f !== null || b !== null) ? ((f||0)+(b||0)) : null;
        rows += `<td>${tot !== null ? tot : '-'}</td>`;
      });
      rows += '</tr>';

      scoresHtml = `<div class="history-detail-section">
        <h3>Scorecard</h3>
        <div style="overflow-x:auto;">
          <table><thead><tr>${headerRow}</tr></thead><tbody>${rows}</tbody></table>
        </div>
      </div>`;
    }

    // Settlement summary
    const netEntries = Object.entries(r.playerNet || {})
      .map(([pid, val]) => ({pid, name: (players.find(p => p.id === pid)||{}).name || pid, val}))
      .sort((a,b) => b.val - a.val);

    // Compute transfers from saved net
    const xfers = UI.calcTransfers(r.playerNet || {});
    let xferHtml = '<p style="color:var(--muted);">All square!</p>';
    if (xfers.length) {
      const pName = pid => (players.find(p => p.id === pid)||{}).name || pid;
      xferHtml = '<ul class="history-transfers" style="margin:0;padding-left:20px;">' +
        xfers.map(x => `<li>${pName(x.from)} &rarr; ${pName(x.to)}: ${Utils.fmt(x.amount)}</li>`).join('') +
        '</ul>';
    }

    const netHtml = netEntries.map(e =>
      `<div style="display:flex;justify-content:space-between;padding:4px 0;">
        <span>${e.name}</span>
        <span style="font-weight:600;color:${e.val > 0.005 ? 'var(--success)' : e.val < -0.005 ? 'var(--danger)' : 'var(--muted)'};">${e.val > 0 ? '+' : ''}${Utils.fmt(e.val)}</span>
      </div>`
    ).join('');

    const gamesHtml = r.games.map(g => `<span class="pill">${this.gameLabel(g.gameType)}</span>`).join(' ');

    detailEl.className = 'history-detail';
    detailEl.innerHTML = `
      <div class="history-detail-section">
        <h3>${r.course.name || 'Custom Course'}</h3>
        <div style="margin-bottom:8px;">${gamesHtml}</div>
        <div style="color:var(--muted);font-size:13px;">${players.map(p => p.name).join(', ')}</div>
      </div>
      <div class="history-detail-section">
        <h3>Settlement</h3>
        ${xferHtml}
      </div>
      <div class="history-detail-section">
        <h3>Player Net</h3>
        ${netHtml}
      </div>
      ${scoresHtml}
      <button class="history-delete" id="historyComboBtn" style="border-color:var(--acc);color:var(--acc);margin-top:16px;">🎯 Group Score</button>
      <button class="history-delete" id="historyDeleteRound">Delete This Round</button>
    `;

    // Rewire back button to go back to list
    const backBtn = parentOverlay.querySelector('#historyBack');
    backBtn.onclick = () => {
      headerH2.textContent = 'Round History';
      parentOverlay.remove();
      this.show();
    };

    detailEl.querySelector('#historyComboBtn').onclick = () =>
      UI.showComboCalc(r, this.formatDate(r.date));

    detailEl.querySelector('#historyDeleteRound').onclick = () => {
      if (!confirm('Delete this round from history?')) return;
      this.deleteRound(id);
      headerH2.textContent = 'Round History';
      parentOverlay.remove();
      this.show();
      Err.toast('Round deleted');
    };
  }
};

// === GAME LOGIC ===
const Game = {
  // Map playing position (0-17) to course hole index (0-17)
  courseHole(pos) { return (pos + (State.data.startingHole || 0)) % 18; },
  // Display label for a playing position
  holeLabel(pos) { return this.courseHole(pos) + 1; },
  // Range label e.g. "1–9" or "10–18" for a span of positions
  rangeLabel(startPos, endPos) { return `${this.holeLabel(startPos)}\u2013${this.holeLabel(endPos)}`; },

  create(clone = false) {
    const g = {
      id: Utils.uid(),
      gameType: 'nassau',
      teamA: ['p1','p2'],
      teamB: ['p3','p4'],
      teamSize: 2,
      scoringMode: 'hi_low',
      stakes: {front:2, back:5, overall:2},
      autoPress: {front:true, back:true, overall:false},
      withJunk: true,
      junkValue: {front:1, back:2},
      pointValue: {front:1, back:1},
      presses: Utils.make18(''),
      skinsPlayers: [],
      skinsMode: 'net',
      wolfPlayers: [],
      wolfTeeOrder: [],
      wolfPointValue: 1,
      wolfSelections: Utils.make18(''),
      // 9-Point specific
      ninePointPlayers: [],
      ninePointValue: 1,
      ninePointMode: 'net',
      ninePointWinBy2: true,
      ninePointBirdieDouble: false,
      gross: {},
      junkCounts: {},
      strokesCount: {},
      // KP tracking per hole (only relevant for par 3s)
      // Each entry: { ranking: [pid1, pid2, ...] } ordered closest to farthest (on green + made par or better)
      // null = no KP data entered for this hole
      kpData: Utils.make18(null),
      vegasBirdieDouble: false,
      quadsConfirmed: {},
      handicapMode: 'full' // full, off_low, team_delta
    };
    State.data.players.forEach(p => {
      g.junkCounts[p.id] = Utils.make18(0);
      g.strokesCount[p.id] = 0;
      g.gross[p.id] = clone && State.data.games[0] ? [...State.data.games[0].gross[p.id]] : Utils.make18(null);
    });
    return g;
  },

  sanitize(g) {
    if (!g) return this.create();
    g.id = g.id || Utils.uid();
    g.gameType = ['nassau','vegas','skins','wolf','ninepoint'].includes(g.gameType) ? g.gameType : 'nassau';

    const maxTeamSize = g.gameType === 'vegas' ? 2 : (g.teamSize || 2);
    g.teamSize = [1,2].includes(g.teamSize) ? g.teamSize : 2;
    g.scoringMode = ['hi_low','low_net'].includes(g.scoringMode) ? g.scoringMode : 'hi_low';
    g.teamA = (g.teamA || []).slice(0, maxTeamSize);
    g.teamB = (g.teamB || []).slice(0, maxTeamSize);
    g.stakes = g.stakes || {front:2,back:5,overall:2};
    ['front','back','overall'].forEach(k => g.stakes[k] = Math.max(0, parseInt(g.stakes[k])||0));
    g.autoPress = g.autoPress || {front:true,back:true,overall:false};
    g.withJunk = g.withJunk === true;
    g.junkValue = g.junkValue || {front:1,back:2};
    ['front','back'].forEach(k => g.junkValue[k] = Math.max(0, parseInt(g.junkValue[k])||0));
    g.pointValue = g.pointValue || {front:1,back:1};
    ['front','back'].forEach(k => { const v = parseFloat(g.pointValue[k]); g.pointValue[k] = isNaN(v) ? 1 : Math.max(0, v); });
    // Skins-specific
    g.skinsMode = ['net','gross','both'].includes(g.skinsMode) ? g.skinsMode : 'net';
    g.skinsPlayers = Array.isArray(g.skinsPlayers) ? g.skinsPlayers : [];
    // Wolf-specific
    g.wolfPlayers = Array.isArray(g.wolfPlayers) ? g.wolfPlayers : [];
    g.wolfTeeOrder = Array.isArray(g.wolfTeeOrder) ? g.wolfTeeOrder : [];
    g.wolfPointValue = g.wolfPointValue || 1;
    g.wolfSelections = Array.isArray(g.wolfSelections) ? g.wolfSelections.slice(0,18) : Utils.make18('');
    while ((g.wolfSelections || []).length < 18) g.wolfSelections.push('');
    // 9-Point specific
    g.ninePointPlayers = Array.isArray(g.ninePointPlayers) ? g.ninePointPlayers : [];
    g.ninePointValue = g.ninePointValue || 1;
    g.ninePointMode = ['net','gross'].includes(g.ninePointMode) ? g.ninePointMode : 'net';
    g.ninePointWinBy2 = g.ninePointWinBy2 !== false;
    g.ninePointBirdieDouble = g.ninePointBirdieDouble === true;
    g.vegasBirdieDouble = g.vegasBirdieDouble === true;
    g.handicapMode = ['full','off_low','team_delta'].includes(g.handicapMode) ? g.handicapMode : 'full';

    let pa = Array.isArray(g.presses) ? g.presses.slice(0,18) : Utils.make18('');
    while (pa.length < 18) pa.push('');
    g.presses = pa.map(v => ['','press','blind'].includes(v) ? v : '');
    
    g.gross = g.gross || {};
    g.junkCounts = g.junkCounts || {};
    g.strokesCount = g.strokesCount || {};
    let kp = Array.isArray(g.kpData) ? g.kpData.slice(0,18) : Utils.make18(null);
    while (kp.length < 18) kp.push(null);
    g.kpData = kp;
    g.quadsConfirmed = g.quadsConfirmed || {};

    State.data.players.forEach(p => {
      let ga = Array.isArray(g.gross[p.id]) ? g.gross[p.id].slice(0,18) : Utils.make18(null);
      while (ga.length < 18) ga.push(null);
      ga = ga.map(v => {
        if (v === '' || v == null) return null;
        const n = parseInt(v);
        return (n >= MIN_SCORE && n <= MAX_SCORE) ? n : null;
      });
      g.gross[p.id] = ga;
      
      let ja = Array.isArray(g.junkCounts[p.id]) ? g.junkCounts[p.id].slice(0,18) : Utils.make18(0);
      while (ja.length < 18) ja.push(0);
      g.junkCounts[p.id] = ja.map(v => Math.max(0, parseInt(v)||0));
      
      g.strokesCount[p.id] = parseInt(g.strokesCount[p.id])||0;
    });
    return g;
  },

  /**
   * The rated tee sets the app knows for a course, or an empty list.
   *
   * Empty is a real answer and the safe one: no ratings means no conversion,
   * so the handicap box is left alone rather than filled from a slope that
   * belongs to a different golf course.
   *
   * Only El Macero is rated today, from the GHIN pull. Other courses get their
   * tees when they are pulled — the lookup is by name so nothing here changes
   * when they are.
   */
  teesFor(courseName) {
    if (courseName === BB_DEFAULT_COURSE.name) {
      return JSON.parse(JSON.stringify(BB_DEFAULT_COURSE.tees));
    }
    return [];
  },

  /**
   * The tee being played, or null.
   *
   * Named rather than indexed so that re-ordering the tee list — which happens
   * whenever a course is re-pulled from GHIN — cannot silently move everybody
   * to a different set of tees.
   */
  selectedTee(course) {
    const tees = (course && course.tees) || [];
    if (!tees.length) return null;
    const want = course.teeName;
    return tees.filter((t) => t && t.name === want)[0] || null;
  },

  /**
   * A GHIN handicap index as a number.
   *
   * GHIN returns it as a STRING, and two of its values are not numbers at all:
   * "NH" means no handicap, and a plus handicap arrives as "+0.3", which is
   * NEGATIVE 0.3 — a better-than-scratch player gives strokes back. parseFloat
   * on "+0.3" quietly returns positive 0.3, which turns Tyler from the best
   * player in the group into a bogey-ish 0 and moves money on every hole he
   * gets a stroke he should be giving.
   */
  parseIndex(value) {
    if (value == null) return null;
    if (typeof value === 'number') return Number.isFinite(value) ? value : null;
    const s = String(value).trim();
    if (!s || s.toUpperCase() === 'NH') return null;
    const n = parseFloat(s.charAt(0) === '+' ? '-' + s.slice(1) : s);
    return Number.isFinite(n) ? n : null;
  },

  /**
   * Course handicap: what a player actually plays off at a given set of tees.
   *
   * An index is portable; a course handicap is not. Against the four real
   * rounds, every card handicap in this group is round(index x slope / 113) —
   * the PRE-2020 formula, with no (CourseRating - Par) term. Current WHS adds
   * that term, which at El Macero White would make Tim a 22 rather than the 21
   * he has always played off.
   *
   * So the WHS term is available and OFF by default. This is not a correctness
   * judgement: turning it on silently would change every net bet in the app's
   * history by about a stroke, and a rules change has to be a decision somebody
   * makes, not a side effect of a release.
   *
   * Returns null rather than a guess when the index or the slope is missing.
   * A course with no rating data must leave the handicap box alone, not fill it
   * with the raw index — that is 1-2 strokes light and says nothing on screen.
   */
  courseHandicap(index, tee, opts) {
    const idx = this.parseIndex(index);
    const slope = tee && Number(tee.slope);
    if (idx == null || !slope || !isFinite(slope)) return null;
    let ch = idx * slope / 113;
    if (opts && opts.useRatingMinusPar) {
      const rating = Number(tee.rating), par = Number(tee.par);
      if (isFinite(rating) && isFinite(par)) ch += rating - par;
    }
    // Round half away from zero, so a plus handicap rounds the same distance
    // from scratch as an equivalent positive one. Math.round(-0.5) is -0, which
    // would hand a plus player a stroke he has not earned.
    return ch < 0 ? -Math.round(-ch) : Math.round(ch);
  },

  /**
   * How this group picks teams: lowest handicap partners the highest.
   *
   * With four that is the only pairing that balances — the alternatives put
   * the two best players together. With five, the low/high pair stays together
   * and plays each of the other three PAIRS, which is three matches and leaves
   * everyone in two of them; nobody sits out and nobody plays every hole
   * against the same partner.
   *
   * Returns suggestions, never a decision. Brian: "99% of the time it's low &
   * high together. As long as there is a manual way to break out of the
   * assumption, it's fine." So this is what the wizard proposes, and the wizard
   * always offers a way past it.
   *
   * Ties are broken by the order the players were entered rather than by
   * handicap alone, so two men on the same number produce the same teams every
   * time it is asked. A suggestion that quietly reshuffles between renders is
   * worse than no suggestion.
   */
  suggestTeams(players) {
    const ps = (players || []).filter((p) => p && p.id && String(p.name || '').trim());
    if (ps.length < 4 || ps.length > 5) return [];   // the app plays 4 or 5

    // The `|| (a.i - b.i)` is belt-and-braces TODAY — Array#sort has been
    // stable since ES2019, so equal handicaps would keep entry order anyway,
    // and a mutation test removing it changes nothing. It stays because `i` is
    // captured from the ENTRY array: if anything upstream ever sorts or
    // regroups players before this runs, sort stability preserves that new
    // order while `i` still preserves the order they were typed in, which is
    // the one the tee order actually reflects.
    const order = ps.map((p, i) => ({ id: p.id, hcp: p.handicap || 0, i }))
      .sort((a, b) => (a.hcp - b.hcp) || (a.i - b.i));

    const low = order[0], high = order[order.length - 1];
    const pair = [low.id, high.id];
    const rest = order.slice(1, -1);                 // 2 of them at four, 3 at five
    const sum = (ids) => ids.reduce((t, id) => t + (order.filter((o) => o.id === id)[0] || { hcp: 0 }).hcp, 0);
    const match = (a, b) => ({ teamA: a, teamB: b, deltaA: sum(a) - sum(b) });

    if (ps.length === 4) return [match(pair, rest.map((o) => o.id))];

    // Five: every pair of the remaining three, in handicap order, so the list
    // reads the same way twice.
    const out = [];
    for (let i = 0; i < rest.length; i++) {
      for (let j = i + 1; j < rest.length; j++) out.push(match(pair, [rest[i].id, rest[j].id]));
    }
    return out;
  },

  applyHandicapMode(g) {
    const playerHandicaps = {};
    State.data.players.forEach(p => {
      playerHandicaps[p.id] = p.handicap || 0;
    });
    if (g.handicapMode === 'full') {
      Object.keys(playerHandicaps).forEach(pid => {
        g.strokesCount[pid] = playerHandicaps[pid];
      });
    } else if (g.handicapMode === 'off_low') {
      const vals = Object.values(playerHandicaps);
      const min = vals.length ? Math.min(...vals) : 0;
      Object.keys(playerHandicaps).forEach(pid => {
        g.strokesCount[pid] = playerHandicaps[pid] - min;
      });
    } else if (g.handicapMode === 'team_delta') {
      const teamATotal = (g.teamA||[]).reduce((s, pid) => s + (playerHandicaps[pid]||0), 0);
      const teamBTotal = (g.teamB||[]).reduce((s, pid) => s + (playerHandicaps[pid]||0), 0);
      Object.keys(playerHandicaps).forEach(pid => g.strokesCount[pid] = 0);
      if (teamATotal > teamBTotal) {
        let highPid = (g.teamA||[])[0], highVal = playerHandicaps[(g.teamA||[])[0]] || 0;
        (g.teamA||[]).forEach(pid => {
          if ((playerHandicaps[pid]||0) > highVal) { highPid = pid; highVal = playerHandicaps[pid]||0; }
        });
        if (highPid) g.strokesCount[highPid] = teamATotal - teamBTotal;
      } else if (teamBTotal > teamATotal) {
        let highPid = (g.teamB||[])[0], highVal = playerHandicaps[(g.teamB||[])[0]] || 0;
        (g.teamB||[]).forEach(pid => {
          if ((playerHandicaps[pid]||0) > highVal) { highPid = pid; highVal = playerHandicaps[pid]||0; }
        });
        if (highPid) g.strokesCount[highPid] = teamBTotal - teamATotal;
      }
    }
  },

  strokes(g, pid, hole) {
    const total = g.strokesCount[pid] || 0;
    if (!total) return 0;
    const abs = Math.abs(total);
    const base = Math.floor(abs / 18);
    const rem = abs % 18;
    const rank = State.data.course.hcp[this.courseHole(hole)] || 0;
    if (total > 0) {
      // Positive handicap: receive strokes on hardest holes (rank 1, 2, 3...)
      return base + (rank > 0 && rank <= rem ? 1 : 0);
    } else {
      // Plus handicap: give strokes back on easiest holes (rank 18, 17, 16...)
      return -(base + (rank > 0 && rank > 18 - rem ? 1 : 0));
    }
  },

  /**
   * KP money from Team A's perspective, split into what was won on the holes
   * and what the bonuses added.
   *
   * The parts are exact: computeKP returns grandTotal as
   * totalKPValue + sweepsBonus + quadsBonus, and the team-size multiplier
   * applies to the whole figure, so applying it to each part and adding them
   * back reproduces the old single number to the cent. Nothing is reapportioned.
   *
   * Sweeps and quads are worth more than the KPs themselves — a sweep matches
   * the KP total and a quad matches KP plus sweep, so a quadded round is four
   * times the hole money. Reporting that as one line means the only way to check
   * a settlement is to re-derive the multipliers by hand.
   */
  kpTeamSplit(kp, szA, szB) {
    const zero = { base: 0, sweeps: 0, quads: 0, total: 0 };
    if (!kp) return zero;
    if (kp.hasSweeps || kp.hasQuads) {
      // One multiplier for the whole KP bet: the winning side is paid by each
      // member of the losing side.
      const mult = (kp.sweepsTeam === 'A' ? 1 : -1) * (kp.sweepsTeam === 'A' ? szB : szA);
      const base = mult * (kp.totalKPValue || 0);
      const sweeps = mult * (kp.sweepsBonus || 0);
      const quads = mult * (kp.quadsBonus || 0);
      return { base, sweeps, quads, total: base + sweeps + quads };
    }
    // No sweep: netA already nets the two sides' hole wins against each other,
    // so there is nothing to split.
    let total = 0;
    if (kp.netA > 0) total = kp.netA * szB;
    else if (kp.netA < 0) total = kp.netA * szA;
    return { base: total, sweeps: 0, quads: 0, total };
  },

  net(gross, strokes) {
    return (gross != null && isFinite(gross)) ? gross - (strokes||0) : null;
  },

  holeDiff(g, hole) {
    // Skip holes the user hasn't actually touched (auto-populated par doesn't count)
    if (State.data._scoredHoles && !State.data._scoredHoles[hole]) return null;
    const A = g.teamA || [], B = g.teamB || [];
    const bestNet = (team) => {
      let best = Infinity, has = false;
      team.forEach(pid => {
        const gr = g.gross[pid] && g.gross[pid][hole];
        const n = this.net(gr, this.strokes(g, pid, hole));
        if (n != null) { best = Math.min(best, n); has = true; }
      });
      return has ? best : null;
    };

    if (g.scoringMode === 'low_net' || A.length < 2 || B.length < 2) {
      const aL = bestNet(A), bL = bestNet(B);
      if (aL == null || bL == null) return null;
      return aL < bL ? 1 : (bL < aL ? -1 : 0);
    }

    const a0 = g.gross[A[0]] && g.gross[A[0]][hole];
    const a1 = g.gross[A[1]] && g.gross[A[1]][hole];
    const b0 = g.gross[B[0]] && g.gross[B[0]][hole];
    const b1 = g.gross[B[1]] && g.gross[B[1]][hole];
    if (a0 == null || a1 == null || b0 == null || b1 == null) return null;

    const aN0 = this.net(a0, this.strokes(g,A[0],hole));
    const aN1 = this.net(a1, this.strokes(g,A[1],hole));
    const bN0 = this.net(b0, this.strokes(g,B[0],hole));
    const bN1 = this.net(b1, this.strokes(g,B[1],hole));

    const aLow = Math.min(aN0,aN1), bLow = Math.min(bN0,bN1);
    const aHi = Math.max(aN0,aN1), bHi = Math.max(bN0,bN1);
    
    let d = 0;
    if (aLow < bLow) d++; else if (bLow < aLow) d--;
    if (aHi < bHi) d++; else if (bHi < aHi) d--;
    return d;
  },

  buildSegment(g, start, end, stake, autoPress) {
    const diffs = [];
    for (let i = 0; i < 18; i++) diffs.push(this.holeDiff(g, i));
    
    const lines = [{start, end, stake, pressesTriggered:0}];
    
    if (autoPress) {
      for (let h = start; h <= end; h++) {
        if (h >= end) break;
        // Only the most recently opened bet or press may start a new press.
        // Once a line has pressed it is no longer the latest, so every bet and
        // every press spawns AT MOST ONE press. This only differs from pressing
        // off every line in two-ball scoring, where holeDiff can be +/-2 and a
        // line can leap straight over a multiple of two.
        const line = lines[lines.length - 1];
        if (line.start > h || line.pressesTriggered) continue;
        // Skip unscored holes rather than bailing, so a single un-touched
        // hole mid-segment doesn't wipe out all subsequent presses.
        let cum = 0;
        for (let i = line.start; i <= h; i++) {
          if (diffs[i] != null) cum += diffs[i];
        }
        if (Math.abs(cum) >= 2) {
          const next = h + 1;
          if (!lines.some(l => l.start === next)) {
            lines.push({start:next, end, stake, pressedBy:cum<0?'A':'B', pressesTriggered:0});
          }
          line.pressesTriggered = 1;
        }
      }
    }

    const winners = [];
    let payA = 0, teamPayA = 0;
    const szA = (g.teamA||[]).length || 1;
    const szB = (g.teamB||[]).length || 1;

    lines.forEach(line => {
      let cum = 0, hasAnyScore = false;
      for (let i = line.start; i <= line.end; i++) {
        if (diffs[i] != null) {
          cum += diffs[i];
          hasAnyScore = true;
        }
      }
      
      if (!hasAnyScore) {
        winners.push('—');
        return;
      }
      
      // Show current standing even if incomplete (always from Team A perspective)
      if (cum > 0) { winners.push(`+${cum}`); payA += line.stake; teamPayA += line.stake * szB; }
      else if (cum < 0) { winners.push(`${cum}`); payA -= line.stake; teamPayA -= line.stake * szA; }
      else winners.push('E');
    });

    return {lines, winners, payA, teamPayA};
  },

  hasAnyScores(g) {
    return State.data.players.some(p => {
      const arr = g.gross[p.id] || [];
      return arr.some(score => score != null);
    });
  },

  // === KP LOGIC ===
  // Get par 3 playing positions (respects startingHole rotation)
  getPar3Holes() {
    const result = [];
    for (let pos = 0; pos < 18; pos++) {
      if (State.data.course.par[this.courseHole(pos)] === 3) result.push(pos);
    }
    return result;
  },

  // Compute KP results for a specific game (match)
  // Returns per-hole KP winners and carryover state, plus sweeps/quads
  computeKP(g) {
    const par3s = this.getPar3Holes();
    const allPlayers = [...(g.teamA||[]), ...(g.teamB||[])];
    const results = []; // { hole, winner: pid|null, teamWinner: 'A'|'B'|null, carried: bool, value: number }
    let carryStack = 0;
    let teamAKPs = 0, teamBKPs = 0;
    let anyKPAwarded = false;

    for (const hole of par3s) {
      const junkVal = hole <= 8 ? (g.junkValue.front||0) : (g.junkValue.back||0);
      const kpEntry = g.kpData[hole];

      if (!kpEntry || !kpEntry.ranking || kpEntry.ranking.length === 0) {
        // No one got KP on this hole — carry over
        carryStack++;
        results.push({ hole, winner: null, teamWinner: null, carried: true, value: 0, carryStack });
        continue;
      }

      // The CLOSEST PLAYER IN THIS MATCH decides the hole, and nobody else.
      //
      // kpEntry.ranking is the closest-to-pin order of everyone who hit the
      // green, shared across every game. Players who aren't in this match are
      // skipped outright — "closest" means closest among the people playing
      // THIS bet, so a man who isn't in it can't block it.
      //
      // The first one who IS in it either converts or the hole dies. We do not
      // walk past him to the next qualifier: if the closest man misses, there
      // is no KP and the value rolls to the next par 3.
      //
      // The bar is GROSS par. Strokes do not buy a KP.
      let matchWinner = null;
      for (const pid of kpEntry.ranking) {
        if (!allPlayers.includes(pid)) continue;
        const gross = g.gross[pid] && g.gross[pid][hole];
        const par = State.data.course.par[this.courseHole(hole)] || 3;
        if (gross != null && gross <= par) matchWinner = pid;
        break;
      }

      if (!matchWinner) {
        // No qualifying player in this match — carry over
        carryStack++;
        results.push({ hole, winner: null, teamWinner: null, carried: true, value: 0, carryStack });
        continue;
      }

      // Award KP with stacked carryovers
      carryStack++;
      const value = carryStack * junkVal;
      const teamWinner = (g.teamA||[]).includes(matchWinner) ? 'A' : 'B';
      if (teamWinner === 'A') teamAKPs += carryStack;
      else teamBKPs += carryStack;
      anyKPAwarded = true;

      results.push({ hole, winner: matchWinner, teamWinner, carried: false, value, carryStack });
      carryStack = 0;
    }

    // Sweeps: one team won ALL KPs (and at least one was awarded)
    // Only declare sweeps after ALL par 3s have been scored
    const allPar3sScored = par3s.every(hole => {
      return allPlayers.some(pid => {
        const gross = g.gross[pid] && g.gross[pid][hole];
        return gross != null;
      });
    });
    const totalKPs = teamAKPs + teamBKPs;
    // A dangling carryStack means the last par 3 — or several — were never won
    // by anybody. If nobody won the final KP then nobody won them all, so there
    // is no sweep, and therefore no quads prompt either.
    const allKPsResolved = carryStack === 0;
    const hasSweeps = anyKPAwarded && totalKPs > 0 && (teamAKPs === 0 || teamBKPs === 0) && allPar3sScored && allKPsResolved;
    const sweepsTeam = hasSweeps ? (teamAKPs > 0 ? 'A' : 'B') : null;

    // Calculate total KP value
    let totalKPValue = 0;
    results.forEach(r => { totalKPValue += r.value; });

    // Sweeps doubles KP value
    const sweepsBonus = hasSweeps ? totalKPValue : 0;

    // Quads: only if sweeps, and opposing team didn't hit any par 3 greens
    // This is stored as a flag on the game: g.quadsConfirmed = { A: bool, B: bool }
    // meaning "did team X fail to hit any greens"
    const quadsData = g.quadsConfirmed || {};
    const losingTeam = sweepsTeam === 'A' ? 'B' : 'A';
    const hasQuads = hasSweeps && quadsData[losingTeam] === true;
    const quadsBonus = hasQuads ? totalKPValue + sweepsBonus : 0;

    const grandTotal = totalKPValue + sweepsBonus + quadsBonus;

    return {
      results,
      teamAKPs, teamBKPs,
      hasSweeps, sweepsTeam,
      hasQuads,
      totalKPValue, sweepsBonus, quadsBonus, grandTotal,
      // Net value from Team A's perspective (face value per hole, no sweeps/quads multiplier)
      netA: results.reduce((acc, r) => acc + (r.teamWinner === 'A' ? r.value : (r.teamWinner === 'B' ? -r.value : 0)), 0)
    };
  },

  // Get the global KP ranking for a hole (shared across all games)
  // kpData on game[0] stores the master ranking
  getKPRanking(hole) {
    const g = State.data.games[0];
    if (!g) return [];
    const entry = g.kpData[hole];
    return (entry && entry.ranking) ? entry.ranking : [];
  },

  // Set KP ranking for a hole (propagated to all games)
  setKPRanking(hole, ranking) {
    State.data.games.forEach(gm => {
      if (!gm.kpData) gm.kpData = Utils.make18(null);
      gm.kpData[hole] = ranking.length > 0 ? { ranking } : null;
    });
  },

  computeJunk(g) {
    const sumTeam = (team, s, e) => {
      let tot = 0;
      team.forEach(pid => {
        const arr = g.junkCounts[pid] || [];
        for (let h = s; h <= e; h++) tot += (arr[h] || 0);
      });
      return tot;
    };
    const aF = sumTeam(g.teamA||[], 0, 8);
    const aB = sumTeam(g.teamA||[], 9, 17);
    const bF = sumTeam(g.teamB||[], 0, 8);
    const bB = sumTeam(g.teamB||[], 9, 17);
    const aVal = aF * (g.junkValue.front||0) + aB * (g.junkValue.back||0);
    const bVal = bF * (g.junkValue.front||0) + bB * (g.junkValue.back||0);
    // Front/back point differentials and values
    const frontNetPts = aF - bF;
    const backNetPts = aB - bB;
    const frontNetVal = frontNetPts * (g.junkValue.front||0);
    const backNetVal = backNetPts * (g.junkValue.back||0);
    return {aVal, bVal, netA: aVal - bVal, frontNetPts, backNetPts, frontNetVal, backNetVal};
  },

  computeResult(g) {
    const front = this.buildSegment(g, 0, 8, g.stakes.front, g.autoPress.front);
    const back = this.buildSegment(g, 9, 17, g.stakes.back, g.autoPress.back);
    const overall = this.buildSegment(g, 0, 17, g.stakes.overall, g.autoPress.overall);
    // Honour the toggle, exactly as the KP line below already does. Junk used
    // to be folded into the payout even with junk switched off, while the hole
    // view hid it — so the settlement charged for something nobody could see.
    const junk = g.withJunk ? this.computeJunk(g) : {aVal:0, bVal:0, netA:0, frontNetPts:0, backNetPts:0, frontNetVal:0, backNetVal:0};

    const szA = (g.teamA||[]).length || 1;
    const szB = (g.teamB||[]).length || 1;
    let junkTeam = 0;
    if (junk.netA > 0) junkTeam = junk.netA * szB;
    else if (junk.netA < 0) junkTeam = junk.netA * szA;

    // KP values (match-specific closest-to-pin bets, including sweeps/quads)
    const kp = g.withJunk ? this.computeKP(g) : {netA:0, grandTotal:0, results:[], hasSweeps:false, hasQuads:false};
    const kpSplit = this.kpTeamSplit(kp, szA, szB);
    const kpTeam = kpSplit.total;

    const total = front.teamPayA + back.teamPayA + overall.teamPayA + junkTeam + kpTeam;

    return {
      segments: {front, back, overall},
      junk, kp,
      teamTotals: {
        front: front.teamPayA,
        back: back.teamPayA,
        overall: overall.teamPayA,
        junk: junkTeam,
        kp: kpTeam,
        kpBase: kpSplit.base,
        kpSweeps: kpSplit.sweeps,
        kpQuads: kpSplit.quads,
        total
      }
    };
  },

  // === "Through hole" variants for historical per-hole status bars ===
  // These compute results only considering holes 0..maxHole

  buildSegmentThroughHole(g, start, end, stake, autoPress, maxHole) {
    const capEnd = Math.min(end, maxHole);
    if (capEnd < start) return {lines:[], winners:[], payA:0, teamPayA:0};

    const diffs = [];
    for (let i = 0; i < 18; i++) diffs.push(i <= maxHole ? this.holeDiff(g, i) : null);

    const lines = [{start, end: capEnd, stake, pressesTriggered:0}];

    if (autoPress) {
      for (let h = start; h <= capEnd; h++) {
        // Only the most recently opened bet or press may start a new press.
        // Once a line has pressed it is no longer the latest, so every bet and
        // every press spawns AT MOST ONE press. This only differs from pressing
        // off every line in two-ball scoring, where holeDiff can be +/-2 and a
