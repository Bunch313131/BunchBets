        // line can leap straight over a multiple of two.
        const line = lines[lines.length - 1];
        if (line.start > h || h >= line.end || line.pressesTriggered) continue;
        // Skip unscored holes rather than bailing, so a single un-touched
        // hole mid-segment doesn't wipe out all subsequent presses.
        let cum = 0;
        for (let i = line.start; i <= h; i++) {
          if (diffs[i] != null) cum += diffs[i];
        }
        if (Math.abs(cum) >= 2) {
          const next = h + 1;
          if (next <= capEnd && !lines.some(l => l.start === next)) {
            lines.push({start:next, end:capEnd, stake, pressedBy:cum<0?'A':'B', pressesTriggered:0});
          }
          line.pressesTriggered = 1;
        }
      }
    }

    const winners = [];
    let payA = 0, teamPayA = 0;
    const szA = (g.teamA||[]).length || 1;
    const szB = (g.teamB||[]).length || 1;

    lines.forEach(line => {
      let cum = 0, hasAnyScore = false;
      for (let i = line.start; i <= line.end; i++) {
        if (diffs[i] != null) { cum += diffs[i]; hasAnyScore = true; }
      }
      if (!hasAnyScore) { winners.push('—'); return; }
      if (cum > 0) { winners.push(`+${cum}`); payA += line.stake; teamPayA += line.stake * szB; }
      else if (cum < 0) { winners.push(`${cum}`); payA -= line.stake; teamPayA -= line.stake * szA; }
      else winners.push('E');
    });

    return {lines, winners, payA, teamPayA};
  },

  computeJunkThroughHole(g, maxHole) {
    const sumTeam = (team, s, e) => {
      let tot = 0;
      const capE = Math.min(e, maxHole);
      if (capE < s) return 0;
      team.forEach(pid => {
        const arr = g.junkCounts[pid] || [];
        for (let h = s; h <= capE; h++) tot += (arr[h] || 0);
      });
      return tot;
    };
    const aF = sumTeam(g.teamA||[], 0, 8);
    const aB = sumTeam(g.teamA||[], 9, 17);
    const bF = sumTeam(g.teamB||[], 0, 8);
    const bB = sumTeam(g.teamB||[], 9, 17);
    const aVal = aF * (g.junkValue.front||0) + aB * (g.junkValue.back||0);
    const bVal = bF * (g.junkValue.front||0) + bB * (g.junkValue.back||0);
    const frontNetPts = aF - bF;
    const backNetPts = aB - bB;
    const frontNetVal = frontNetPts * (g.junkValue.front||0);
    const backNetVal = backNetPts * (g.junkValue.back||0);
    return {aVal, bVal, netA: aVal - bVal, frontNetPts, backNetPts, frontNetVal, backNetVal};
  },

  computeKPThroughHole(g, maxHole) {
    const par3s = this.getPar3Holes().filter(h => h <= maxHole);
    const allPlayers = [...(g.teamA||[]), ...(g.teamB||[])];
    const results = [];
    let carryStack = 0;
    let teamAKPs = 0, teamBKPs = 0;
    let anyKPAwarded = false;

    for (const hole of par3s) {
      const junkVal = hole <= 8 ? (g.junkValue.front||0) : (g.junkValue.back||0);
      const kpEntry = g.kpData[hole];

      if (!kpEntry || !kpEntry.ranking || kpEntry.ranking.length === 0) {
        carryStack++;
        results.push({ hole, winner: null, teamWinner: null, carried: true, value: 0, carryStack });
        continue;
      }

      // Mirrors computeKP exactly — closest man in the match decides, gross par,
      // no walking past a failure. These two must stay in lockstep or the running
      // status bar disagrees with the final settlement.
      let matchWinner = null;
      for (const pid of kpEntry.ranking) {
        if (!allPlayers.includes(pid)) continue;
        const gross = g.gross[pid] && g.gross[pid][hole];
        const par = State.data.course.par[this.courseHole(hole)] || 3;
        if (gross != null && gross <= par) matchWinner = pid;
        break;
      }

      if (!matchWinner) {
        carryStack++;
        results.push({ hole, winner: null, teamWinner: null, carried: true, value: 0, carryStack });
        continue;
      }

      carryStack++;
      const value = carryStack * junkVal;
      const teamWinner = (g.teamA||[]).includes(matchWinner) ? 'A' : 'B';
      if (teamWinner === 'A') teamAKPs += carryStack;
      else teamBKPs += carryStack;
      anyKPAwarded = true;
      results.push({ hole, winner: matchWinner, teamWinner, carried: false, value, carryStack });
      carryStack = 0;
    }

    const allPar3sScored = par3s.every(hole => allPlayers.some(pid => {
      const gross = g.gross[pid] && g.gross[pid][hole];
      return gross != null;
    }));
    // A sweep is every par 3 of the ROUND. par3s above is only the ones played
    // so far, so until the last one is reached nobody has swept anything.
    const allPar3sReached = this.getPar3Holes().every(h => h <= maxHole);
    const totalKPs = teamAKPs + teamBKPs;
    // A dangling carryStack means the last par 3 — or several — were never won
    // by anybody. If nobody won the final KP then nobody won them all, so there
    // is no sweep, and therefore no quads prompt either.
    const allKPsResolved = carryStack === 0;
    const hasSweeps = anyKPAwarded && totalKPs > 0 && (teamAKPs === 0 || teamBKPs === 0) && allPar3sScored && allPar3sReached && allKPsResolved;
    const sweepsTeam = hasSweeps ? (teamAKPs > 0 ? 'A' : 'B') : null;

    let totalKPValue = 0;
    results.forEach(r => { totalKPValue += r.value; });
    const sweepsBonus = hasSweeps ? totalKPValue : 0;
    const quadsData = g.quadsConfirmed || {};
    const losingTeam = sweepsTeam === 'A' ? 'B' : 'A';
    const hasQuads = hasSweeps && quadsData[losingTeam] === true;
    const quadsBonus = hasQuads ? totalKPValue + sweepsBonus : 0;
    const grandTotal = totalKPValue + sweepsBonus + quadsBonus;

    return {
      results, teamAKPs, teamBKPs, hasSweeps, sweepsTeam, hasQuads,
      totalKPValue, sweepsBonus, quadsBonus, grandTotal,
      netA: results.reduce((acc, r) => acc + (r.teamWinner === 'A' ? r.value : (r.teamWinner === 'B' ? -r.value : 0)), 0)
    };
  },

  computeResultThroughHole(g, maxHole) {
    const front = this.buildSegmentThroughHole(g, 0, 8, g.stakes.front, g.autoPress.front, maxHole);
    const back = maxHole >= 9 ? this.buildSegmentThroughHole(g, 9, 17, g.stakes.back, g.autoPress.back, maxHole) : {lines:[], winners:[], payA:0, teamPayA:0};
    const overall = this.buildSegmentThroughHole(g, 0, 17, g.stakes.overall, g.autoPress.overall, maxHole);
    // Honour the toggle, exactly as the KP line below already does. Junk used
    // to be folded into the payout even with junk switched off, while the hole
    // view hid it — so the settlement charged for something nobody could see.
    const junk = g.withJunk ? this.computeJunkThroughHole(g, maxHole) : {aVal:0, bVal:0, netA:0, frontNetPts:0, backNetPts:0, frontNetVal:0, backNetVal:0};

    const szA = (g.teamA||[]).length || 1;
    const szB = (g.teamB||[]).length || 1;
    let junkTeam = 0;
    if (junk.netA > 0) junkTeam = junk.netA * szB;
    else if (junk.netA < 0) junkTeam = junk.netA * szA;

    const kp = g.withJunk ? this.computeKPThroughHole(g, maxHole) : {netA:0, grandTotal:0, results:[], hasSweeps:false, hasQuads:false};
    const kpSplit = this.kpTeamSplit(kp, szA, szB);
    const kpTeam = kpSplit.total;

    const total = front.teamPayA + back.teamPayA + overall.teamPayA + junkTeam + kpTeam;

    return {
      segments: {front, back, overall},
      junk, kp,
      teamTotals: { front: front.teamPayA, back: back.teamPayA, overall: overall.teamPayA, junk: junkTeam,
                    kp: kpTeam, kpBase: kpSplit.base, kpSweeps: kpSplit.sweeps, kpQuads: kpSplit.quads, total }
    };
  },

  computeVegasResultThroughHole(g, maxHole) {
    let frontPoints = 0, backPoints = 0;
    const holeDetails = [];

    for (let h = 0; h <= maxHole && h < 18; h++) {
      const result = this.computeVegasHole(g, h);
      holeDetails.push(result);
      if (result) {
        if (h <= 8) frontPoints += result.pointsToA;
        else backPoints += result.pointsToA;
      }
    }

    const frontValue = frontPoints * (g.pointValue.front || 0) * 2;
    const backValue = backPoints * (g.pointValue.back || 0) * 2;

    // Honour the toggle, exactly as the KP line below already does. Junk used
    // to be folded into the payout even with junk switched off, while the hole
    // view hid it — so the settlement charged for something nobody could see.
    const junk = g.withJunk ? this.computeJunkThroughHole(g, maxHole) : {aVal:0, bVal:0, netA:0, frontNetPts:0, backNetPts:0, frontNetVal:0, backNetVal:0};
    const szA = (g.teamA||[]).length || 1;
    const szB = (g.teamB||[]).length || 1;
    let junkTeam = 0;
    if (junk.netA > 0) junkTeam = junk.netA * szB;
    else if (junk.netA < 0) junkTeam = junk.netA * szA;

    const kp = g.withJunk ? this.computeKPThroughHole(g, maxHole) : {netA:0, grandTotal:0, results:[], hasSweeps:false, hasQuads:false};
    const kpSplit = this.kpTeamSplit(kp, szA, szB);
    const kpTeam = kpSplit.total;

    return {
      holeDetails, frontPoints, backPoints, frontValue, backValue,
      junkValue: junkTeam, kpValue: kpTeam, kp,
      kpBase: kpSplit.base, kpSweeps: kpSplit.sweeps, kpQuads: kpSplit.quads,
      totalValue: frontValue + backValue + junkTeam + kpTeam
    };
  },

  // Compute per-player net $ for any game type (used by transactions, share, round-complete modal)
  // Junk "pay up the ladder" — INDIVIDUAL games only (Skins, Wolf, 9-Point).
  // Every player collects, from each player below them, the difference in junk value.
  // Team games (Nassau, Vegas) settle junk as a single team-vs-team net and must NOT
  // use this. Single source of truth for every display and for the actual payout.
  // === GROUP SCORE — "N gross + M net" side game ==========================
  // Played group against group: each hole your side contributes a set number of
  // gross scores and a set number of net scores, best legal combination, and
  // the 18-hole total is compared with the other group's.
  //
  // This settles NO money and writes to no game. It is a read-only calculation
  // over scores already entered, which is why it is not a game type.

  /**
   * Stroke allocation for the side game.
   *
   * Deliberately separate from Game.strokes(): that reads g.strokesCount, which
   * has already been adjusted by the game's handicapMode (off_low, team_delta).
   * The side game is always played off FULL handicaps. It also takes the hcp[]
   * array as an argument rather than reading State, so a saved round is scored
   * under the allocation it was actually played with.
   */
  comboStrokes(handicap, hcpArr, pos, startingHole) {
    const total = parseInt(handicap) || 0;
    if (!total || !hcpArr || !hcpArr.length) return 0;
    const abs = Math.abs(total);
    const base = Math.floor(abs / 18);
    const rem = abs % 18;
    const rank = hcpArr[(pos + (startingHole || 0)) % 18] || 0;
    // Mirrors Game.strokes exactly, including plus handicaps giving shots back
    // on the EASIEST holes.
    if (total > 0) return base + (rank > 0 && rank <= rem ? 1 : 0);
    return -(base + (rank > 0 && rank > 18 - rem ? 1 : 0));
  },

  /**
   * Best legal total for nGross gross scores plus nNet net scores per hole.
   * One rule: a player may not supply both a gross and a net score on the same
   * hole. Each hole is optimised independently — there is no cross-hole
   * constraint, so no player has to be used and none is capped.
   *
   * Exhaustive, not greedy. Five players at 1 gross + 2 net is thirty legal
   * combinations per hole, so the exact answer costs nothing and there is no
   * heuristic to be subtly wrong.
   */
  computeCombo(src, nGross, nNet) {
    const ids = src.players.map(p => p.id);
    const need = nGross + nNet;
    const choose = (arr, k) => k === 0 ? [[]] :
      arr.flatMap((v, i) => choose(arr.slice(i + 1), k - 1).map(c => [v].concat(c)));

    const holes = [];
    let total = 0, holesScored = 0;
    for (let pos = 0; pos < 18; pos++) {
      const avail = ids.filter(pid => src.gross[pid] && src.gross[pid][pos] != null);
      if (avail.length < need) { holes.push({pos, sum:null, gross:[], net:[]}); continue; }

      let best = null;
      choose(avail, nGross).forEach(G => {
        const rest = avail.filter(p => G.indexOf(p) === -1);
        choose(rest, nNet).forEach(N => {
          let sum = 0;
          G.forEach(pid => { sum += src.gross[pid][pos]; });
          N.forEach(pid => {
            sum += src.gross[pid][pos] - Game.comboStrokes(src.handicap[pid], src.hcpArr, pos, src.startingHole);
          });
          if (best === null || sum < best.sum) best = {sum, gross:G, net:N};
        });
      });
      holes.push({pos, sum:best.sum, gross:best.gross, net:best.net});
      total += best.sum; holesScored++;
    }
    return {total, holes, holesScored};
  },

  /** Normalise the live round or a history snapshot into one shape. */
  comboSource(round) {
    const players = (round.players || []).filter(p => (p.name || '').trim());
    const gross = {}, handicap = {};
    players.forEach(p => {
      handicap[p.id] = p.handicap || 0;
      // Scores are duplicated across games and kept in sync as they are entered,
      // but a player need not appear in every game — so read the union rather
      // than trusting games[0].
      const card = Utils.make18(null);
      (round.games || []).forEach(g => {
        const arr = g.gross && g.gross[p.id];
        if (!arr) return;
        for (let i = 0; i < 18; i++) if (card[i] == null && arr[i] != null) card[i] = arr[i];
      });
      gross[p.id] = card;
    });
    return {
      players, gross, handicap,
      hcpArr: (round.course && round.course.hcp) || [],
      parArr: (round.course && round.course.par) || [],
      startingHole: round.startingHole || 0,
      courseName: (round.course && round.course.name) || 'Course',
    };
  },

  computeJunkLadder(g, playerIds) {
    const players = playerIds || [];
    const junkNet = {};
    players.forEach(pid => { junkNet[pid] = 0; });
    const front = (g.junkValue && g.junkValue.front) || 0;
    const back  = (g.junkValue && g.junkValue.back)  || 0;
    const standings = players.map(pid => {
      const arr = (g.junkCounts && g.junkCounts[pid]) || [];
      let frontJunk = 0, backJunk = 0;
      for (let hh = 0; hh <= 8; hh++)  frontJunk += (arr[hh] || 0);
      for (let hh = 9; hh <= 17; hh++) backJunk  += (arr[hh] || 0);
      return { pid, junkVal: frontJunk * front + backJunk * back, frontJunk, backJunk };
    }).sort((a, b) => b.junkVal - a.junkVal);
    let totalJunkMoney = 0;
    const txns = [];
    if (g.withJunk) {
      for (let i = 0; i < standings.length; i++) {
        for (let j = i + 1; j < standings.length; j++) {
          const diff = standings[i].junkVal - standings[j].junkVal;
          if (diff > 0) {
            junkNet[standings[i].pid] += diff;
            junkNet[standings[j].pid] -= diff;
            totalJunkMoney += diff;
            txns.push({ from: standings[j].pid, to: standings[i].pid, amount: diff });
          }
        }
      }
    }
    return { standings, junkNet, totalJunkMoney, txns };
  },

  computeGamePlayerNet(g) {
    const net = {};
    const addJunkLadder = (players) => {
      const jl = Game.computeJunkLadder(g, players);
      players.forEach(pid => { net[pid] = (net[pid]||0) + (jl.junkNet[pid]||0); });
    };

    if (g.gameType === 'skins') {
      const players = g.skinsPlayers || [];
      players.forEach(pid => { net[pid] = 0; });
      const res = this.computeSkinsResult(g);
      players.forEach(pid => { const pr = res.playerResults[pid]; if (pr) net[pid] += pr.profit; });
      if (g.withJunk) addJunkLadder(players);
    } else if (g.gameType === 'wolf') {
      const players = g.wolfPlayers || [];
      players.forEach(pid => { net[pid] = 0; });
      const res = this.computeWolfResult(g);
      players.forEach(pid => { net[pid] += res.playerNet[pid] || 0; });
      if (g.withJunk) addJunkLadder(players);
    } else if (g.gameType === 'ninepoint') {
      const players = g.ninePointPlayers || [];
      players.forEach(pid => { net[pid] = 0; });
      const res = this.computeNinePointResult(g);
      players.forEach(pid => { net[pid] += res.playerNet[pid] || 0; });
      if (g.withJunk) addJunkLadder(players);
    } else {
      // Nassau or Vegas — team-based
      const allPids = [...(g.teamA||[]), ...(g.teamB||[])];
      allPids.forEach(pid => { net[pid] = 0; });
      let tot;
      if (g.gameType === 'vegas') {
        tot = this.computeVegasResult(g).totalValue;
      } else {
        tot = this.computeResult(g).teamTotals.total;
      }
      const szA = (g.teamA||[]).length || 1;
      const szB = (g.teamB||[]).length || 1;
      const aShare = tot / szA;
      const bShare = -tot / szB;
      (g.teamA||[]).forEach(id => net[id] += aShare);
      (g.teamB||[]).forEach(id => net[id] += bShare);
    }
    return net;
  },

  computeVegasHole(g, hole) {
    // Skip holes the user hasn't actually touched
    if (State.data._scoredHoles && !State.data._scoredHoles[hole]) return null;
    const par = State.data.course.par[this.courseHole(hole)] || 4;
    const maxNet = par + 3; // Triple bogey max for Vegas

    const getTeamScores = (team) => {
      if (team.length < 2) return null;
      const p1gross = g.gross[team[0]] && g.gross[team[0]][hole];
      const p2gross = g.gross[team[1]] && g.gross[team[1]][hole];
      if (p1gross == null || p2gross == null) return null;

      // Calculate net scores, capped at triple bogey
      const p1net = Math.min(this.net(p1gross, this.strokes(g, team[0], hole)), maxNet);
      const p2net = Math.min(this.net(p2gross, this.strokes(g, team[1], hole)), maxNet);

      return {
        p1gross, p2gross, p1net, p2net,
        scores: [p1net, p2net].sort((a,b) => a-b)
      };
    };
    
    const teamA = getTeamScores(g.teamA || []);
    const teamB = getTeamScores(g.teamB || []);
    
    if (!teamA || !teamB) return null;
    
    const hasBirdie = (team) => team.p1gross < par || team.p2gross < par;
    const hasNetParOrBetter = (team) => team.p1net <= par || team.p2net <= par;

    // Flip conditions:
    // - Opponent birdie (gross) always flips your number
    // - Your own bogey flips your number, BUT only if no one on your team has net par or better
    //   (net par or better "protects" your team from self-inflicted flip)
    const aFlip = hasBirdie(teamB) || !hasNetParOrBetter(teamA);
    const bFlip = hasBirdie(teamA) || !hasNetParOrBetter(teamB);
    
    const formNumber = (data, flip) => {
      const [low, high] = data.scores;
      return flip ? (high * 10 + low) : (low * 10 + high);
    };
    
    const numA = formNumber(teamA, aFlip);
    const numB = formNumber(teamB, bFlip);
    const diff = Math.abs(numA - numB);
    
    const basePoints = numA < numB ? diff : (numA > numB ? -diff : 0);
    
    const press = g.presses[hole] || '';
    let multiplier = 1;
    if (press === 'press') multiplier = 2;
    else if (press === 'blind') multiplier = 4;

    const bothABirdie = teamA.p1gross < par && teamA.p2gross < par;
    const bothBBirdie = teamB.p1gross < par && teamB.p2gross < par;
    if (g.vegasBirdieDouble && (bothABirdie || bothBBirdie)) multiplier *= 2;

    return {
      numA,
      numB,
      aFlip,
      bFlip,
      aHasBirdie: hasBirdie(teamA),
      bHasBirdie: hasBirdie(teamB),
      bothABirdie,
      bothBBirdie,
      basePoints,
      multiplier,
      pointsToA: basePoints * multiplier
    };
  },

  computeVegasResult(g) {
    let frontPoints = 0, backPoints = 0;
    const holeDetails = [];
    
    for (let h = 0; h < 18; h++) {
      const result = this.computeVegasHole(g, h);
      holeDetails.push(result);
      
      if (result) {
        if (h <= 8) frontPoints += result.pointsToA;
        else backPoints += result.pointsToA;
      }
    }
    
    const frontValue = frontPoints * (g.pointValue.front || 0) * 2;
    const backValue = backPoints * (g.pointValue.back || 0) * 2;
    
    // Honour the toggle, exactly as the KP line below already does. Junk used
    // to be folded into the payout even with junk switched off, while the hole
    // view hid it — so the settlement charged for something nobody could see.
    const junk = g.withJunk ? this.computeJunk(g) : {aVal:0, bVal:0, netA:0, frontNetPts:0, backNetPts:0, frontNetVal:0, backNetVal:0};
    const szA = (g.teamA||[]).length || 1;
    const szB = (g.teamB||[]).length || 1;
    let junkTeam = 0;
    if (junk.netA > 0) junkTeam = junk.netA * szB;
    else if (junk.netA < 0) junkTeam = junk.netA * szA;

    // KP values
    const kp = g.withJunk ? this.computeKP(g) : {netA:0, grandTotal:0, results:[], hasSweeps:false, hasQuads:false};
    const kpSplit = this.kpTeamSplit(kp, szA, szB);
    const kpTeam = kpSplit.total;

    return {
      holeDetails,
      frontPoints,
      backPoints,
      frontValue,
      backValue,
      junkValue: junkTeam,
      kpValue: kpTeam,
      kpBase: kpSplit.base, kpSweeps: kpSplit.sweeps, kpQuads: kpSplit.quads,
      kp,
      totalValue: frontValue + backValue + junkTeam + kpTeam
    };
  },

  computeSkinsResult(g) {
    const players = (g.skinsPlayers || []);
    const mode = g.skinsMode || 'net';
    const buyIn = g.stakes.front || 20;
    const totalPot = buyIn * players.length;

    // Initialize result tracking
    const grossSkins = {}; // pid -> count
    const netSkins = {};   // pid -> count
    players.forEach(pid => { grossSkins[pid] = 0; netSkins[pid] = 0; });

    let grossCarry = 0, netCarry = 0;
    const holeDetails = [];

    for (let h = 0; h < 18; h++) {
      const detail = { hole: this.courseHole(h) + 1, grossWinner: null, netWinner: null, grossCarry: 0, netCarry: 0, grossSkins: 0, netSkins: 0 };

      // Skip holes the user hasn't actually touched
      const holeConfirmed = State.data._scoredHoles && State.data._scoredHoles[h];

      // Get scores for this hole
      const scores = [];
      let allScored = holeConfirmed ? true : false;
      if (holeConfirmed) {
        players.forEach(pid => {
          const gross = g.gross[pid] && g.gross[pid][h];
          if (gross == null || gross === '') {
            allScored = false;
          } else {
            const net = Game.net(gross, Game.strokes(g, pid, h));
            scores.push({ pid, gross, net });
          }
        });
      }

      if (!allScored || scores.length === 0) {
        detail.grossCarry = grossCarry;
        detail.netCarry = netCarry;
        holeDetails.push(detail);
        continue;
      }

      // Check for gross winner (lowest gross, no ties)
      if (mode === 'gross' || mode === 'both') {
        const minGross = Math.min(...scores.map(s => s.gross));
        const grossLeaders = scores.filter(s => s.gross === minGross);
        grossCarry++;

        if (grossLeaders.length === 1) {
          // Outright winner
          const winner = grossLeaders[0].pid;
          grossSkins[winner] += grossCarry;
          detail.grossWinner = winner;
          detail.grossSkins = grossCarry;
          grossCarry = 0;
        }
      }

      // Check for net winner (lowest net, no ties)
      if (mode === 'net' || mode === 'both') {
        const minNet = Math.min(...scores.map(s => s.net));
        const netLeaders = scores.filter(s => s.net === minNet);
        netCarry++;

        if (netLeaders.length === 1) {
          // Outright winner
          const winner = netLeaders[0].pid;
          netSkins[winner] += netCarry;
          detail.netWinner = winner;
          detail.netSkins = netCarry;
          netCarry = 0;
        }
      }

      detail.grossCarry = grossCarry;
      detail.netCarry = netCarry;
      holeDetails.push(detail);
    }

    // Calculate totals and pot distribution
    const totalGrossSkins = Object.values(grossSkins).reduce((a, b) => a + b, 0);
    const totalNetSkins = Object.values(netSkins).reduce((a, b) => a + b, 0);

    // Pot division depends on mode
    let grossPot = 0, netPot = 0;
    if (mode === 'gross') {
      grossPot = totalPot;
    } else if (mode === 'net') {
      netPot = totalPot;
    } else if (mode === 'both') {
      // Split pot, but if no skins in one category, all goes to other
      if (totalGrossSkins === 0 && totalNetSkins === 0) {
        grossPot = totalPot / 2;
        netPot = totalPot / 2;
      } else if (totalGrossSkins === 0) {
        netPot = totalPot;
      } else if (totalNetSkins === 0) {
        grossPot = totalPot;
      } else {
        grossPot = totalPot / 2;
        netPot = totalPot / 2;
      }
    }

    // Calculate per-skin value
    const grossSkinValue = totalGrossSkins > 0 ? grossPot / totalGrossSkins : 0;
    const netSkinValue = totalNetSkins > 0 ? netPot / totalNetSkins : 0;

    // Calculate player winnings
    const playerResults = {};
    players.forEach(pid => {
      const grossWin = grossSkins[pid] * grossSkinValue;
      const netWin = netSkins[pid] * netSkinValue;
      const totalWin = grossWin + netWin;
      const profit = totalWin - buyIn;
      playerResults[pid] = {
        grossSkins: grossSkins[pid],
        netSkins: netSkins[pid],
        grossWin,
        netWin,
        totalWin,
        profit
      };
    });

    return {
      holeDetails,
      grossSkins,
      netSkins,
      totalGrossSkins,
      totalNetSkins,
      grossPot,
      netPot,
      grossSkinValue,
      netSkinValue,
      grossCarry,
      netCarry,
      totalPot,
      buyIn,
      playerResults
    };
  },

  computeWolfResult(g) {
    const players = (g.wolfPlayers || []);
    const teeOrder = g.wolfTeeOrder.length ? g.wolfTeeOrder : players;
    const pointValue = g.wolfPointValue || 1;
    const selections = g.wolfSelections || [];

    // Initialize player dollars (not points - dollars account for multipliers)
    const playerDollars = {};
    players.forEach(pid => { playerDollars[pid] = 0; });

    // Catch-up start: 4 players = hole 17 (index 16), 5 players = hole 16 (index 15)
    const catchUpStart = players.length === 4 ? 16 : 15;

    let carryover = 0;
    let carryMultiplier = 1;
    const holeDetails = [];

    for (let h = 0; h < 18; h++) {
      const detail = {
        hole: this.courseHole(h) + 1,
        wolf: null,
        selection: null,
        multiplier: 1,
        wolfTeam: [],
        otherTeam: [],
        wolfBest: null,
        otherBest: null,
        winner: null,
        points: 0,
        carryover: 0
      };

      // Determine who is wolf this hole
      // Catch-up rule: player with lowest dollars becomes Wolf
      let wolfPid;
      if (h >= catchUpStart) {
        // Find player with lowest dollars
        let lowestDollars = Infinity;
        let lowestPid = teeOrder[h % teeOrder.length]; // fallback to rotation
        players.forEach(pid => {
          if (playerDollars[pid] < lowestDollars) {
            lowestDollars = playerDollars[pid];
            lowestPid = pid;
          }
        });
        wolfPid = lowestPid;
        detail.catchUp = true;
      } else {
        // Normal rotation through tee order
        const wolfIdx = h % teeOrder.length;
        wolfPid = teeOrder[wolfIdx];
      }
      detail.wolf = wolfPid;

      // Get wolf's selection for this hole
      const sel = selections[h] || '';
      detail.selection = sel;

      // Determine multiplier and teams based on selection
      let wolfTeam = [wolfPid];
      let otherTeam = players.filter(p => p !== wolfPid);
      let mult = 1;

      if (sel === 'blind') {
        mult = 4;
        // Wolf goes alone
      } else if (sel === 'wolf') {
        mult = 2;
        // Wolf goes alone
      } else if (sel && players.includes(sel)) {
        // Wolf picked a partner
        mult = 1;
        wolfTeam = [wolfPid, sel];
        otherTeam = players.filter(p => p !== wolfPid && p !== sel);
      }

      detail.multiplier = mult;
      detail.wolfTeam = wolfTeam;
      detail.otherTeam = otherTeam;

      // Get scores for this hole — skip if user hasn't touched it
      const wolfHoleConfirmed = State.data._scoredHoles && State.data._scoredHoles[h];
      let allScored = wolfHoleConfirmed ? true : false;
      const scores = {};
      if (wolfHoleConfirmed) {
        players.forEach(pid => {
          const gross = g.gross[pid] && g.gross[pid][h];
          if (gross == null || gross === '') {
            allScored = false;
          } else {
            scores[pid] = { gross, net: Game.net(gross, Game.strokes(g, pid, h)) };
          }
        });
      }

      if (!allScored || !sel) {
        detail.carryover = carryover;
        holeDetails.push(detail);
        continue;
      }

      // Calculate best ball for each team
      const wolfScores = wolfTeam.map(p => scores[p] ? scores[p].net : 99).filter(s => s !== 99);
      const otherScores = otherTeam.map(p => scores[p] ? scores[p].net : 99).filter(s => s !== 99);

      if (wolfScores.length === 0 || otherScores.length === 0) {
        detail.carryover = carryover;
        holeDetails.push(detail);
        continue;
      }

      const wolfBest = Math.min(...wolfScores);
      const otherBest = Math.min(...otherScores);
      detail.wolfBest = wolfBest;
      detail.otherBest = otherBest;

      // Calculate points for this hole
      const basePoints = 1;
      const holePoints = basePoints * mult * carryMultiplier;
      const totalPoints = holePoints + carryover;
      const holeDollars = totalPoints * pointValue;

      if (wolfBest < otherBest) {
        detail.winner = 'wolf';
        detail.points = totalPoints;
        wolfTeam.forEach(p => { playerDollars[p] += holeDollars * otherTeam.length; });
        otherTeam.forEach(p => { playerDollars[p] -= holeDollars * wolfTeam.length; });
        carryover = 0;
        carryMultiplier = 1;
      } else if (otherBest < wolfBest) {
        detail.winner = 'others';
        detail.points = totalPoints;
        otherTeam.forEach(p => { playerDollars[p] += holeDollars * wolfTeam.length; });
        wolfTeam.forEach(p => { playerDollars[p] -= holeDollars * otherTeam.length; });
        carryover = 0;
        carryMultiplier = 1;
      } else {
        // Tie - carry over
        detail.winner = 'tie';
        carryover += holePoints;
        carryMultiplier *= mult > 1 ? mult : 1; // Stack multipliers on ties
      }

      detail.carryover = carryover;
      holeDetails.push(detail);
    }

    const standings = players.map(pid => ({
      pid,
      dollars: playerDollars[pid]
    })).sort((a, b) => b.dollars - a.dollars);

    const playerNet = {};
    players.forEach(pid => { playerNet[pid] = playerDollars[pid]; });

    // Least-cash settlement from net positions
    const transactions = [];
    const debt = [], cred = [];
    players.forEach(pid => {
      const amt = playerDollars[pid];
      if (amt < -0.005) debt.push({pid, amount: -amt});
      else if (amt > 0.005) cred.push({pid, amount: amt});
    });
    debt.sort((a,b) => b.amount - a.amount);
    cred.sort((a,b) => b.amount - a.amount);
    let di = 0, ci = 0;
    while (di < debt.length && ci < cred.length) {
      const d = debt[di], c = cred[ci];
      const pay = Math.min(d.amount, c.amount);
      transactions.push({from: d.pid, to: c.pid, amount: pay});
      d.amount -= pay;
      c.amount -= pay;
      if (d.amount <= 0.005) di++;
      if (c.amount <= 0.005) ci++;
    }

    return {
      holeDetails,
      playerDollars,
      playerNet,
      standings,
      transactions,
      pointValue,
      carryover,
      totalMoney: transactions.reduce((sum, t) => sum + t.amount, 0)
    };
  },

  computeNinePointResult(g) {
    const players = (g.ninePointPlayers || []);
    const pointValue = g.ninePointValue || 1;
    const mode = g.ninePointMode || 'net';
    const winBy2 = g.ninePointWinBy2 !== false;
    const birdieDouble = g.ninePointBirdieDouble === true;

    // Initialize player points
    const playerPoints = {};
    players.forEach(pid => { playerPoints[pid] = 0; });

    const holeDetails = [];

    for (let h = 0; h < 18; h++) {
      const detail = {
        hole: this.courseHole(h) + 1,
        scores: {},
        points: {},
        winner: null,
        winBy2Applied: false,
        birdieDoubleApplied: false
      };

      // Get scores for this hole — skip if user hasn't touched it
      const npHoleConfirmed = State.data._scoredHoles && State.data._scoredHoles[h];
      let allScored = npHoleConfirmed ? true : false;
      const scores = [];
      if (npHoleConfirmed) {
        players.forEach(pid => {
          const gross = g.gross[pid] && g.gross[pid][h];
          if (gross == null || gross === '') {
            allScored = false;
          } else {
            let score = gross;
            if (mode === 'net') {
              score = Game.net(gross, Game.strokes(g, pid, h));
            }
            scores.push({ pid, gross, net: score, score });
            detail.scores[pid] = { gross, net: score };
          }
        });
      }

      if (!allScored || scores.length !== 3) {
        players.forEach(pid => { detail.points[pid] = 0; });
        holeDetails.push(detail);
        continue;
      }

      // Sort by score (lowest first)
      scores.sort((a, b) => a.score - b.score);
      const par = State.data.course.par[this.courseHole(h)] || 4;

      // Determine points based on ties
      const s1 = scores[0].score, s2 = scores[1].score, s3 = scores[2].score;
      let pts = {};

      if (s1 === s2 && s2 === s3) {
        // Three-way tie: 3/3/3
        pts[scores[0].pid] = 3;
        pts[scores[1].pid] = 3;
        pts[scores[2].pid] = 3;
      } else if (s1 === s2) {
        // Two tied for best: 4/4/1
        pts[scores[0].pid] = 4;
        pts[scores[1].pid] = 4;
        pts[scores[2].pid] = 1;
      } else if (s2 === s3) {
        // Two tied for worst: 5/2/2
        pts[scores[0].pid] = 5;
        pts[scores[1].pid] = 2;
        pts[scores[2].pid] = 2;
        detail.winner = scores[0].pid;
      } else {
        // All different: 5/3/1
        pts[scores[0].pid] = 5;
        pts[scores[1].pid] = 3;
        pts[scores[2].pid] = 1;
        detail.winner = scores[0].pid;
      }

      // Win by 2 rule: if winner won by 2+ strokes, they get all 9 points
      if (winBy2 && detail.winner && (s2 - s1) >= 2) {
        detail.winBy2Applied = true;
        const winnerGross = scores[0].gross;
        const isBirdie = winnerGross <= par - 1;

        if (birdieDouble && isBirdie) {
          // Birdie doubles: 18/0/0
          detail.birdieDoubleApplied = true;
          pts[scores[0].pid] = 18;
          pts[scores[1].pid] = 0;
          pts[scores[2].pid] = 0;
        } else {
          // Win by 2: 9/0/0
          pts[scores[0].pid] = 9;
          pts[scores[1].pid] = 0;
          pts[scores[2].pid] = 0;
        }
      }

      detail.points = pts;
      players.forEach(pid => { playerPoints[pid] += pts[pid] || 0; });
      holeDetails.push(detail);
    }

    // Calculate final standings
    const standings = players.map(pid => ({
      pid,
      points: playerPoints[pid],
      dollars: playerPoints[pid] * pointValue
    })).sort((a, b) => b.points - a.points);

    // Calculate transactions (compare each pair)
    const transactions = [];
    for (let i = 0; i < standings.length; i++) {
      for (let j = i + 1; j < standings.length; j++) {
        const diff = standings[i].points - standings[j].points;
        if (diff > 0) {
          transactions.push({
            from: standings[j].pid,
            to: standings[i].pid,
            points: diff,
            amount: diff * pointValue
          });
        }
      }
    }

    // Calculate per-player net
    const playerNet = {};
    players.forEach(pid => { playerNet[pid] = 0; });
    transactions.forEach(t => {
      playerNet[t.to] += t.amount;
      playerNet[t.from] -= t.amount;
    });

    return {
      holeDetails,
      playerPoints,
      playerNet,
      standings,
      transactions,
      pointValue,
      totalMoney: transactions.reduce((sum, t) => sum + t.amount, 0)
    };
  },

  getLastScored() {
    const g = State.data.games[0];
    if (!g || !g.gross) return -1;
    let last = -1;
    for (let h = 0; h < 18; h++) {
      for (const p of State.data.players) {
        const v = g.gross[p.id] && g.gross[p.id][h];
        if (v != null && v !== '') { last = h; break; }
      }
    }
    return last;
  }
};

// === DOM HELPER ===
const h = (tag, attrs = {}, children = []) => {
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.setAttribute('style', v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v ?? '';
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'disabled') el.disabled = !!v;
    else if (k === 'selected') el.selected = !!v;
    else el.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(ch => {
    if (ch == null) return;
    el.appendChild(typeof ch === 'string' ? document.createTextNode(ch) : ch);
  });
  return el;
};

// === WIZARD ===
const Wizard = {
  active: false,
  step: 'splash', // splash, course, players, game, done
  data: {
    players: [{name:'', handicap:0}, {name:'', handicap:0}],
    selectedCourse: null,
    games: []
  },
  currentGameIndex: 0,

  start() {
    this.active = true;
    this.step = 'splash';
    this.data = {
      players: [{name:'', handicap:0}, {name:'', handicap:0}],
      selectedCourse: null,
      games: [],
      startingHole: 0
    };
    this.currentGameIndex = 0;
    this.data.games.push(this.createGameData());
    this.render();
    // Auto-advance from splash with curtain-raise transition
    const advanceSplash = () => {
      if (this.step !== 'splash') return;
      const splash = document.querySelector('.wizard-splash');
      if (splash) {
        splash.classList.add('curtain-up');
        setTimeout(() => {
          this.step = NEW_WIZARD ? 'signin' : 'course';
          // The sign-in button opens a popup, which needs a live tap and cannot
          // wait on a 470KB download (doc 17), so the SDK has to already be on
          // its way by the time the curtain finishes.
          if (NEW_WIZARD) Cloud.warm();
          splash.remove();
          // Reset course content positioning
          const overlay = document.getElementById('wizardOverlay');
          if (overlay) {
            const courseEl = overlay.querySelector('.wizard-screen');
            if (courseEl) { courseEl.style.position = ''; courseEl.style.inset = ''; courseEl.style.zIndex = ''; }
          }
        }, 1400);
      } else {
        this.step = NEW_WIZARD ? 'signin' : 'course';
        if (NEW_WIZARD) Cloud.warm();
        this.render();
      }
    };
    this._splashTimer = setTimeout(advanceSplash, 8500);
    setTimeout(() => {
      const splash = document.querySelector('.wizard-splash');
      if (splash) splash.addEventListener('click', () => {
        clearTimeout(this._splashTimer);
        advanceSplash();
      }, {once: true});
    }, 0);
  },

  getCurrentGame() {
    return this.data.games[this.currentGameIndex];
  },

  switchToGame(index) {
    if (index >= 0 && index < this.data.games.length) {
      this.currentGameIndex = index;
      this.render();
    }
  },

  addNewGame() {
    const lastGame = this.getCurrentGame();
    const newGame = this.createGameData();
    // Copy team assignments from last game
    newGame.teamA = [...lastGame.teamA];
    newGame.teamB = [...lastGame.teamB];
    this.data.games.push(newGame);
    this.currentGameIndex = this.data.games.length - 1;
    this.render();
  },

  deleteGame(index) {
    if (this.data.games.length <= 1) return;
    this.data.games.splice(index, 1);
    if (this.currentGameIndex >= this.data.games.length) {
      this.currentGameIndex = this.data.games.length - 1;
    }
    this.render();
  },

  /**
   * Fill in the teams the way the first tee would.
   *
   * This used to pair the first two players entered against the next two, which
   * is the one arrangement this group never uses — it puts the two best players
   * together. Game.suggestTeams() pairs lowest with highest instead.
   *
   * With FIVE it proposes three matches, which is the format rather than a
   * convenience: the low/high pair plays each of the other three pairs, so
   * nobody sits out and nobody spends the round against the same partner. Three
   * matches means three games, sharing the stakes.
   *
   * Only ever fills in BLANK teams. Someone who has already arranged the sides
   * has said what they want, and coming back through this screen must not undo
   * it.
   */
  proposeTeams(validPlayers) {
    // The first TEAM game, not games[0]. With Skins or Wolf in the round the
    // team game is not first, and arranging sides on a Skins game leaves the
    // Nassau with nobody on either side — which is what happened the moment a
    // test turned Nassau off and back on with Skins already on.
    const teamGames = this.data.games.filter((g) => g.gameType === 'nassau' || g.gameType === 'vegas');
    const first = teamGames[0];
    if (!first) return;
    const assigned = teamGames.some((g) => (g.teamA || []).length || (g.teamB || []).length);
    if (assigned) return;

    const ids = validPlayers.map((p, i) => ({ id: 'p' + (i + 1), name: p.name, handicap: p.handicap || 0 }));
    const matches = Game.suggestTeams(ids);

    if (!matches.length) {
      // Three players, or two: no two-man teams to propose. Keep the old
      // behaviour rather than leaving the sides empty.
      const pids = ids.map((p) => p.id);
      first.teamA = pids[0] ? [pids[0]] : [];
      first.teamB = pids[1] ? [pids[1]] : [];
      return;
    }

    first.teamA = matches[0].teamA.slice();
    first.teamB = matches[0].teamB.slice();

    // The second and third matches of a five-man round. Nassau only: the other
    // game types are not played as a set of two-man matches.
    // Counted against the TEAM games, not every game: a round that also has
    // Skins in it still wants all three Nassau matches.
    if (first.gameType === 'nassau' && matches.length > 1 && teamGames.length === 1) {
      matches.slice(1).forEach((m) => {
        const g = this.createGameData();
        g.gameType = 'nassau';
        g.teamA = m.teamA.slice();
        g.teamB = m.teamB.slice();
        g.stakes = { ...first.stakes };
        g.junkValue = { ...first.junkValue };
        g.withJunk = first.withJunk;
        g.autoPress = { ...first.autoPress };
        g.handicapMode = first.handicapMode;
        this.data.games.push(g);
      });
    }
    this.currentGameIndex = 0;
  },

  createGameData() {
    return {
      gameType: 'nassau',
      teamA: [],
      teamB: [],
      withJunk: true,
      // Team delta is how this group plays Nassau: the higher side's total
      // handicap minus the lower side's, given to that team's highest man. It
      // was 'full' here while every real round was set up as team delta by
      // hand, which is a default that makes work rather than saving it.
      handicapMode: 'team_delta', // full, off_low, team_delta
      stakes: {front:2, back:5, overall:2},
      junkValue: {front:1, back:2},
      pointValue: {front:1, back:1},
      autoPress: {front:true, back:true, overall:false}
    };
  },

  skip() {
    // Apply wizard player data if State has no players (e.g. after Start New Game cleared them)
    const wizardPlayers = this.data.players.filter(p => p.name.trim());
    if (State.data.players.length === 0 && wizardPlayers.length > 0) {
      State.data.players = wizardPlayers.map((p, i) => ({
        id: 'p' + (i+1),
        name: p.name.trim(),
        handicap: p.handicap || 0
      }));
    }
    this.active = false;
    this.removeOverlay();
    State.data.tab = 'setup';
    State.scheduleSave();
    State.scheduleRender();
  },

  finish() {
    // Apply wizard data to State
    // Players (preserve handicaps for advanced settings recalculation)
    State.data.players = this.data.players.filter(p => p.name.trim()).map((p, i) => ({
      id: 'p' + (i+1),
      name: p.name.trim(),
      handicap: p.handicap || 0
    }));

    // Course (if new one was selected/created, it's already in State.data.course)

    // Games
    State.data.games = this.data.games.map((wg, idx) => {
      const g = Game.create();
      g.gameType = wg.gameType;
      g.teamA = wg.teamA;
      g.teamB = wg.teamB;
      g.stakes = {...wg.stakes};
      g.withJunk = wg.withJunk;
      g.junkValue = wg.withJunk ? {...wg.junkValue} : {front:0, back:0};
      g.pointValue = {...wg.pointValue};
      g.autoPress = {...wg.autoPress};
      // Skins-specific
      g.skinsMode = wg.skinsMode || 'net';
      g.skinsPlayers = wg.skinsPlayers || [];
      // Wolf-specific
      g.wolfPlayers = wg.wolfPlayers || [];
      g.wolfTeeOrder = (wg.wolfTeeOrder || []).length ? [...wg.wolfTeeOrder] : [...(wg.wolfPlayers || [])];
      g.wolfPointValue = wg.wolfPointValue || 1;
      // 9-Point-specific
      g.ninePointPlayers = wg.ninePointPlayers || [];
      g.ninePointMode = wg.ninePointMode || 'net';
      g.ninePointValue = wg.ninePointValue || 1;
      g.ninePointWinBy2 = wg.ninePointWinBy2 !== false;
      g.ninePointBirdieDouble = wg.ninePointBirdieDouble === true;
      g.vegasBirdieDouble = wg.vegasBirdieDouble === true;
      g.handicapMode = wg.handicapMode || 'full';

      // Apply handicap strokes based on mode
      Game.applyHandicapMode(g);

      return Game.sanitize(g);
    });

    this.active = false;
    this.removeOverlay();
    State.data.tab = 'scores';

    // A new game is a new round, and every per-round tracker has to go with it.
    // "New Round" in the menu already cleared these before opening the wizard,
    // but "Start New Game" does not — and finish() is the moment play actually
    // begins, so it is the right place to guarantee it either way.
    //
    //   scoringHole   — left at 17, the new game opens on hole 18.
    //   _scoredHoles  — the one that costs money. Holes are auto-populated to
    //                   par for display, and this is what separates "shown as
    //                   par" from "the player actually made par". Carried over,
    //                   a brand-new round settles all 18 holes of nobody's
    //                   scores the instant it opens.
    //   _clearedHoles — suppresses the auto-par fill on a hole deliberately
    //                   blanked last round.
    State.data.scoringHole = 0;
    State.data._scoredHoles = {};
    State.data._clearedHoles = {};
    State.data.roundCompleteShown = false;
    State.data.pressWizardShown = false;
    State.scheduleSave();
    State.scheduleRender();
    Err.toast('Game ready! Enter scores.');
    // Analytics
    const gameTypes = State.data.games.map(g => g.gameType);
    const features = [];
    if (State.data.games.some(g => g.withJunk)) features.push('junk');
    if (State.data.games.some(g => g.autoPress && (g.autoPress.front || g.autoPress.back || g.autoPress.overall))) features.push('auto_press');
    gtag('event', 'round_started', {
      player_count: State.data.players.length,
      game_count: State.data.games.length,
      game_types: gameTypes.join(','),
      course: State.data.course.name || 'custom',
      features: features.join(',') || 'none'
    });
    // Refresh weather for the selected course
    if (window._updateWeather) window._updateWeather();
  },

  removeOverlay() {
    const overlay = document.getElementById('wizardOverlay');
    if (overlay) overlay.remove();
    document.body.classList.remove('splashing');
    document.body.style.background = '';
  },

          <button type="button" class="wolf-order-btn" data-wolf-move="down" data-wolf-pid="${pid}" ${isLast?'disabled':''} style="padding:4px 10px;font-size:16px;border:1px solid var(--border);border-radius:4px;background:${isLast?'var(--muted)':'var(--card)'};cursor:${isLast?'default':'pointer'};">▼</button>

      }).join('');

      // Re-attach tee order button handlers
      teeList.querySelectorAll('.wolf-order-btn').forEach(btn => {
        btn.onclick = (e) => {

            [currentOrder[idx-1], currentOrder[idx]] = [currentOrder[idx], currentOrder[idx-1]];
          } else if (dir === 'down' && idx < currentOrder.length - 1) {
            [currentOrder[idx], currentOrder[idx+1]] = [currentOrder[idx+1], currentOrder[idx]];
          }
          g.wolfTeeOrder = currentOrder;
          State.scheduleSave();
          this.updateWolfUI();
        };
      });
    }

      case 'games': content = this.renderGames(); break;
      case 'teams': content = this.renderTeams(); break;
      case 'stakes': content = this.renderStakes(); break;

      case 'game': content = this.renderGame(); break;

    if (this.step === 'splash') {

      }
      for (let i = 0; i < 12; i++) {
        particles.push({ x:Math.random()*canvas.offsetWidth, y:Math.random()*canvas.offsetHeight, r:Math.random()*12+8, vx:(Math.random()-0.5)*0.12, vy:(Math.random()-0.5)*0.08-0.06, alpha:Math.random()*0.1+0.04, pulse:Math.random()*Math.PI*2, pulseSpeed:0.006+Math.random()*0.008, isOrb:true, color:pickColor() });
      }

      const colorMap = { green:'#16a34a', yellow:'#ffdd00', white:null };
      let animId;
      const draw = () => {
        const w = canvas.offsetWidth, h = canvas.offsetHeight;
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.pulse += p.pulseSpeed;
          if (p.x < -20) p.x = w + 20; if (p.x > w + 20) p.x = -20;
          if (p.y < -20) p.y = h + 20; if (p.y > h + 20) p.y = -20;
          const a = p.alpha * (0.5 + 0.5 * Math.sin(p.pulse));
          let fillColor;
          if (p.color === 'white') fillColor = `rgba(255,255,255,${p.isOrb ? a*0.5 : a*0.8})`;
          else fillColor = colorMap[p.color];
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = fillColor;
          ctx.globalAlpha = p.color === 'white' ? 1 : a;
          ctx.shadowBlur = p.isOrb ? p.r * 4 : p.r * 6;
          ctx.shadowColor = fillColor;
          ctx.fill(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        });
        animId = requestAnimationFrame(draw);
      };
      draw();

      // Cleanup when splash is removed
      const observer = new MutationObserver(() => {
        if (!document.contains(canvas)) {
          cancelAnimationFrame(animId);
          observer.disconnect();
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});
    });

    return div;
  },

  /**
   * Point the course at a named course's tees, keeping the current tee if that
   * course also has one by that name.
   */
  setCourseTees(courseName) {
    const tees = Game.teesFor(courseName);
    State.data.course.tees = tees;
    const keep = tees.filter((t) => t.name === State.data.course.teeName)[0];
    State.data.course.teeName = keep ? keep.name
      : (tees.filter((t) => t.name === BB_DEFAULT_COURSE.teeName)[0] || tees[0] || {}).name || null;
  },

  /**
   * The tee row: which tee, at which course.
   *
   * IT NAMES THE COURSE, and the caller says which course that is. On the
   * course screen the answer is the card you just tapped — `selectedCourse` —
   * and NOT `State.data.course.name`, which still holds the previous round's
   * course until Next commits the choice. Reading the committed name there put
   * the wrong course's name on the panel: tap Ancil Hoffman and it answered
   * "No ratings on file for El Macero", naming the course you had just moved
   * away from. Tees and ratings are per course, so a panel that shows a slope
   * without saying whose it is can only be read off the nearest thing on
   * screen — which, in a list of thirty courses, is whatever you scrolled to.
   */
  teeStrip(opts) {
    const o = opts || {};
    const name = o.courseName || State.data.course.name;
    const tees = (State.data.course.tees) || [];
    const esc = (t) => String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const head = '<div class="wiz-tee-course">' + esc(name) + '</div>';
    if (!tees.length) {
      return '<div class="wiz-tee">' + head + '<div class="wiz-tee-msg">No ratings on file, ' +
        'so handicaps stay as you type them.</div></div>';
    }
    const cur = Game.selectedTee(State.data.course);
    return '<div class="wiz-tee">' + head +
      '<div class="wiz-tee-row"><span class="wiz-tee-label">Tees</span>' +
      '<select id="wizardTee" class="wiz-tee-pick">' +
      tees.map((t) => '<option value="' + esc(t.name) + '"' +
        (cur && t.name === cur.name ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') +
      '</select></div>' +
      (cur ? '<div class="wiz-tee-msg">' + esc(cur.yardage) + ' yds \u00b7 ' +
        esc(cur.rating) + ' / ' + esc(cur.slope) +
        // Only promise the conversion when it can actually happen. It needs a
        // GHIN index, which needs the group pool, which needs a signed-in
        // account — so on a build with accounts dark this line was describing
        // something the app was not doing. A caption that overstates is the same
        // failure as a number that is quietly wrong, just cheaper to fix.
        (this.canDeriveHandicaps()
          ? ' \u2014 course handicaps come off this tee.'
          : ' \u2014 recorded with the round. Handicaps stay as you type them.') +
        '</div>' : '') +
      '</div>';
  },

  /**
   * Can a handicap actually be derived from the tee right now?
   *
   * Needs a rated tee AND at least one golfer with a GHIN index to convert,
   * which in turn needs a signed-in account and a group. Any of those missing
   * and the tee is a note on the round rather than an input to anybody's
   * strokes.
   */
  canDeriveHandicaps() {
    if (!Game.selectedTee(State.data.course)) return false;
    if (typeof CLOUD_ENABLED === 'undefined' || !CLOUD_ENABLED || !Cloud.user) return false;
    return Cloud.pool.some((g) => Game.parseIndex(g.currentIndex) != null);
  },

  /**
   * Re-derive the handicaps that came from a tee, and leave alone the ones that
   * did not.
   *
   * `hcpFromTee` is set when this filled the box and cleared the moment anybody
   * types in it. Reverting a number somebody entered by hand — because they
   * know something the index does not — would be the same quiet wrongness as
   * every other bug this week.
   */
  retee(opts) {
    const tee = Game.selectedTee(State.data.course);
    this.data.players.forEach((p) => {
      // Recompute from the index STORED ON THE PLAYER, not by looking the man up
      // in the pool again. The pool is cloud state: it is empty while the SDK is
      // still loading, and it empties again on any sign-out. Re-deriving from it
      // means changing tees in the wrong half-second silently does nothing —
      // no error, just handicaps that stayed on the old tee.
      if (!p.hcpFromTee || p.index == null) return;
      const ch = Game.courseHandicap(p.index, tee);
      if (ch != null) p.handicap = ch;
    });
    if (!opts || opts.repaint !== false) this.render();
  },

  /**
   * Names offered by the picker: the group pool first, then anyone this phone
   * has played with who is not in it.
   *
   * Merged rather than replaced. A guest is a first-class part of a round and
   * will never be a group member, so dropping the local list would make the
   * regular visitor harder to add than he is today.
   */
  pickerRoster() {
    const local = (() => {
      try { return JSON.parse(localStorage.getItem('bunchbets_roster') || '[]'); }
      catch (e) { return []; }
    })();
    const norm = (t) => String(t || '').toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
    const hcpOf = {};
    local.forEach((r) => { hcpOf[norm(r.name)] = r.handicap; });

    /**
     * What we last played this man off.
     *
     * Rounds are the honest source, not the hand-kept "My Players" list: they
     * are written every time anybody plays, they carry the number that was
     * actually used, and nobody has to maintain them.
     *
     * Matched through the golfer's ALIASES as well as his name, because the
     * card says "Bunch" and the roster says "Brian Bunch" — the same mismatch
     * that filed four rounds against guests. Looking up only by full name finds
     * nothing and quietly returns no handicap at all, which is what it did.
     */
    const lastPlayedOff = (g) => {
      const names = {};
      names[norm(g.name)] = 1;
      (g.aliases || []).forEach((a) => { const k = norm(a); if (k) names[k] = 1; });
      let rounds = [];
      try { rounds = History.load(); } catch (e) {}   // newest first
      for (const r of rounds) {
        for (const p of (r.players || [])) {
          if (names[norm(p.name)] && p.handicap != null) return p.handicap;
        }
      }
      for (const k of Object.keys(names)) if (hcpOf[k] != null) return hcpOf[k];
      return undefined;
    };

    /**
     * The number to put in the box: the course handicap for the tee being
     * played, and only that.
     *
     * This is the conversion that was missing. A GHIN index is not a course
     * handicap — Gary is a 10.4 who plays off 12 — so filling the box with the
     * raw index puts everyone 1-2 strokes light with nothing on screen to say
     * so. With a rated tee the conversion is exact and the guessing is over.
     *
     * Without one (a course with no rating on file) it still refuses to invent a
     * number, and falls back to whatever this group last played the man off.
     * That is a fact rather than a derivation, and it is the honest second-best.
     */
    const tee = Game.selectedTee(State.data.course);
    const handicapFor = (g) => {
      const ch = Game.courseHandicap(g.currentIndex, tee);
      return ch == null ? lastPlayedOff(g) : ch;
    };

    const out = [], seen = {};
    if (typeof CLOUD_ENABLED !== 'undefined' && CLOUD_ENABLED && Cloud.user) {
      Cloud.pool.forEach((g) => {
        const k = norm(g.name);
        if (!k || seen[k]) return;
        seen[k] = 1;
        (g.aliases || []).forEach((a) => { const ak = norm(a); if (ak) seen[ak] = 1; });
        const ch = Game.courseHandicap(g.currentIndex, tee);
        out.push({ name: g.name, index: g.currentIndex || null,
                   handicap: ch == null ? lastPlayedOff(g) : ch, fromTee: ch != null });
      });
    }
    // Sorted, because Cloud.pool arrives in Firestore's document order — which
    // is neither the order anybody added them nor any order a human can hold in
    // their head. With eighteen names it reads as random, and finding a man
    // means scanning the whole list every time.
    //
    // Sorted WITHIN the two blocks, not across them: the group still comes
    // first and guests still come after. Merging them would bury a group member
    // among one-off visitors, and the group is who is nearly always playing.
    const byName = (a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' });
    out.sort(byName);

    const guests = [];
    local.forEach((r) => {
      const k = norm(r.name);
      if (!k || seen[k]) return;
      seen[k] = 1;
      guests.push({ name: r.name, index: null, handicap: r.handicap || 0 });
    });
    guests.sort(byName);
    return out.concat(guests);
  },

  /**
   * Sign-in, in the one screen that needs it.
   *
   * It used to live only in the pancake menu, which is three taps away from
   * here and no part of setting up a round. This is not a gate — signed out,
   * the step behaves exactly as it always has.
   */
  cloudStrip() {
    if (typeof CLOUD_ENABLED === 'undefined' || !CLOUD_ENABLED) return '';
    const esc = (t) => String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    if (!Cloud.user) {
      const ready = !!Cloud.api;
      return '<div class="wiz-cloud"><div class="wiz-cloud-msg">' +
        'Sign in to load your group\u2019s golfers and their current GHIN indexes.' +
        '</div><button class="wiz-cloud-btn" id="wizardSignIn"' +
        (ready && !Cloud.busy ? '' : ' disabled') + '>' +
        (Cloud.busy ? 'Waiting for Google\u2026' : ready ? 'Sign in with Google' : 'Preparing\u2026') +
        '</button></div>';
    }
    if (!Cloud.groups.length) {
      return '<div class="wiz-cloud"><div class="wiz-cloud-msg">Signed in as ' +
        esc(Cloud.user.email || '') + '. You are not in a group yet, so only names from this phone are offered.</div></div>';
    }
    const n = Cloud.pool.length;
    return '<div class="wiz-cloud"><div class="wiz-cloud-msg">' +
      (n ? esc(Cloud.groups[0].name) + ' \u2014 ' + n + ' golfer(s) available, with live indexes. Tap a name box to pick one.'
         : 'Loading ' + esc(Cloud.groups[0].name) + '\u2026') +
      '</div></div>';
  },

  /**
   * Re-render the player step when the cloud state behind it changes, and only
   * then. Cloud.render() fires on every profile refresh; rebuilding this screen
   * each time would throw away whatever is half-typed in a name box.
   */
  syncCloud() {
    if (!this.active || (this.step !== 'players' && this.step !== 'signin')) return;
    const sig = (typeof CLOUD_ENABLED !== 'undefined' && CLOUD_ENABLED)
      ? [!!Cloud.user, Cloud.groups.length, Cloud.pool.length, Cloud.busy, !!Cloud.api].join('|') : '';
    if (sig === this._cloudSig) return;
    this._cloudSig = sig;
    this.render();
  },

  // ═══════════════════════════════════════════════════════
  // THE REDESIGNED FLOW (beta) — see NEW_WIZARD
  // ═══════════════════════════════════════════════════════

  /** Shared chrome so the seven screens cannot drift apart. */
  wizStep(n) {
    const total = 6;   // signin isn't counted; it is not part of setting up a round
    let bars = '';
    for (let i = 1; i <= total; i++) {
      bars += '<div style="flex:1;height:3px;border-radius:2px;background:' +
        (i <= n ? 'var(--acc)' : 'var(--border)') + ';"></div>';
    }
    return '<div style="display:flex;gap:6px;padding:4px 16px 0;">' + bars + '</div>';
  },

  wizHead(title, sub) {
    const esc = (t) => String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<div class="wizard-header"><h2>' + esc(title) + '</h2>' +
      (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
  },

  wizFoot(nextLabel, opts) {
    const o = opts || {};
    return '<div class="wizard-footer">' +
      (o.back === false ? '' : '<button class="btn secondary" id="wizBack">Back</button>') +
      '<button class="btn primary" id="wizNext">' + nextLabel + '</button>' +
      (o.extra || '') + '</div>';
  },

  /** 1 — sign in. Offered, never required. */
  renderSignIn() {
    const div = document.createElement('div');
    div.className = 'wizard-screen';
    const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    // Warm only when this screen is actually the live step. It is also rendered
    // BEHIND the splash so the curtain has something to reveal, and warming from
    // there fetches the auth SDK on every launch — breaking the promise that a
    // launch costs nothing for someone who never signs in. The splash advance
    // warms instead, which is ~1.4s before the button can be pressed.
    if (this.step === 'signin') Cloud.warm();
    this._cloudSig = [!!Cloud.user, Cloud.groups.length, Cloud.pool.length, Cloud.busy, !!Cloud.api].join('|');

    const signedIn = CLOUD_ENABLED && Cloud.user;
    const body = signedIn
      ? '<div class="card"><div style="font-weight:700;font-size:15px;">' +
        esc(Cloud.user.displayName || Cloud.user.email || 'Signed in') + '</div>' +
        '<div class="muted" style="font-size:12px;margin-top:3px;">' + esc(Cloud.user.email || '') + '</div>' +
        (Cloud.groups.length
          ? '<div class="muted" style="font-size:12px;margin-top:8px;">' + esc(Cloud.groups[0].name) +
            ' \u00b7 ' + Cloud.pool.length + ' golfer(s), with live indexes</div>'
          : '<div class="muted" style="font-size:12px;margin-top:8px;">Not in a group yet.</div>') +
        '</div>'
      : '<div class="card"><div class="muted" style="font-size:13px;line-height:1.5;">' +
        'Sign in and your group\u2019s golfers come with you \u2014 current GHIN indexes, rounds saved off this phone, and season standings.' +
        '</div>' +
        (CLOUD_ENABLED
          ? '<button class="btn primary" id="wizSignIn" style="width:100%;margin-top:12px;padding:12px;"' +
            (Cloud.api && !Cloud.busy ? '' : ' disabled') + '>' +
            (Cloud.busy ? 'Waiting for Google\u2026' : Cloud.api ? 'Continue with Google' : 'Preparing\u2026') +
            '</button>'
          : '<div class="note" style="margin-top:10px;">Accounts are not switched on in this build.</div>') +
        '</div>';

    div.innerHTML = this.wizStep(0) +
      this.wizHead("Who's keeping score?", signedIn ? 'You\u2019re all set.' : 'Optional \u2014 scoring works either way.') +
      '<div class="wizard-content">' + body +
      '<div class="note" style="text-align:center;margin-top:16px;">' +
      (signedIn ? '' : 'Skip this and everything stays on this phone.') + '</div></div>' +
      this.wizFoot(signedIn ? 'Next' : 'Continue without an account', { back: false });

    setTimeout(() => {
      const si = div.querySelector('#wizSignIn');
      if (si) si.onclick = () => Cloud.signIn();          // synchronous: the popup needs the tap
      div.querySelector('#wizNext').onclick = () => { this.step = 'course'; this.render(); };
    }, 0);
    return div;
  },

  /** 4 — what are we playing. */
  renderGames() {
    const div = document.createElement('div');
    div.className = 'wizard-screen';
    const TYPES = [
      ['nassau', 'Nassau', 'Front, back, overall \u00b7 team delta'],
      ['skins', 'Skins', 'Every man for himself, carries over'],
      ['vegas', 'Vegas', 'Two-man, scores side by side'],
      ['wolf', 'Wolf', 'Pick a partner off the tee, or go alone'],
      ['ninepoint', '9-Point', 'Three-ball, nine points a hole'],
    ];
    const on = (t) => this.data.games.some((g) => g.gameType === t);
    const row = ([t, name, blurb]) =>
      '<div class="wizard-option' + (on(t) ? ' selected' : '') + '" data-type="' + t + '">' +
      '<div style="flex:1;min-width:0;"><div style="font-size:16px;font-weight:700;">' + name + '</div>' +
      '<div class="muted" style="font-size:12px;margin-top:2px;">' + blurb + '</div></div>' +
      '<div style="width:50px;height:30px;border-radius:999px;flex:0 0 auto;display:flex;align-items:center;' +
      'padding:0 3px;box-sizing:border-box;background:' + (on(t) ? 'var(--acc)' : 'var(--border)') +
      ';justify-content:' + (on(t) ? 'flex-end' : 'flex-start') + ';">' +
      '<div style="width:24px;height:24px;border-radius:50%;background:' + (on(t) ? '#fff' : 'var(--muted)') + ';"></div></div></div>';

    div.innerHTML = this.wizStep(3) +
      this.wizHead('What are we playing?', 'Nassau is on. Add anything else you fancy.') +
      '<div class="wizard-content">' + TYPES.map(row).join('') +
      '<div class="note" style="margin-top:12px;line-height:1.5;">Nothing here is remembered against you \u2014 change it any week.</div>' +
      '</div>' + this.wizFoot('Next');

    setTimeout(() => {
      div.querySelectorAll('.wizard-option').forEach((el) => {
        el.onclick = () => { this.toggleGameType(el.dataset.type); this.render(); };
      });
      div.querySelector('#wizBack').onclick = () => { this.step = 'players'; this.render(); };
      div.querySelector('#wizNext').onclick = () => {
        if (!this.data.games.length) { Err.toast('Pick at least one game'); return; }
        this.step = this.hasTeamGame() ? 'teams' : 'stakes';
        this.render();
      };
    }, 0);
    return div;
  },

  hasTeamGame() {
    return this.data.games.some((g) => g.gameType === 'nassau' || g.gameType === 'vegas');
  },

  /**
   * Add or remove a game type.
   *
   * Removing the LAST team game clears the proposed teams too, so that turning
   * Nassau off and on again re-proposes from the current players rather than
   * leaving sides arranged for a lineup that has since changed.
   */
  toggleGameType(type) {
    const has = this.data.games.filter((g) => g.gameType === type);
    if (has.length) {
      this.data.games = this.data.games.filter((g) => g.gameType !== type);
    } else {
      const g = this.createGameData();
      g.gameType = type;
      const ids = this.data.players.filter((p) => String(p.name || '').trim()).map((p, i) => 'p' + (i + 1));
      // Individual games default to everyone in the round, which is what a
      // four-ball almost always wants and is one less screen to walk.
      if (type === 'skins') g.skinsPlayers = ids;
      if (type === 'wolf') { g.wolfPlayers = ids.slice(0, 5); g.wolfTeeOrder = ids.slice(0, 5); }
      if (type === 'ninepoint') g.ninePointPlayers = ids.slice(0, 3);
      this.data.games.push(g);
    }
    if (this.hasTeamGame()) this.proposeTeams(this.data.players.filter((p) => String(p.name || '').trim()));
    this.currentGameIndex = 0;
  },

  /** 5 — teams. */
  renderTeams() {
    const div = document.createElement('div');
    div.className = 'wizard-screen';
    const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const team = this.data.games.filter((g) => g.gameType === 'nassau' || g.gameType === 'vegas');
    const nameOf = (pid) => {
      const i = parseInt(String(pid).replace('p', ''), 10) - 1;
      const p = this.data.players[i];
      return p ? p.name : pid;
    };
    const hcpOf = (pid) => {
      const i = parseInt(String(pid).replace('p', ''), 10) - 1;
      const p = this.data.players[i];
      return p ? (p.handicap || 0) : 0;
    };
    // Tinted, not filled: a solid green and red block per side was loud, and at
    // that size three matches ran off the screen. The sides sit next to each
    // other so all three fit without scrolling.
    const side = (ids, label, colour) =>
      '<div style="min-width:0;align-self:stretch;padding:7px 8px;border-radius:8px;border-left:3px solid ' + colour +
      ';background:color-mix(in srgb, ' + colour + ' 12%, transparent);">' +
      '<div style="font-size:10px;color:' + colour + ';text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:2px;">' +
      label + '</div>' +
      ids.map((pid) => '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;">' +
        '<div style="font-size:14px;font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere;">' + esc(nameOf(pid)) + '</div>' +
        '<div class="muted" style="font-size:12px;font-variant-numeric:tabular-nums;">' + hcpOf(pid) + '</div></div>').join('') +
      '</div>';

    const matches = team.map((g, i) => {
      const a = (g.teamA || []).reduce((t, pid) => t + hcpOf(pid), 0);
      const b = (g.teamB || []).reduce((t, pid) => t + hcpOf(pid), 0);
      const d = a - b;
      const strokes = d === 0 ? 'no strokes'
        : (d > 0 ? esc(nameOf((g.teamA || [])[0])) + '\u2019s side gives ' + d
                 : esc(nameOf((g.teamB || [])[0])) + '\u2019s side gives ' + (-d));
      return '<div class="card" style="margin-bottom:8px;padding:9px 10px;">' +
        (team.length > 1 ? '<div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:5px;">Match ' + (i + 1) + '</div>' : '') +
        '<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;">' +
        side(g.teamA || [], 'Team A', 'var(--success)') +
        '<div style="font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;">VS</div>' +
        side(g.teamB || [], 'Team B', 'var(--danger)') +
        '</div>' +
        '<div class="muted" style="font-size:11.5px;margin-top:6px;">' + a + ' v ' + b + ' \u00b7 ' + strokes + '</div>' +
        '</div>';
    }).join('');

    div.innerHTML = this.wizStep(4) +
      this.wizHead(team.length > 1 ? 'Three matches' : 'Teams?',
        team.length > 1 ? 'The pair plays each of the other three.' : 'Low and high together, the way you always do it.') +
      '<div class="wizard-content">' + matches +
      '<button class="wizard-add-btn" id="wizPickTeams">Pick teams myself</button>' +
      '<div class="note" style="margin-top:12px;line-height:1.5;">Lowest handicap with highest. With four that is the only pairing that balances.</div>' +
      '</div>' + this.wizFoot('Next');

    setTimeout(() => {
      div.querySelector('#wizPickTeams').onclick = () => { this.step = 'game'; this.render(); };
      div.querySelector('#wizBack').onclick = () => { this.step = 'games'; this.render(); };
      div.querySelector('#wizNext').onclick = () => { this.step = 'stakes'; this.render(); };
    }, 0);
    return div;
  },

  /** 6 — money. */
  renderStakes() {
    const div = document.createElement('div');
    div.className = 'wizard-screen';
    const g = this.data.games[0] || this.createGameData();
    const nassau = this.data.games.filter((x) => x.gameType === 'nassau')[0];
    const money = (id, label, val) =>
      '<div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;">' +
      label + '</div><input type="tel" inputmode="numeric" id="' + id + '" value="' + val +
      '" style="text-align:center;font-size:19px;font-weight:700;"></div>';

    const nassauCard = nassau ? '<div class="card" style="margin-bottom:10px;">' +
      '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Nassau</div>' +
      '<div class="grid grid-3">' +
      money('wizFront', 'Front', nassau.stakes.front) +
      money('wizBack', 'Back', nassau.stakes.back) +
      money('wizOverall', 'Overall', nassau.stakes.overall) +
      '</div>' +

        ? '<div class="note" style="margin-top:10px;">Applied to all three matches.</div>' : '') +

    const junkCard = '<div class="card">' +
      '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;">' +

      '<span style="font-weight:700;font-size:15px;">Junk &amp; KP</span></label>' +

      '<div class="grid grid-2">' +

      money('wizJunkBack', 'Back $/pt', g.junkValue.back) +

          }
          x.withJunk = div.querySelector('#wizJunk').checked;
          x.junkValue = x.withJunk ? { front: num('wizJunkFront'), back: num('wizJunkBack') } : { front: 0, back: 0 };
        });

      div.querySelector('#wizNext').onclick = () => { apply(); this.step = 'review'; this.render(); };
    }, 0);
    return div;
  },

  /** 7 — review. Every line taps back to where it was set. */
  renderReview() {
    const div = document.createElement('div');
    div.className = 'wizard-screen';
    const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const players = this.data.players.filter((p) => String(p.name || '').trim());
    const tee = Game.selectedTee(State.data.course);
    const nassau = this.data.games.filter((x) => x.gameType === 'nassau')[0];
    const nameOf = (pid) => {
      const i = parseInt(String(pid).replace('p', ''), 10) - 1;
      return players[i] ? players[i].name : pid;
    };

    const row = (step, title, detail) =>
      '<div class="wizard-course-card" data-step="' + step + '" style="margin-bottom:8px;">' +
      '<div class="course-head"><h3>' + title + '</h3>' +
      '<span class="muted" style="font-size:18px;">\u203A</span></div>' +
      '<p>' + detail + '</p></div>';

    const teamLine = this.data.games.filter((x) => x.gameType === 'nassau' || x.gameType === 'vegas')
      .map((x) => (x.teamA || []).map(nameOf).join(' + ') + ' vs ' + (x.teamB || []).map(nameOf).join(' + '))
      .join('<br>');

    div.innerHTML = this.wizStep(6) +

        (tee ? esc(tee.rating) + ' / ' + esc(tee.slope) + ' \u00b7 ' : '') +
        'starting on ' + ((State.data.startingHole || 0) + 1)) +
      row('players', players.length + ' playing',
        esc(players.map((p) => p.name.split(' ')[0] + ' ' + (p.handicap || 0)).join(' \u00b7 '))) +
      // History owns the pretty names for game types; Wizard does not have a
      // gameLabel of its own, and the guarded call that looked like it did was
      // quietly falling through to the raw type string.
      row('games', this.data.games.map((x) => History.gameLabel(x.gameType))
        .filter((v, i, a) => a.indexOf(v) === i).join(', ') || 'No games',
        teamLine || 'Individual') +
      (nassau ? row('stakes', '$' + nassau.stakes.front + ' / $' + nassau.stakes.back + ' / $' + nassau.stakes.overall,

      '</div>' +

      div.querySelector('#wizBack').onclick = () => { this.step = 'stakes'; this.render(); };
      div.querySelector('#wizPlay').onclick = () => this.finish();
    }, 0);
