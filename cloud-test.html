<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB cloud harness</title>
</head>
<body>
<pre id="out">loading…</pre>
<!--
  Test harness for js/cloud.js. Not part of the app: nothing links here, and the
  service worker skips this path. Loads the Firebase SDK from gstatic by default;
  the emulator test suite passes ?sdk=/vendor to use local copies, because the
  CI sandbox cannot reach a CDN.
-->
<script type="module">
const params = new URLSearchParams(location.search);
const SDK = params.get('sdk') || 'https://www.gstatic.com/firebasejs/9.22.0';
const load = (src) => new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = src; s.onload = res; s.onerror = () => rej(new Error('failed: ' + src));
  document.head.appendChild(s);
});

const out = document.getElementById('out');
try {
  for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) {
    await load(`${SDK}/${f}`);
  }
  const { default: cloud } = await import('./js/cloud.js');
  const emulator = params.has('emulator')
    ? { authUrl: 'http://127.0.0.1:9099', firestoreHost: '127.0.0.1', firestorePort: 8181 }
    : null;
  cloud.init(
    { apiKey: params.get('apiKey') || 'fake-api-key',
      authDomain: 'bb-test.firebaseapp.com',
      projectId: params.get('projectId') || 'bb-test' },
    emulator ? { emulator } : {}
  );
  window.cloud = cloud;
  window.__ready = true;
  out.textContent = 'ready — BB.cloud initialised' + (emulator ? ' (emulator)' : '');
} catch (e) {
  out.textContent = 'FAILED: ' + e.message;
  window.__error = e.message;
}
</script>
</body>
</html>
